đến báo cáo hiệu quả sau chiến dịch. Là chiến dịch độc lập, đo lường được, có điểm bắt đầu và kết thúc rõ ràng."],"MOD-158":["Chương trình Creator & Influencer","Quản lý liên tục quan hệ hợp tác với creator và influencer để mở rộng độ phủ thương hiệu, xây dựng uy tín và tăng trưởng khán giả. Đảm nhiệm toàn bộ vòng đời hợp tác: tìm kiếm, tiếp cận, quản lý quan hệ, định hướng sáng tạo và theo dõi hiệu quả, đảm bảo nguồn nội dung từ creator nhất quán với mục tiêu thương hiệu."],"MOD-159":["Ra mắt Chương trình Ủng hộ & Giới thiệu","Dự án có cấu trúc để thiết kế, xây dựng và ra mắt chương trình ủng hộ và giới thiệu khách hàng từ đầu. Bao gồm chiến lược, cơ chế giới thiệu, cấu trúc ưu đãi, thiết lập và theo dõi trên HubSpot, tuyển người ủng hộ và kích hoạt nhóm đầu tiên, bàn giao chương trình đã vận hành sẵn sàng quản lý liên tục."],"MOD-160":["Chương trình Ủng hộ & Giới thiệu","Quản lý liên tục chương trình ủng hộ và giới thiệu nhằm biến khách hàng hài lòng thành kênh tăng trưởng. Tuyển và nuôi dưỡng người ủng hộ, quản lý cơ chế giới thiệu và ưu đãi, thúc đẩy hoạt động do khách hàng dẫn dắt như đánh giá, lời chứng thực, giới thiệu và case study để xây dựng niềm tin và tạo pipeline."],"MOD-161":["Tối ưu Quy trình bán hàng & Áp dụng CRM","Liên tục theo dõi và cải thiện việc dùng CRM, tuân thủ quy trình bán hàng và tính nhất quán vận hành của đội bán hàng. Cung cấp góc nhìn liên tục về mức độ áp dụng, độ sạch pipeline và khoảng trống quy trình, giúp củng cố thực hành tốt, xử lý vấn đề tuân thủ và cải thiện chất lượng thực thi có thể đo lường."],"MOD-162":["Tối ưu Tìm khách hàng Outbound","Liên tục tối ưu workflow, sequence và thông điệp tìm khách hàng outbound để tăng tỷ lệ phản hồi, tương tác và tạo pipeline."],"MOD-163":["Tối ưu Pipeline & Dự báo","Duy trì và cải thiện kỷ luật pipeline, độ chính xác dự báo và tính nhất quán của quy trình doanh thu thông qua hỗ trợ vận hành, kiểm tra deal và rà soát phân tích. Giúp lãnh đạo bán hàng xây dựng thói quen dự báo đáng tin cậy, phát hiện deal rủi ro sớm hơn và giữ pipeline sạch để doanh thu dự đoán được."],"MOD-164":["Coaching bán hàng & Nâng cao hiệu suất","Cung cấp coaching bán hàng, củng cố playbook và hỗ trợ hiệu suất liên tục để cải thiện tính nhất quán thực thi và hiệu quả của nhân viên. Hỗ trợ quản lý và nhân viên qua nhịp coaching có cấu trúc, rà soát deal và hoạt động củng cố biến chiến lược thành hành vi bán hàng lặp lại được."],"MOD-165":["Tối ưu Thực thi bán hàng có AI hỗ trợ","Tối ưu việc sử dụng, hiệu quả và mức độ áp dụng workflow bán hàng có AI, hệ thống tìm khách hàng và vận hành doanh thu ứng dụng AI. Đảm bảo công cụ AI cho kết quả chất lượng ổn định theo thời gian bằng cách tinh chỉnh prompt, quản trị sử dụng, theo dõi áp dụng và cải tiến workflow liên tục."],"MOD-166":["Giám sát & Tối ưu Hiệu suất AI","Giám sát và tối ưu liên tục các công cụ, agent và tự động hóa AI đã triển khai để đảm bảo hiệu suất, độ chính xác và tác động kinh doanh ổn định. Theo dõi hiệu quả của Breeze agent, workflow AI tùy chỉnh và hệ thống tự động hóa, phát hiện suy giảm hoặc sai lệch và cải tiến liên tục."],"MOD-167":["Quản lý Quản trị & Tuân thủ AI","Quản lý liên tục khung quản trị, chính sách và nghĩa vụ tuân thủ về AI để việc dùng AI có trách nhiệm, đúng quy định và có thể kiểm toán. Theo dõi quy định AI thay đổi, duy trì chính sách nội bộ, quản lý đánh giá rủi ro cho các trường hợp dùng AI và đảm bảo việc triển khai AI phù hợp tiêu chuẩn đạo đức và yêu cầu pháp lý."],"MOD-168":["Tối ưu Áp dụng & Hỗ trợ năng lực AI","Đo lường và tối ưu liên tục mức độ áp dụng AI trong tổ chức. Giả định đã hoàn tất đào tạo AI ban đầu, tập trung theo dõi nơi việc áp dụng phát triển hoặc chững lại, tìm vướng mắc trong workflow, can thiệp có mục tiêu và cải thiện cách AI được đưa vào vận hành hằng ngày. Không phải đào tạo từ đầu mà là chương trình cải tiến liên tục."],"MOD-169":["Chương trình Thử nghiệm & Đổi mới AI","Chương trình liên tục để xác định, thiết kế và kiểm chứng các trường hợp dùng AI mới trong tổ chức. Chạy các chu kỳ thử nghiệm có cấu trúc từ giả thuyết, thử nghiệm đến kết quả, giúp khách hàng luôn đi đầu trong ứng dụng AI thực tế và liên tục mở rộng lộ trình năng lực AI."],"MOD-170":["Quản trị & Bảo trì Portal HubSpot","Quản trị liên tục HubSpot của khách hàng, gồm bảo trì chủ động và xử lý sự cố. Quản lý quyền truy cập, cấu hình hệ thống, độ sạch dữ liệu, sức khỏe workflow và giám sát tích hợp, đảm bảo nền tảng hoạt động ổn định, dữ liệu sạch và sự cố được xử lý trước khi ảnh hưởng đến kinh doanh. Là lớp vận hành đầy đủ cho khách hàng cần đối tác vận hành HubSpot hằng ngày."],"MOD-171":["Tư vấn chiến lược HubSpot","Dịch vụ tư vấn định kỳ cung cấp hướng dẫn chuyên gia HubSpot, hỗ trợ xử lý sự cố và khuyến nghị chiến lược cho đội ngũ khách hàng đã có người quản trị nội bộ. Bao gồm trả lời câu hỏi kỹ thuật và chiến lược, tư vấn thực hành tốt, rà soát cấu hình trước khi triển khai và chủ động đề xuất khi HubSpot thay đổi. Là lớp chuyên gia bổ trợ, không thay thế đội quản trị nội bộ."],"MOD-172":["Quản trị Dự báo & Pipeline","Hỗ trợ nhịp rà soát pipeline, độ chính xác dự báo và kiểm tra deal, biến dữ liệu CRM thành bức tranh doanh thu đáng tin cậy cho lãnh đạo."],"MOD-173":["Quản lý Hệ thống công nghệ & Tích hợp","Quản lý hệ sinh thái công nghệ GTM: giám sát sức khỏe tích hợp, kiểm tra việc dùng công cụ và định hướng quyết định mua, tự xây hay loại bỏ khi hệ thống phát triển."],"MOD-174":["Tối ưu Workflow & Tự động hóa","Rà soát, cải thiện và mở rộng liên tục workflow và hệ thống tự động hóa HubSpot để duy trì hiệu quả, giảm lỗi và giữ logic tự động phù hợp với quy trình kinh doanh thay đổi. Bao gồm cả sửa tự động hóa bị lỗi hoặc kém hiệu quả và chủ động xây dựng tự động hóa mới để tăng hiệu suất."],"MOD-175":["Tối ưu Dữ liệu & Quy trình","Cải thiện liên tục chất lượng, tính nhất quán và sự phù hợp quy trình của dữ liệu CRM trong HubSpot. Quản lý độ sạch dữ liệu ở quy mô lớn (loại trùng, chuẩn hóa, làm giàu và quản trị) đồng thời điều chỉnh cấu trúc dữ liệu và quy trình theo sự phát triển của tổ chức, để CRM luôn là nguồn dữ liệu chuẩn đáng tin cậy."],"MOD-176":["Tối ưu Báo cáo & Hiệu suất","Duy trì, phát triển và nâng cấp liên tục hệ thống báo cáo và phân tích HubSpot để đội doanh thu có cái nhìn chính xác, hành động được về hiệu suất. Quản lý dashboard và báo cáo hiện có, xây báo cáo mới theo nhu cầu và cải thiện chất lượng, mức độ phù hợp cho từng nhóm, để báo cáo luôn theo kịp doanh nghiệp."],"MOD-177":["Lãnh đạo RevOps bán thời gian","Dịch vụ lãnh đạo RevOps bán thời gian, cung cấp giám sát chiến lược, rà soát hiệu suất và định hướng cải tiến liên tục cho vận hành doanh thu. Giả định phần thực thi đã có người đảm nhận (dịch vụ RevOps khác hoặc đội nội bộ), tập trung hoàn toàn vào lớp chiến lược: định hướng để mọi công việc RevOps luôn đúng ưu tiên."],"MOD-178":["Tư vấn RevOps","Cung cấp quyền tiếp cận có cấu trúc tới chuyên gia RevOps cấp cao qua các buổi tư vấn định kỳ, là lớp tư vấn linh hoạt cho định hướng chiến lược, giải quyết vấn đề và hỗ trợ ra quyết định mà không cần cam kết dịch vụ vận hành đầy đủ."],"MOD-179":["Vận hành Marketing được quản lý","Quản lý liên tục hệ thống vận hành marketing của khách hàng, duy trì sức khỏe tự động hóa, chất lượng dữ liệu, độ chính xác phân khúc, khả năng gửi email và hạ tầng cá nhân hóa giữa các chu kỳ Loop Marketing. Đảm bảo hệ thống chạy sạch để mỗi Loop mới bắt đầu từ nền tảng chính xác và thành quả tích lũy không bị bào mòn."]},"off":{"AI & Automation Solution Design":"Thiết kế giải pháp AI & Tự động hóa","AI Application & Agent Development":"Phát triển ứng dụng & Agent AI","AI Readiness & Opportunity Assessment":"Đánh giá mức sẵn sàng & Cơ hội AI","AI Strategy & Roadmap":"Chiến lược & Lộ trình AI","Account-Based Marketing (ABM) Program":"Chương trình Marketing theo tài khoản (ABM)","Account-Based Marketing (ABM) Strategy":"Chiến lược Marketing theo tài khoản (ABM)","CRM & Data Architecture Design":"Thiết kế CRM & Kiến trúc dữ liệu","Change & Adoption Strategy":"Chiến lược Thay đổi & Áp dụng","Change Management & AI Adoption Programs":"Chương trình Quản lý thay đổi & Áp dụng AI","Change Management Readiness Assessment":"Đánh giá mức sẵn sàng Quản lý thay đổi","Commerce Hub Implementation":"Triển khai Commerce Hub","Content Hub Implementation":"Triển khai Content Hub","Content, SEO & AEO Audit":"Đánh giá Nội dung, SEO & AEO","Content, SEO & AEO Growth Optimization":"Tối ưu tăng trưởng Nội dung, SEO & AEO","Content, SEO & AEO Strategy":"Chiến lược Nội dung, SEO & AEO","Customer Engagement, Community & Advocacy":"Tương tác khách hàng, Cộng đồng & Ủng hộ","Customer Journey & Experience Audit":"Đánh giá Hành trình & Trải nghiệm khách hàng","Data Hub Implementation":"Triển khai Data Hub","Demand Generation & Campaign Program":"Chương trình Tạo nhu cầu & Chiến dịch","GTM Audit":"Đánh giá GTM","GTM Process & Workflow Audit":"Đánh giá Quy trình & Workflow GTM","GTM Strategy & Development":"Xây dựng Chiến lược GTM","GTM Systems & Automation Engineering":"Kỹ thuật Hệ thống & Tự động hóa GTM","HubSpot Onboarding & Core Enablement":"Onboarding & Đào tạo cốt lõi HubSpot","HubSpot Platform Administration & Support":"Quản trị & Hỗ trợ nền tảng HubSpot","Lifecycle Marketing & Funnel Optimization":"Marketing vòng đời & Tối ưu phễu","Loop Marketing Program":"Chương trình Loop Marketing","Managed AI Operations":"Vận hành AI được quản lý","Marketing Hub Implementation":"Triển khai Marketing Hub","Marketing Operations as a Service":"Vận hành Marketing dạng dịch vụ","Marketing Systems Architecture Design":"Thiết kế Kiến trúc hệ thống Marketing","Marketing Systems Engineering":"Kỹ thuật Hệ thống Marketing","Paid Ad & Performance Marketing":"Quảng cáo trả phí & Performance Marketing","Reporting & Analytics Design":"Thiết kế Báo cáo & Phân tích","RevOps Audit":"Đánh giá RevOps","RevOps as a Service":"RevOps dạng dịch vụ","Revenue Process & Workflow Design":"Thiết kế Quy trình & Workflow doanh thu","Sales Enablement & Training":"Hỗ trợ & Đào tạo bán hàng","Sales Hub Implementation":"Triển khai Sales Hub","Sales Onboarding & Training":"Onboarding & Đào tạo bán hàng","Service Hub Implementation":"Triển khai Service Hub","Smart CRM Implementation":"Triển khai Smart CRM"},"pkg":{"PKG-001":["Chuyển đổi GTM","Đại tu toàn diện chiến lược thâm nhập thị trường cho các công ty cần làm rõ ICP, xây dựng lại định vị và gắn kết bán hàng, marketing, RevOps quanh một mô hình GTM thống nhất. Bao gồm chẩn đoán toàn phễu, xây dựng chiến lược và triển khai HubSpot."],"PKG-002":["Triển khai Smart CRM","Xây dựng HubSpot CRM có cấu trúc, tập trung vào kiến trúc dữ liệu, tự động hóa quy trình bán hàng và báo cáo. Dành cho công ty chuyển từ CRM cũ hoặc cần dọn dẹp một hệ thống HubSpot lộn xộn. Kết quả là một CRM mà đội bán hàng thực sự sử dụng."],"PKG-003":["Xây dựng hệ thống Tạo nhu cầu","Xây dựng toàn bộ cỗ máy tạo nhu cầu trong HubSpot: thiết lập Marketing Hub, kiến trúc chiến dịch, quản lý lead, tự động hóa nuôi dưỡng và báo cáo phân bổ. Biến HubSpot từ cơ sở dữ liệu liên hệ thành cỗ máy tạo pipeline chủ động."],"PKG-004":["Chuyển đổi hiệu suất bán hàng","Thiết kế lại quy trình bán hàng, xây dựng hạ tầng HubSpot hỗ trợ và giúp đội ngũ thực thi nhất quán. Kết hợp thiết kế quy trình, cấu hình CRM, công cụ tăng năng suất bán hàng và hạ tầng coaching."],"PKG-005":["Nền tảng RevOps","Thiết lập mô hình vận hành RevOps cho bán hàng, marketing và chăm sóc khách hàng. Bao gồm định nghĩa phễu, thiết kế bàn giao, khung KPI và hạ tầng HubSpot để vận hành và báo cáo toàn bộ vòng đời khách hàng trong một hệ thống."],"PKG-006":["Tăng tốc doanh thu bằng AI","Xác định các trường hợp dùng AI giá trị cao trong toàn bộ bộ phận doanh thu, thiết kế và xây dựng workflow và agent AI trong HubSpot, giúp đội ngũ vận hành với AI trong hoạt động GTM hằng ngày. Từ khám phá cơ hội AI đến triển khai và áp dụng."],"PKG-007":["Cỗ máy tăng trưởng Nội dung & SEO","Xây dựng vận hành nội dung và hạ tầng SEO cần thiết để tạo pipeline tự nhiên tăng trưởng kép. Bao gồm chiến lược SEO/AEO, thiết lập website, vận hành nội dung và cấu hình HubSpot Content Hub để xuất bản, theo dõi và tối ưu ở quy mô lớn."],"PKG-008":["Chuyển đổi Salesforce → HubSpot","Chuyển đổi có cấu trúc từ Salesforce (thường kèm Pardot hoặc Marketing Cloud) sang HubSpot, bao gồm chuyển đổi mô hình dữ liệu, di chuyển bản ghi, ánh xạ lại tích hợp và xây dựng lại quy trình bán hàng. Khách hàng có một HubSpot sạch mà đội ngũ tin tưởng, cùng kế hoạch quản lý thay đổi để đảm bảo được áp dụng thực sự."],"PKG-009":["Cứu & Tối ưu HubSpot","Dọn dẹp và tối ưu có cấu trúc một hệ thống HubSpot hiện có đã trở nên lộn xộn, thiếu nhất quán hoặc ít được dùng. Bao gồm thiết kế lại mô hình dữ liệu, tinh gọn workflow, đại tu báo cáo và đào tạo lại. Mang lại HubSpot mà đội ngũ tự hào và thực sự dùng, không cần làm lại từ đầu."],"PKG-010":["Chương trình Vòng đời & Giữ chân khách hàng","Xây dựng hạ tầng chăm sóc và giữ chân khách hàng trong HubSpot: thiết lập Service Hub, thiết kế giai đoạn vòng đời sau bán, tự động hóa CS, chấm điểm sức khỏe, vòng phản hồi và bàn giao từ bán hàng sang CS. Biến HubSpot từ công cụ bán hàng thành nền tảng vòng đời khách hàng thúc đẩy giữ chân và mở rộng."],"PKG-011":["Cỗ máy bán hàng chủ động","Thiết kế và xây dựng mô hình bán hàng chủ động có hệ thống trong HubSpot: nhắm mục tiêu ICP, tìm khách hàng dựa trên tín hiệu, hạ tầng sequence, agent tìm khách hàng bằng AI và cấu hình CRM để quản lý và báo cáo pipeline chủ động. Khách hàng có một hệ thống outbound lặp lại được và dựa trên dữ liệu, không chỉ là thư viện sequence."],"PKG-012":["Nền tảng & Sẵn sàng dữ liệu","Thiết lập nền tảng dữ liệu sạch, được quản trị tốt trong HubSpot: thiết kế mô hình dữ liệu, dọn dẹp và di chuyển bản ghi, thiết lập pipeline làm giàu dữ liệu, cấu hình Data Hub và hạ tầng báo cáo giúp dữ liệu CRM đáng tin cậy và dùng được. Là bước tiên quyết cho việc áp dụng AI, dự báo nghiêm túc và báo cáo cấp lãnh đạo."],"PKG-013":["Ra mắt Loop Marketing","Xây dựng toàn bộ hệ thống Loop Marketing trong HubSpot: từ mã hóa bản sắc thương hiệu và chiến lược chiến dịch đến hạ tầng thu thập tín hiệu và cá nhân hóa, hệ thống sản xuất nội dung bằng AI và lớp phân tích Loop. Không chỉ là thiết lập marketing mà là cỗ máy marketing liên tục tối ưu, với chu kỳ Loop đầu tiên được thực hiện trong dự án."]}},"id":{"mod":{"MOD-001":["Audit Strategi Pasar & ICP","Mengevaluasi strategi penargetan pasar, definisi ICP, dan pendekatan segmentasi klien saat ini untuk menemukan ketidakselarasan, segmen yang belum digarap, dan peluang fokus yang lebih tajam. Menilai apakah bisnis mengejar pelanggan yang tepat dengan cara yang tepat, dan apakah ICP didasarkan pada data pelanggan nyata yang terbukti dari hasil, bukan asumsi."],"MOD-002":["Audit Positioning, Pesan & Penawaran","Menilai kejelasan, diferensiasi, dan resonansi pasar dari positioning, pesan, dan struktur penawaran klien. Mengevaluasi apakah proposisi nilai menarik dan berbeda, pesan konsisten di semua kanal dan tim, serta penawaran disusun untuk mengonversi pembeli yang tepat di titik harga yang tepat."],"MOD-003":["Audit Demand Generation & Model Pertumbuhan","Mengevaluasi seberapa efektif bisnis menghasilkan pipeline melalui kanal, kampanye, dan investasi. Menilai model demand generation secara menyeluruh, dari bauran kanal dan alokasi anggaran hingga kinerja kampanye dan kontribusi pipeline, untuk menemukan bagian yang berhasil, yang kurang optimal, dan peluang perbaikan dengan dampak terbesar."],"MOD-004":["Audit Konversi Funnel & Siklus Hidup","Menilai seberapa efisien lead dan kontak bergerak melalui tahap siklus hidup dari akuisisi hingga pendapatan closed, menemukan celah konversi, titik kebocoran, masalah kecepatan, dan definisi tahap yang tidak selaras. Mencakup siklus pra-pelanggan dari top-of-funnel melalui MQL, SQL, hingga closed-won. Berbeda dari Audit Siklus Hidup Pelanggan karena berfokus pada perjalanan akuisisi dan konversi."],"MOD-005":["Audit Sales Motion & Manajemen Pipeline","Mengevaluasi efektivitas eksekusi proses sales, disiplin manajemen pipeline, dan praktik progres deal. Berfokus pada apa yang terjadi setelah peluang masuk pipeline: bagaimana deal dikelola, kesehatan pipeline dijaga, akurasi forecast dicapai, dan celah eksekusi mana yang menyebabkan deal mundur atau pendapatan hilang."],"MOD-006":["Audit Siklus Hidup Pelanggan & Model Pertumbuhan","Mengevaluasi bagaimana bisnis disusun untuk mempertahankan dan memperluas pelanggan setelah akuisisi, menilai efektivitas strategis model siklus hidup, motion ekspansi, dan pengungkit pertumbuhan pascapenjualan. Mencakup efektivitas onboarding, kesehatan retensi, penangkapan peluang ekspansi, dan model pertumbuhan pendapatan dari pelanggan yang ada. Dimulai di titik funnel akuisisi berakhir."],"MOD-007":["Audit Keselarasan RevOps","Mengevaluasi seberapa baik konfigurasi CRM, infrastruktur data, integrasi, dan sistem pelaporan klien selaras dengan dan mendukung strategi GTM serta tujuan bisnis. Ini tinjauan keselarasan strategis, bukan penilaian kesehatan teknis, yang melihat apakah teknologi pendapatan mendukung keputusan yang tepat, menampilkan data yang tepat, dan sesuai cara bisnis masuk ke pasar."],"MOD-008":["Audit Kerangka KPI & Manajemen Kinerja","Mengevaluasi kerangka KPI, sistem pengukuran, dan infrastruktur pelaporan kinerja klien untuk menilai apakah metrik yang tepat dilacak, didefinisikan konsisten antartim, dan apakah pelaporan memberi pimpinan visibilitas untuk mengambil keputusan. Menemukan celah pengukuran, metrik yang tidak selaras antartim, dan titik buta pelaporan."],"MOD-009":["Audit Desain Organisasi & Keselarasan GTM","Menilai struktur organisasi go-to-market, definisi peran, dan keselarasan lintas fungsi antara marketing, sales, dan customer success. Mengevaluasi apakah organisasi disusun untuk menjalankan strategi GTM secara efektif, menemukan celah cakupan, peran yang ambigu, akuntabilitas yang tidak selaras, dan inefisiensi struktural."],"MOD-010":["Identifikasi & Penilaian Peluang AI","Mengidentifikasi dan mengevaluasi potensi use case AI di seluruh bisnis dengan menganalisis workflow, proses, dan data untuk menemukan peluang otomatisasi, augmentasi, dan efisiensi. Memberi gambaran arah tentang di mana AI dapat memberi nilai dan seberapa layak setiap peluang."],"MOD-011":["Penilaian Kesiapan Data untuk AI","Menilai apakah fondasi data organisasi dapat mendukung use case AI, termasuk kualitas, struktur, aksesibilitas, dan kelengkapan data."],"MOD-012":["Penilaian Tools & Platform AI","Mengevaluasi stack AI dan teknologi saat ini untuk menentukan celah kemampuan, redundansi, dan kesiapan mendukung use case AI."],"MOD-013":["Penilaian Tata Kelola & Risiko AI","Mengevaluasi kesiapan organisasi menerapkan AI secara bertanggung jawab dengan menilai struktur tata kelola, praktik manajemen risiko, dan pertimbangan kepatuhan."],"MOD-014":["Penilaian Kesiapan Organisasi untuk AI","Menilai kesiapan orang, keterampilan, dan budaya organisasi untuk mengadopsi dan meningkatkan skala AI secara efektif."],"MOD-015":["Penilaian Keselarasan & Dukungan Pimpinan","Mengevaluasi keselarasan eksekutif, kekuatan sponsor, dan kesiapan pimpinan untuk mendorong dan mempertahankan perubahan organisasi."],"MOD-016":["Penilaian Peran, Proses & Akuntabilitas","Mengevaluasi kejelasan peran, tanggung jawab, dan proses untuk memastikan akuntabilitas dan mengurangi hambatan selama perubahan."],"MOD-017":["Penilaian Pemangku Kepentingan & Kesiapan Adopsi","Menilai kesadaran, dukungan, dan kesiapan pemangku kepentingan untuk mengadopsi cara kerja baru, termasuk risiko penolakan dan kelelahan akibat perubahan."],"MOD-018":["Penilaian Komunikasi & Enablement Perubahan","Mengevaluasi efektivitas strategi komunikasi dan infrastruktur enablement yang diperlukan agar perubahan berhasil diadopsi."],"MOD-019":["Penilaian Kesehatan Sistem & Instance","Mengevaluasi kesehatan, konfigurasi, dan tata kelola instance CRM secara keseluruhan untuk menemukan inefisiensi, kesalahan konfigurasi, utang teknis, dan celah tata kelola. Tinjauan operasional yang luas, bukan pendalaman model data, kualitas data, atau integrasi (yang masing-masing punya penilaian khusus). Memberi gambaran prioritas tentang bagian yang berjalan baik dan yang perlu perhatian sebelum investasi lanjutan."],"MOD-020":["Penilaian Model Data & Arsitektur CRM","Mengevaluasi struktur dan desain model data HubSpot CRM untuk menilai apakah mendukung pelaporan, otomatisasi, dan proses bisnis yang skalabel. Memeriksa arsitektur objek, properti, asosiasi, dan pipeline untuk menemukan celah struktural, keterbatasan desain, dan ketidaksesuaian dengan proses bisnis yang sebenarnya."],"MOD-021":["Penilaian Kualitas & Integritas Data","Menilai kelengkapan, akurasi, konsistensi, dan keandalan data CRM untuk menentukan apakah dapat mendukung pelaporan, otomatisasi, dan pengambilan keputusan. Menilai kesehatan data itu sendiri, bukan struktur model, untuk menemukan record yang tidak lengkap, tidak akurat, duplikat, atau formatnya tidak konsisten sehingga melemahkan CRM sebagai sumber kebenaran."],"MOD-022":["Penilaian Integrasi & Aliran Data","Mengevaluasi integrasi sistem, sinkronisasi data, dan keandalan aliran data di seluruh stack teknologi untuk menemukan risiko, inefisiensi, dan celah."],"MOD-023":["Discovery Pemangku Kepentingan, Peran & Proses","Memetakan kondisi peran, tanggung jawab, dan proses GTM saat ini melalui discovery pemangku kepentingan yang terstruktur. Memberi gambaran jelas siapa memegang apa, bagaimana pekerjaan benar-benar dilakukan di marketing, sales, dan customer success, dan proses mana yang terdefinisi atau berjalan informal. Menjadi fondasi untuk pemetaan workflow dan perbaikan selanjutnya. Mendokumentasikan realitas operasional, bukan menilai desain struktur organisasi."],"MOD-024":["Pemetaan Workflow & Analisis Serah Terima","Mendokumentasikan dan menganalisis workflow end-to-end yang mengatur perpindahan pekerjaan antara marketing, sales, dan customer success, terutama pada titik serah terima yang sering menimbulkan hambatan, miskomunikasi, dan proses yang terputus. Mengubah temuan menjadi peta workflow visual yang menunjukkan alur kerja nyata dibandingkan yang dimaksudkan, serta di mana serah terima yang gagal menimbulkan masalah."],"MOD-025":["Penilaian Keselarasan Proses dengan Sistem","Menilai seberapa baik proses GTM yang telah ditetapkan tercermin, dikonfigurasi, dan didukung dalam sistem teknologi, terutama HubSpot. Menemukan di mana konfigurasi mendukung proses dengan benar, di mana menimbulkan hambatan atau solusi darurat, dan di mana proses dijalankan sepenuhnya di luar sistem. Dinilai pada tingkat eksekusi workflow."],"MOD-026":["Penilaian Funnel, SLA & Ritme Operasional","Mengevaluasi lapisan operasional dan tata kelola funnel GTM: apakah SLA didefinisikan jelas, diterapkan konsisten, dan diukur, serta apakah ritme operasional di marketing, sales, dan CS memberi visibilitas dan akuntabilitas yang cukup. Berfokus pada tata kelola proses, bukan data kinerja funnel."],"MOD-027":["Audit Perjalanan Pelanggan","Memetakan perjalanan pelanggan end-to-end untuk menemukan celah, inkonsistensi, dan hambatan di setiap titik sentuh."],"MOD-028":["Audit Pengalaman Konversi","Mengevaluasi pengalaman pengguna, kejelasan pesan, dan hambatan di titik konversi (website, formulir, landing page, dan CTA) untuk menemukan di mana prospek berhenti atau kehilangan minat."],"MOD-029":["Audit Pengalaman Sales & Serah Terima","Menilai pengalaman pembeli, bukan eksekusi penjual, selama interaksi sales dan serah terima antartim, melihat apa yang dirasakan dan dialami prospek di setiap tahap."],"MOD-030":["Audit Onboarding & Pengalaman Pelanggan","Mengevaluasi pengalaman onboarding, waktu hingga mendapat nilai, dan interaksi awal pascapenjualan untuk menemukan hambatan, celah, dan risiko churn di fase awal hubungan yang krusial."],"MOD-031":["Audit Pengalaman Retensi & Ekspansi","Menilai apa yang benar-benar dialami pelanggan dalam interaksi retensi dan ekspansi, berbeda dari desain struktural bisnis untuk pertumbuhan, dengan melihat kualitas keterlibatan, titik sentuh ekspansi, dan pengalaman penerimaan nilai berkelanjutan."],"MOD-032":["Audit Dukungan & Layanan Mandiri","Mengevaluasi pengalaman pelanggan dalam interaksi dukungan dan sumber layanan mandiri: bagaimana pelanggan mendapat bantuan, seberapa efektif masalah diselesaikan, dan seberapa baik kanal layanan mandiri mengurangi hambatan dan meningkatkan kepuasan."],"MOD-033":["Audit SEO & AEO","Mengevaluasi struktur konten, SEO teknis, dan kesiapan pencarian AI untuk menemukan celah dalam keterlihatan, pengindeksan, dan kemampuan menjadi jawaban di mesin pencari dan platform AI."],"MOD-034":["Strategi ICP & Segmentasi","Mendefinisikan profil pelanggan ideal dan strategi segmentasi untuk memprioritaskan audiens bernilai tertinggi bagi pertumbuhan."],"MOD-035":["Strategi Positioning & Pesan","Mendefinisikan cara perusahaan berbeda dan mengomunikasikan nilai kepada pelanggan sasaran."],"MOD-036":["Strategi GTM Motion, Kanal & Siklus Hidup","Mendefinisikan cara bisnis mengakuisisi, mengonversi, mempertahankan, dan memperluas pelanggan di berbagai kanal dan tahap siklus hidup."],"MOD-037":["Perencanaan & Penyusunan Peta Jalan GTM","Menerjemahkan strategi menjadi rencana eksekusi berprioritas dengan inisiatif, jadwal, dan metrik keberhasilan yang jelas."],"MOD-038":["Strategi SEO & AEO","Menyusun strategi konten dan pencarian yang skalabel, dioptimalkan untuk mesin pencari tradisional dan penemuan berbasis AI."],"MOD-039":["Strategi & Desain Program ABM","Menyusun strategi account-based marketing yang selaras dengan akun sasaran, sales motion, dan target pendapatan."],"MOD-040":["Strategi Data & Penargetan ABM","Mendefinisikan cara data akun, sinyal, dan pengayaan data digunakan untuk mendorong penargetan dan keterlibatan."],"MOD-041":["Strategi Prioritas Use Case AI & Business Case","Mengidentifikasi dan memprioritaskan use case AI berdasarkan dampak bisnis, kelayakan, dan keselarasan strategis."],"MOD-042":["Strategi Kapabilitas & Kematangan AI","Mendefinisikan kapabilitas yang diperlukan untuk mendukung adopsi AI di bidang data, sistem, tata kelola, dan tim."],"MOD-043":["Perencanaan Investasi & Peta Jalan AI","Menyusun peta jalan adopsi AI bertahap, termasuk urutan, prioritas investasi, dan hasil yang diharapkan."],"MOD-044":["Desain Strategi & Pendekatan Perubahan","Mendefinisikan strategi menyeluruh untuk mengelola dan mendorong perubahan organisasi yang selaras dengan tujuan bisnis."],"MOD-045":["Strategi Keterlibatan & Komunikasi Pemangku Kepentingan","Mendefinisikan cara pemangku kepentingan dilibatkan, diinformasikan, dan diselaraskan sepanjang proses perubahan."],"MOD-046":["Strategi Pelatihan & Enablement","Mendefinisikan cara tim dilatih dan dimampukan untuk mengadopsi proses, sistem, atau cara kerja baru."],"MOD-047":["Perencanaan Adopsi & Peluncuran","Mendefinisikan cara perubahan diluncurkan di seluruh organisasi, termasuk urutan, uji coba, dan pendekatan peningkatan skala."],"MOD-048":["Desain Model Data & Sistem CRM","Merancang model data, objek, dan struktur CRM yang dibutuhkan untuk mendukung proses GTM dan pelaporan."],"MOD-049":["Desain Integrasi & Aliran Data","Mendefinisikan cara data mengalir antarsistem dan cara integrasi sebaiknya disusun."],"MOD-050":["Desain Tata Kelola & Manajemen Data","Mendefinisikan standar dan proses untuk memastikan kualitas, konsistensi, dan keandalan data."],"MOD-051":["Desain Sales Motion & Proses","Merancang proses sales terstruktur yang selaras dengan GTM motion dan perjalanan pembeli."],"MOD-052":["Desain Arsitektur Kampanye & Funnel","Merancang struktur kampanye marketing dan arsitektur funnel untuk mendukung demand generation dan konversi."],"MOD-053":["Desain Siklus Hidup Pelanggan & Serah Terima","Merancang tahap siklus hidup dan proses serah terima antara tim marketing, sales, dan pelanggan."],"MOD-054":["Desain Use Case & Workflow AI","Merancang workflow dan otomatisasi berbasis AI yang selaras dengan use case prioritas."],"MOD-055":["Strategi & Desain Agen AI","Mendefinisikan arsitektur dan perilaku agen AI yang mendukung workflow GTM."],"MOD-056":["Desain Data & Tata Kelola AI","Mendefinisikan cara data disusun, dikelola, dan diakses untuk sistem AI."],"MOD-057":["Desain Kerangka KPI & Pengukuran","Mendefinisikan metrik kinerja dan struktur pengukuran yang selaras dengan strategi GTM."],"MOD-058":["Desain Arsitektur Dashboard & Pelaporan","Merancang dashboard dan sistem pelaporan untuk visibilitas dan pengambilan keputusan."],"MOD-059":["Desain Arsitektur Sinyal & Personalisasi Marketing","Merancang arsitektur data, aliran sinyal, dan kerangka token personalisasi yang menjalankan Loop Marketing dalam skala besar. Mendefinisikan cara sinyal perilaku, data pengayaan, dan properti CRM dipetakan ke use case personalisasi di email, web, dan konten, menjadi cetak biru bagi semua implementasi sistem marketing selanjutnya."],"MOD-060":["Implementasi Arsitektur & Model Data CRM","Mengimplementasikan model data CRM, termasuk objek, properti, tahap siklus hidup, dan pipeline, sesuai arsitektur yang dirancang."],"MOD-061":["Penyiapan CRM","Mengonfigurasi pengaturan inti CRM, akses pengguna, izin, dan penyiapan sistem dasar."],"MOD-062":["Migrasi Data & Implementasi Kualitas Data CRM","Menyiapkan, memigrasikan, dan memvalidasi data ke CRM agar akurat, konsisten, dan dapat digunakan."],"MOD-063":["Implementasi Proses Sales & Manajemen Lead","Mengimplementasikan proses sales dan workflow manajemen lead yang selaras dengan GTM motion dan siklus hidup yang ditetapkan."],"MOD-064":["Implementasi Otomatisasi & Workflow","Membangun workflow otomatis untuk menyederhanakan proses, menegakkan tata kelola, dan meningkatkan efisiensi operasional."],"MOD-065":["Implementasi Pelaporan & Dashboard","Membangun laporan dan dashboard untuk memberi visibilitas atas kinerja pipeline, aktivitas sales, dan forecasting."],"MOD-066":["Implementasi Integrasi Native HubSpot","Mengimplementasikan dan mengonfigurasi integrasi native dari HubSpot Marketplace untuk menghubungkan sistem, menyinkronkan data, dan memungkinkan workflow lintas tools yang mulus."],"MOD-067":["Penyiapan Marketing Hub","Mengonfigurasi pengaturan dasar Marketing Hub, domain, dan infrastruktur sistem yang dibutuhkan untuk eksekusi marketing."],"MOD-068":["Penyiapan Manajemen Lead & Otomatisasi Siklus Hidup","Mengimplementasikan manajemen siklus hidup lead, scoring, dan otomatisasi untuk mengelola progres prospek dari lead menjadi pelanggan."],"MOD-069":["Penyiapan Kampanye, Konversi & Kanal","Mengimplementasikan struktur kampanye, jalur konversi, dan mekanisme pelacakan untuk mendukung demand generation dan atribusi."],"MOD-070":["Konfigurasi HubSpot AEO","Mengonfigurasi fitur AEO native HubSpot: menyiapkan brand voice, mengonfigurasi dashboard pemantauan AEO, menghubungkan tool dengan konten dan domain yang tepat, serta menetapkan pelacakan dasar. Menyiapkan instrumen untuk mengukur dan meningkatkan visibilitas di answer engine AI."],"MOD-071":["Implementasi Email Marketing & Otomatisasi Nurture","Membangun program email marketing dan workflow nurture untuk melibatkan lead di sepanjang funnel."],"MOD-072":["Implementasi Segmentasi & Personalisasi","Mengimplementasikan kerangka segmentasi dan kemampuan personalisasi untuk memberikan pengalaman marketing yang tertarget."],"MOD-073":["Implementasi Pelaporan & Atribusi Marketing","Membangun sistem pelaporan dan model atribusi untuk mengukur kinerja marketing dan dampaknya terhadap pendapatan."],"MOD-074":["Penyiapan Content Hub","Mengonfigurasi pengaturan dasar Content Hub, sistem merek, dan tools konten inti untuk pembuatan dan pengelolaan konten."],"MOD-075":["Desain Website","Merancang struktur, pengalaman pengguna, dan sistem visual website yang selaras dengan strategi konversi dan konten."],"MOD-076":["Pengembangan Website & CMS","Membangun website dan infrastruktur CMS di HubSpot, termasuk theme, template, modul, dan integrasi."],"MOD-077":["Migrasi Konten & Penyiapan Arsitektur URL","Memigrasikan konten yang ada ke HubSpot sambil mempertahankan nilai SEO, struktur, dan pengalaman pengguna."],"MOD-078":["Penyiapan SEO, AEO & Performa Teknis","Mengonfigurasi infrastruktur CMS untuk pencarian: arsitektur URL, sitemap, canonical, kecepatan halaman, Core Web Vitals, mobile, dan template structured data di level theme/template. Membuat website kuat secara teknis untuk mesin pencari dan crawler AI."],"MOD-079":["Penyiapan Operasional, Tata Kelola & Personalisasi Konten","Mengimplementasikan workflow konten, standar tata kelola, dan kemampuan personalisasi agar operasional konten konsisten dan skalabel."],"MOD-080":["Pelaporan & Analitik Konten","Mengimplementasikan pelacakan kinerja dan analitik konten untuk mengukur dan memberikan nilai."],"MOD-081":["Implementasi Pengalaman Membership","Layanan terstruktur untuk merancang, membangun, dan mengoperasikan ekosistem member di HubSpot yang menghasilkan pendapatan atau mendorong keterlibatan."],"MOD-082":["Implementasi Proses Sales & Pipeline","Mengimplementasikan proses sales, pipeline, dan workflow manajemen lead yang selaras dengan sales motion dan siklus hidup yang ditetapkan."],"MOD-083":["Implementasi Tools Produktivitas & Enablement Sales","Mengimplementasikan tools produktivitas sales untuk meningkatkan efisiensi, konsistensi, dan eksekusi tim sales."],"MOD-084":["Konfigurasi & Deployment Prospecting Agent","Mengimplementasikan dan menerapkan agen prospecting berbasis AI, termasuk logika penargetan, personalisasi, dan integrasi workflow."],"MOD-085":["Implementasi Pelaporan Sales & Forecasting","Membangun sistem pelaporan dan dashboard untuk visibilitas kinerja pipeline, forecasting, dan produktivitas sales."],"MOD-086":["Implementasi Teritori & Segmentasi Akun","Mengimplementasikan model teritori, segmentasi akun, dan struktur kepemilikan untuk cakupan sales yang efisien."],"MOD-087":["Penyiapan Commerce Hub & Pembayaran","Mengonfigurasi pengaturan dasar Commerce Hub, infrastruktur pembayaran, dan kemampuan commerce di tingkat sistem."],"MOD-088":["Implementasi Pustaka Produk & Arsitektur Harga","Mengimplementasikan katalog produk dan struktur harga yang dibutuhkan untuk penawaran, penagihan, dan pelaporan."],"MOD-089":["Implementasi CPQ (Konfigurasi & Otomatisasi Penawaran)","Mengimplementasikan pembuatan penawaran, logika harga, dan workflow persetujuan untuk penawaran sales yang cepat dan akurat."],"MOD-090":["Implementasi Manajemen Langganan & Penagihan","Mengimplementasikan manajemen siklus hidup langganan, logika penagihan, dan proses pendapatan berulang."],"MOD-091":["Implementasi Checkout, Pembayaran & Penagihan","Mengimplementasikan pengalaman checkout dan workflow penagihan pembayaran untuk transaksi pelanggan yang mulus."],"MOD-092":["Otomatisasi Siklus Pendapatan & Integrasi Sistem Keuangan","Mengimplementasikan otomatisasi siklus pendapatan end-to-end dan mengintegrasikan sistem keuangan agar operasional akurat dan skalabel."],"MOD-093":["Implementasi Pelaporan Pendapatan, Kepatuhan & Tata Kelola","Mengimplementasikan pelaporan pendapatan, visibilitas keuangan, dan kerangka tata kelola untuk mendukung kepatuhan dan pengambilan keputusan."],"MOD-094":["Penyiapan Service Hub","Mengonfigurasi pengaturan dasar Service Hub dan kanal komunikasi pelanggan untuk operasional dukungan."],"MOD-095":["Implementasi Pipeline Tiket & SLA","Mengimplementasikan pipeline tiket, SLA, dan workflow layanan inti untuk mengelola permintaan dukungan pelanggan."],"MOD-096":["Implementasi Routing, Otomatisasi & Operasional Layanan","Mengimplementasikan logika routing dan otomatisasi untuk penugasan tiket yang efisien, pengelolaan beban kerja, dan kolaborasi internal."],"MOD-097":["Implementasi Workspace Help Desk & Produktivitas Agen","Mengonfigurasi workspace Help Desk dan tools agen untuk meningkatkan efisiensi, visibilitas, dan kinerja."],"MOD-098":["Implementasi Layanan Mandiri, Basis Pengetahuan & Portal Pelanggan","Mengimplementasikan pengalaman layanan mandiri untuk mengurangi beban dukungan dan mempermudah pelanggan mengakses informasi."],"MOD-099":["Implementasi Sistem Customer Success & Umpan Balik","Mengimplementasikan workflow customer success, skor kesehatan, dan sistem umpan balik untuk mendorong retensi dan kepuasan."],"MOD-100":["Konfigurasi & Deployment Customer Agent","Mengimplementasikan agen dukungan pelanggan berbasis AI untuk menangani pertanyaan, membantu pengguna, dan meneruskan ke agen manusia bila perlu."],"MOD-101":["Implementasi Pelaporan & Analitik Layanan","Membangun sistem pelaporan untuk visibilitas kinerja dukungan, kepuasan pelanggan, dan efisiensi operasional."],"MOD-102":["Penyiapan Data Hub","Membangun infrastruktur dasar Data Hub dan arsitektur dataset yang menopang semua operasional data, pelaporan, dan kemampuan AI. Mencakup konfigurasi awal Data Hub, desain dan pembangunan dataset, penyelarasan model data, serta keputusan struktural tentang cara data mengalir dan dapat dikueri di HubSpot."],"MOD-103":["Implementasi Integrasi & Sinkronisasi Data","Mengimplementasikan koneksi sinkronisasi data dua arah dan satu arah antara HubSpot dan sistem eksternal menggunakan infrastruktur sinkronisasi Data Hub. Mengonfigurasi pemetaan field, logika sinkronisasi, aturan penyelesaian konflik, dan transformasi data agar aliran data bersih dan andal."],"MOD-104":["Implementasi Kualitas Data, Pengayaan & Data Intent","Mengimplementasikan kemampuan native HubSpot untuk kualitas data, pengayaan, dan data intent di Data Hub. Mengonfigurasi otomatisasi kualitas data agar record bersih dan konsisten; menyiapkan HubSpot Data Enrichment untuk melengkapi data kontak dan perusahaan secara otomatis; serta mengaktifkan Buyer Intent untuk menampilkan akun dengan sinyal pembelian. Bagian dari pembangunan awal Data Hub, mengonfigurasi tools native HubSpot alih-alih membangun sistem sinyal kustom."],"MOD-105":["Pemodelan Data, Kalkulasi & Penyelarasan Pendapatan","Merancang dan mengimplementasikan pemodelan data, properti terhitung, dan struktur data pendapatan untuk business intelligence dan pelaporan yang akurat di HubSpot. Menerjemahkan model pendapatan dan logika bisnis klien ke lapisan data HubSpot, memastikan metrik terpenting (pipeline, pendapatan, retensi, LTV, churn) dihitung benar, didefinisikan konsisten, dan tersedia di semua laporan dan dashboard."],"MOD-106":["Implementasi Otomatisasi, Workflow & Logika Terprogram","Mengimplementasikan kemampuan otomatisasi lanjutan Data Hub: workflow terprogram, custom coded action, dan logika berbasis event, untuk otomatisasi proses bisnis yang lebih kompleks dari workflow standar HubSpot. Bagian dari pembangunan awal Data Hub, bukan proyek engineering terpisah."],"MOD-107":["Aktivasi Data, Agen AI & Intelijen Lintas Hub","Mengimplementasikan strategi aktivasi data, agen data AI, dan intelijen lintas hub agar data bekerja di marketing, sales, dan layanan."],"MOD-108":["Implementasi Tata Kelola, Pemantauan & Pelaporan Data","Mengimplementasikan kerangka tata kelola, sistem pemantauan, dan infrastruktur pelaporan agar Data Hub berjalan andal, konsisten, dan kesehatan datanya terlihat jelas oleh pemangku kepentingan. Mencakup penerapan kebijakan tata kelola data, penyiapan pemantauan operasional, dan lapisan pelaporan yang membuat pimpinan dan tim operasional yakin pada data yang dipakai untuk keputusan."],"MOD-109":["Pengembangan Asisten AI Kustom (Berbasis LLM)","Merancang dan membangun asisten AI kustom menggunakan large language model (misalnya GPT, Claude, Gemini) untuk use case bisnis tertentu."],"MOD-110":["Pengembangan Agen AI Kustom","Merancang dan membangun agen AI yang dapat menjalankan tugas multi-langkah secara mandiri, menggunakan tools, mengambil keputusan, dan menyelesaikan workflow dalam batas yang ditentukan. Melampaui asisten AI percakapan dengan membangun sistem yang bertindak: mengkueri data, memanggil API, memicu workflow HubSpot, dan menyelesaikan tugas kompleks dengan intervensi manusia minimal. Untuk kasus di mana otomatisasi tradisional tidak cukup."],"MOD-111":["Implementasi Sistem Multi-Agen & Orkestrasi","Merancang dan mengimplementasikan sistem multi-agen di mana agen AI khusus bekerja terkoordinasi untuk menyelesaikan workflow kompleks yang tidak dapat ditangani satu agen. Merancang seluruh jaringan agen, mendefinisikan peran, protokol komunikasi, logika orkestrasi, dan mekanisme serah terima untuk sistem AI yang andal dan skalabel."],"MOD-112":["Pengembangan HubSpot Breeze Assistant","Merancang dan mengonfigurasi Breeze Assistant kustom di HubSpot, menyesuaikan kemampuan AI native platform dengan workflow, brand voice, dan kebutuhan operasional klien. Mencakup konfigurasi prompt, penyiapan asisten konten, integrasi data CRM untuk jawaban kontekstual, dan integrasi workflow, menghadirkan pengalaman AI native HubSpot tanpa pengembangan aplikasi di luar platform."],"MOD-113":["Context Engineering & Konfigurasi Pengetahuan","Merancang dan mengodekan konteks bisnis seperti ICP, pesan, proses, pengetahuan bisnis, aturan, logika keputusan, dan struktur data ke dalam sistem AI agar hasilnya akurat, konsisten, dan selaras."],"MOD-114":["Rekayasa Otomatisasi & Workflow GTM Lanjutan","Merancang dan mengimplementasikan sistem otomatisasi kompleks lintas objek dan proses HubSpot untuk eksekusi GTM yang skalabel. Melampaui penyiapan workflow standar dengan logika canggih seperti pohon keputusan multi-cabang, otomatisasi lintas objek, custom coded action, dan pemicu perilaku yang menegakkan strategi GTM tanpa intervensi manual."],"MOD-115":["Sistem Pengayaan Data & Aktivasi Sinyal","Mengimplementasikan pipeline pengayaan data, integrasi sinyal eksternal, dan workflow aktivasi yang meningkatkan penargetan, segmentasi, dan intelijen GTM. Membangun infrastruktur data yang memasok eksekusi GTM, memastikan data dan sinyal perilaku yang tepat sampai ke sistem yang tepat pada waktu yang tepat."],"MOD-116":["Rekayasa Sistem Outbound & Prospecting","Merancang dan membangun sistem outbound dan prospecting otomatis yang menggabungkan data CRM, sinyal perilaku, dan pesan terstruktur untuk menghasilkan pipeline secara efisien dalam skala besar. Membangun infrastruktur teknis di balik motion outbound, dari identifikasi dan prioritas prospek berbasis data hingga pemicu sequence otomatis dan eksekusi multi-kanal."],"MOD-117":["Integrasi & Orkestrasi Lintas Sistem","Mengimplementasikan integrasi dan mengorkestrasi aliran data antara HubSpot dan sistem eksternal menggunakan konektor native, platform middleware, dan tools integrasi HubSpot tanpa pengembangan kode kustom. Memastikan data yang tepat berpindah antarsistem secara andal dan memicu tindakan lanjutan yang tepat. Berbeda dari pengembangan API kustom karena memakai tools native dan low-code."],"MOD-118":["Pengembangan Sistem Eksperimen & Pertumbuhan","Merancang dan membangun infrastruktur teknis untuk eksperimen GTM terstruktur, sehingga klien dapat menguji, mengukur, dan mengiterasi penargetan, pesan, otomatisasi, dan workflow secara sistematis. Mengubah eksperimen ad hoc menjadi sistem berulang dengan hipotesis terstruktur, pengukuran ketat, dan pembelajaran yang terus bertambah menjadi keunggulan pertumbuhan."],"MOD-119":["Pengembangan API & Webhook Kustom","Merancang dan membangun integrasi kustom antara HubSpot dan sistem eksternal menggunakan API, webhook, dan middleware khusus ketika tools integrasi standar tidak memenuhi kebutuhan. Menangani sinkronisasi data kompleks, pemicu workflow lanjutan, dan interoperabilitas sistem yang membutuhkan pengembangan, bukan konfigurasi."],"MOD-120":["Implementasi Pipeline Penangkapan Sinyal & Pengayaan","Membangun infrastruktur teknis untuk menangkap sinyal perilaku dari web, email, dan konten, memperkaya record kontak dan perusahaan dari sumber data pihak ketiga, dan mengaktifkan properti yang diperkaya sebagai segmen dinamis dan token personalisasi. Fondasi data untuk Loop Marketing yang sangat personal dalam skala besar."],"MOD-121":["Pembangunan Arsitektur Otomatisasi Marketing & Operasional Loop","Mengimplementasikan tulang punggung otomatisasi yang menjalankan Loop Marketing sebagai sistem berkelanjutan. Membangun logika pemicu, workflow routing konten, percabangan nurture, dan orkestrasi tahap yang menghubungkan Express, Tailor, Amplify, dan Evolve secara terprogram, agar setiap siklus Loop berjalan dengan upaya manual minimal dan terus membaik."],"MOD-122":["Pembangunan Sistem Produksi Konten AI","Merancang dan membangun infrastruktur operasional untuk produksi konten berbantuan AI dalam skala besar, mesin di balik tahap Tailor pada Loop Marketing. Menyediakan pustaka prompt, templat brief, workflow AI per format, dan proses tinjauan editorial agar tim menghasilkan konten personal berkualitas tinggi secara konsisten dan lebih cepat."],"MOD-123":["Implementasi Mesin Personalisasi & Smart Content","Mengimplementasikan kemampuan personalisasi canggih yang menghadirkan pengalaman dinamis di email dan web menggunakan data kontak yang diperkaya, sinyal perilaku, dan properti CRM. Melampaui segmentasi dasar dengan mesin personalisasi sejati: aturan smart content, kerangka token dinamis, dan routing audiens berbasis perilaku agar setiap titik sentuh relevan bagi individu."],"MOD-124":["Pembangunan Sistem Analitik & Intelijen Loop","Mengimplementasikan lapisan Evolve Loop Marketing: analitik, pencatatan pembelajaran, dan infrastruktur intelijen yang mengubah data kampanye menjadi wawasan terstruktur untuk siklus Loop berikutnya. Membangun sistem pelaporan, pelacakan kinerja konten, model atribusi, dan kerangka retrospektif agar Loop Marketing menjadi sistem yang terus bertumbuh, bukan kampanye terpisah."],"MOD-125":["Onboarding & Pelatihan Inti HubSpot","Keterlibatan onboarding terstruktur yang membuat tim klien percaya diri menggunakan HubSpot setelah implementasi. Mencakup orientasi platform, pelatihan fitur inti, dan panduan workflow dasar untuk hub yang tercakup, agar setiap pengguna dapat memakai HubSpot dalam peran sehari-hari sejak go-live. Tingkat kompleksitas mengikuti jumlah hub dan ukuran tim."],"MOD-126":["Pelatihan & Enablement Lanjutan Berbasis Peran","Keterlibatan enablement menyeluruh yang membangun kemahiran HubSpot mendalam sesuai peran. Mengasumsikan onboarding inti sudah selesai dan berfokus pada fitur lanjutan, workflow sesuai peran, dan praktik terbaik untuk tiap fungsi, agar tim tidak sekadar memakai HubSpot tetapi memakainya secara efektif. Program satu kali, bukan dukungan pelatihan berkelanjutan."],"MOD-127":["Dukungan Onboarding & Pelatihan Berbasis Peran Berkelanjutan","Retainer pelatihan yang memberi enablement HubSpot berkelanjutan seiring tim klien bertumbuh. Mengasumsikan onboarding inti dan enablement awal sudah selesai, berfokus pada onboarding anggota baru, pembaruan materi sesuai rilis HubSpot, dan kebutuhan enablement yang muncul. Untuk organisasi yang sedang bertumbuh."],"MOD-128":["Enablement & Penyelarasan Eksekutif","Keterlibatan khusus untuk membekali eksekutif dan pimpinan senior dengan kemampuan pelaporan, forecasting, dan visibilitas strategis HubSpot. Untuk pengambil keputusan yang perlu nilai strategis dari data HubSpot (tinjauan pipeline, forecast pendapatan, laporan kinerja) tanpa menjadi pengguna mahir. Memastikan pimpinan yakin memakai HubSpot sebagai sumber kebenaran kinerja bisnis."],"MOD-129":["Pelatihan Proses Sales & CRM","Pelatihan terfokus yang menjembatani kemahiran HubSpot dan eksekusi proses sales: bukan hanya cara memakai CRM, tetapi cara mengelola pipeline, aktivitas, dan mengikuti proses sales dengan benar di HubSpot. Mengasumsikan onboarding inti sudah selesai dan berfokus menanamkan metodologi sales dan disiplin proses ke kebiasaan CRM harian."],"MOD-130":["Pelatihan Disiplin Pipeline, Forecasting & Pendapatan","Pelatihan dan coaching untuk membangun ketelitian manajemen pipeline, akurasi forecast, dan disiplin pendapatan di tim manajemen sales dan pimpinan. Melampaui pelatihan tools dengan fokus pada metodologi, kebiasaan, dan ritme manajemen untuk pendapatan yang dapat diprediksi: tinjauan pipeline yang efektif, pemeriksaan deal kritis, forecast yang yakin, dan akuntabilitas tim pada standar."],"MOD-131":["Pelatihan Prospecting Outbound","Pelatihan praktik yang membangun kemampuan eksekusi outbound tim sales: cara prospecting yang efektif, membangun dan menjalankan sequence HubSpot, merancang strategi outreach, dan menjalankan sales motion secara disiplin dan konsisten. Berfokus pada eksekusi top-of-funnel: bagaimana rep menemukan, menghubungi, dan mengonversi prospek menjadi pipeline berkualitas dengan tools HubSpot. Berbeda dari pelatihan proses CRM karena fokus pada membangun pipeline."],"MOD-132":["Eksekusi Perubahan & Manajemen Adopsi","Menjalankan dan mengelola program perubahan yang sedang berlangsung, menerapkan pendekatan komunikasi dan keterlibatan yang ditetapkan dalam strategi. Mengasumsikan penilaian kesiapan dan strategi perubahan sudah selesai, berfokus menjalankan program: komunikasi, menangani resistensi, memperkuat perilaku adopsi, dan memantau milestone hingga go-live dan setelahnya."],"MOD-133":["Penyiapan Metrik Adopsi & Tata Kelola","Proyek terfokus untuk membangun infrastruktur pengukuran dan tata kelola yang melacak kinerja adopsi terhadap strategi perubahan dan rencana peluncuran yang ada. Mengasumsikan strategi dan perencanaan sudah selesai, berfokus menyiapkan lapisan pelacakan: metrik keberhasilan, tools pengukuran, dan struktur akuntabilitas agar adopsi dipantau, dilaporkan, dan dikelola sepanjang program."],"MOD-134":["Enablement & Adopsi AI untuk Tenaga Kerja","Keterlibatan enablement terstruktur untuk membangun literasi, kemampuan, dan kepercayaan diri memakai AI sehari-hari setelah implementasi tools AI. Menyediakan pelatihan sesuai peran, kerangka adopsi, dan aktivasi champion agar tim memahami cara memakai dan mengintegrasikan AI ke workflow mereka. Enablement tahap awal untuk organisasi yang baru meluncurkan tools AI."],"MOD-135":["Enablement SOP & Workflow Berbasis AI","Proyek terfokus untuk merancang ulang dan mendokumentasikan prosedur operasional standar dan workflow dengan tools AI tertanam di titik penggunaan. Mengubah cara kerja saat ini menjadi versi yang diperkuat AI, agar AI menjadi bagian alami pekerjaan, bukan tambahan. Untuk organisasi yang sudah memakai tools AI dan timnya sudah cukup familiar."],"MOD-136":["Pengembangan Kampanye","Merencanakan dan mengembangkan kampanye multi-kanal yang terintegrasi untuk menghasilkan pipeline dan mendorong permintaan."],"MOD-137":["Manajemen Kampanye","Mengelola distribusi kampanye di berbagai kanal untuk meningkatkan jangkauan dan keterlibatan."],"MOD-138":["Optimasi Kinerja Kampanye","Memantau dan mengoptimalkan kinerja kampanye untuk meningkatkan keterlibatan, konversi, dan pipeline."],"MOD-139":["Manajemen Siklus Kampanye Loop","Pengelolaan berkelanjutan atas seluruh siklus Loop Marketing, memfasilitasi setiap tahap dari penetapan tujuan dan penyempurnaan identitas merek hingga sprint konten, distribusi multi-kanal, dan retrospektif Evolve yang terstruktur. Untuk klien yang ingin partner menggerakkan ritme Loop, dengan setiap siklus membangun dari siklus sebelumnya melalui pembelajaran terdokumentasi dan penargetan yang lebih tajam."],"MOD-140":["Optimasi Siklus Hidup & Perjalanan","Mengelola dan mengoptimalkan tahap siklus hidup dan perjalanan pelanggan untuk meningkatkan progres dan konversi lead."],"MOD-141":["Optimasi Nurture & Otomatisasi","Terus menyempurnakan program nurture dan workflow otomatisasi untuk meningkatkan keterlibatan dan konversi."],"MOD-142":["Optimasi Kinerja Funnel","Menganalisis dan meningkatkan tingkat konversi funnel dan progres di setiap tahap siklus hidup."],"MOD-143":["Optimasi Pengalaman Konversi","Optimasi berkelanjutan pada titik konversi sepanjang perjalanan pelanggan (landing page, CTA, formulir, dan pengalaman web) untuk meningkatkan tingkat konversi dan kualitas lead. Menggabungkan analitik perilaku, A/B testing, dan penyempurnaan personalisasi, dengan hipotesis pengujian berdasarkan data kinerja Loop Marketing."],"MOD-144":["Pembangunan Fondasi SEO & AEO","Keterlibatan eksekusi yang mengubah strategi SEO dan AEO yang ada menjadi fondasi yang aktif dan teroptimasi. Mengasumsikan audit dan strategi sudah selesai, dimulai dari implementasi: mengoptimalkan halaman prioritas untuk visibilitas di pencarian dan answer engine AI, menerapkan structured data, dan membangun arsitektur internal linking untuk otoritas topik."],"MOD-145":["Pembuatan & Repurposing Konten","Mengelola pembuatan konten berkelanjutan dan repurposing berbantuan AI untuk meningkatkan output konten secara efisien."],"MOD-146":["Optimasi Pertumbuhan SEO & AEO","Mengoptimalkan konten untuk mesin pencari dan penemuan berbasis AI untuk meningkatkan visibilitas organik."],"MOD-147":["Distribusi Konten & Operasional Media","Mengelola distribusi konten di berbagai kanal termasuk video, podcast, dan media sosial."],"MOD-148":["Eksekusi Kampanye Berbasis Akun","Eksekusi berkelanjutan kampanye ABM multi-kanal yang menargetkan akun prioritas tinggi. Mengelola seluruh motion kampanye: outreach outbound, iklan berbayar, pengalaman web yang dipersonalisasi, dan engagement play, memastikan titik sentuh yang terkoordinasi di setiap kanal yang dijumpai akun sasaran."],"MOD-149":["Operasional ABM & Keselarasan Pendapatan","Pengelolaan berkelanjutan infrastruktur operasional yang menjaga sales dan marketing tetap terkoordinasi pada akun sasaran. Memelihara daftar akun bersama, memfasilitasi ritme tinjauan pipeline, mengelola protokol serah terima, dan memastikan aktivitas ABM terhubung langsung dengan pipeline dan pendapatan."],"MOD-150":["Kinerja & Optimasi ABM","Analisis dan optimasi berkelanjutan kinerja program ABM terhadap target pipeline dan pendapatan. Memantau tren keterlibatan akun, mengukur efektivitas kampanye dan kanal, mengatribusikan pengaruh pipeline, dan menerjemahkan data menjadi rekomendasi strategis untuk mempertajam penargetan, pesan, dan alokasi sumber daya."],"MOD-151":["Fondasi & Peluncuran Paid Media","Proyek terstruktur untuk membangun dan meluncurkan program paid media dari nol. Mencakup arsitektur akun, struktur kampanye, konfigurasi audiens, penyiapan pelacakan, dan integrasi HubSpot, menghasilkan fondasi paid media yang siap diserahkan ke pengelolaan berkelanjutan. Untuk kondisi tanpa infrastruktur berbayar atau perlu dibangun ulang secara signifikan."],"MOD-152":["Manajemen Paid Media","Pengelolaan berkelanjutan kampanye iklan berbayar di search, social, dan display untuk mendatangkan traffic tertarget, lead berkualitas, dan pertumbuhan pipeline. Menangani seluruh operasional kampanye: penyiapan, konfigurasi audiens, manajemen anggaran, optimasi bid, dan pelacakan lead, memastikan investasi berbayar efisien dan terus dioptimalkan."],"MOD-153":["Sprint Kreatif Iklan","Keterlibatan singkat dan terfokus untuk memproduksi sekumpulan aset kreatif iklan untuk kampanye, peluncuran, atau acara tertentu. Menghasilkan paket kreatif lengkap (copy, desain, dan varian format) dalam jangka waktu tetap tanpa komitmen retainer kreatif. Cocok untuk klien dengan kebutuhan kampanye yang jelas atau yang sedang menguji kanal berbayar."],"MOD-154":["Produksi Kreatif & Iklan Berbayar","Produksi berkelanjutan kreatif iklan di berbagai format dan kanal untuk mendorong keterlibatan dan konversi audiens sasaran. Mencakup seluruh siklus produksi: konsep, copywriting, desain, dan adaptasi format, memastikan aliran aset kreatif segar yang selaras dengan penawaran dan pesan kampanye."],"MOD-155":["Optimasi Kinerja & Konversi Iklan Berbayar","Pengukuran, pengujian, dan optimasi berkelanjutan kinerja paid media di kampanye, kreatif, dan landing page. Menghubungkan belanja iklan dengan pipeline dan pendapatan melalui manajemen atribusi yang ketat, menjalankan A/B dan multivariate test untuk meningkatkan konversi, serta menerjemahkan data kinerja menjadi rekomendasi penargetan, pesan, dan alokasi anggaran."],"MOD-156":["Program Komunitas & Keterlibatan","Pengelolaan berkelanjutan pertumbuhan, program, dan keterlibatan komunitas merek dan pelanggan. Membangun dan mengaktifkan audiens di sekitar minat bersama, penggunaan produk, atau identitas profesional untuk mendorong loyalitas, koneksi antarmember, dan advokasi organik."],"MOD-157":["Kampanye Creator & Influencer","Keterlibatan dengan cakupan jelas untuk merencanakan dan menjalankan kampanye creator atau influencer yang terkait tujuan tertentu: peluncuran produk, acara, kampanye musiman, atau peningkatan awareness. Mencakup seluruh siklus dari pemilihan creator dan briefing, produksi dan publikasi konten, hingga laporan kinerja pascakampanye. Kampanye terukur dengan awal dan akhir yang jelas."],"MOD-158":["Program Creator & Influencer","Pengelolaan berkelanjutan kemitraan creator dan influencer untuk memperluas jangkauan merek, membangun kredibilitas, dan menumbuhkan audiens. Menangani seluruh siklus kemitraan: identifikasi, outreach, pengelolaan hubungan, arahan kreatif, dan pelacakan kinerja, memastikan aliran konten creator yang selaras dengan tujuan merek."],"MOD-159":["Peluncuran Program Advokasi & Referral","Proyek terstruktur untuk merancang, membangun, dan meluncurkan program advokasi dan referral pelanggan dari nol. Mencakup strategi program, mekanisme referral, struktur insentif, penyiapan dan pelacakan di HubSpot, rekrutmen advokat, dan aktivasi kelompok awal, menghasilkan program aktif yang siap dikelola berkelanjutan."],"MOD-160":["Program Advokasi & Referral","Pengelolaan berkelanjutan program advokasi dan referral untuk mengubah pelanggan yang puas menjadi kanal pertumbuhan aktif. Merekrut dan membina advokat, mengelola mekanisme referral dan insentif, serta mendorong aktivitas yang dipimpin pelanggan seperti ulasan, testimoni, referral, dan studi kasus yang membangun kepercayaan dan menghasilkan pipeline."],"MOD-161":["Optimasi Proses Sales & Adopsi CRM","Terus memantau dan meningkatkan penggunaan CRM, kepatuhan pada proses sales, dan konsistensi operasional di organisasi sales. Memberi visibilitas berkelanjutan atas pola adopsi, kebersihan pipeline, dan celah proses, sehingga praktik terbaik dapat diperkuat, masalah kepatuhan ditangani, dan kualitas eksekusi sales meningkat secara terukur."],"MOD-162":["Optimasi Prospecting Outbound","Terus mengoptimalkan workflow, sequence, dan pesan prospecting outbound untuk meningkatkan tingkat respons, keterlibatan, dan pipeline."],"MOD-163":["Optimasi Pipeline & Forecasting","Menjaga dan meningkatkan disiplin pipeline, akurasi forecast, dan konsistensi proses pendapatan melalui dukungan operasional, inspeksi deal, dan tinjauan analitis. Membantu pimpinan sales membangun kebiasaan forecasting yang andal, menemukan deal berisiko lebih awal, dan menjaga kebersihan pipeline."],"MOD-164":["Coaching Sales & Enablement Kinerja","Memberikan coaching sales, penguatan playbook, dan enablement kinerja secara berkelanjutan untuk meningkatkan konsistensi eksekusi dan efektivitas rep. Mendukung manajer dan rep melalui ritme coaching terstruktur, tinjauan deal, dan aktivitas penguatan yang mengubah strategi menjadi perilaku menjual yang dapat diulang."],"MOD-165":["Optimasi Eksekusi Sales Berbantuan AI","Mengoptimalkan penggunaan, efektivitas, dan adopsi workflow sales berbantuan AI, sistem prospecting, dan revenue operations berbasis AI secara berkelanjutan. Memastikan tools AI menghasilkan output berkualitas secara konsisten melalui penyempurnaan prompt, tata kelola penggunaan, pelacakan adopsi, dan perbaikan workflow."],"MOD-166":["Pemantauan & Optimasi Kinerja AI","Pemantauan dan optimasi berkelanjutan tools, agen, dan otomatisasi AI yang sudah diterapkan untuk menjaga kinerja, akurasi, dan dampak bisnis. Melacak kinerja Breeze agent, workflow AI kustom, dan sistem otomatisasi dari waktu ke waktu, menemukan penurunan atau penyimpangan, dan menerapkan perbaikan berkelanjutan."],"MOD-167":["Manajemen Tata Kelola & Kepatuhan AI","Pengelolaan berkelanjutan kerangka tata kelola, kebijakan, dan kewajiban kepatuhan AI agar penggunaan AI bertanggung jawab, patuh, dan dapat diaudit. Memantau regulasi AI yang berkembang, memelihara kebijakan internal, mengelola penilaian risiko use case AI, dan memastikan penerapan AI tetap selaras dengan standar etika dan persyaratan regulasi."],"MOD-168":["Optimasi Adopsi & Enablement AI","Pengukuran dan optimasi berkelanjutan kesehatan adopsi AI di organisasi klien. Mengasumsikan pelatihan AI awal sudah selesai, berfokus melacak di mana adopsi berkembang atau tersendat, menemukan hambatan workflow, menjalankan intervensi terarah, dan meningkatkan cara AI tertanam dalam operasional harian. Bukan pelatihan dari nol, melainkan program perbaikan berkelanjutan."],"MOD-169":["Program Eksperimen & Inovasi AI","Program berkelanjutan untuk mengidentifikasi, merancang, dan memvalidasi use case AI baru di organisasi klien. Menjalankan siklus eksperimen terstruktur dari hipotesis, uji, hingga hasil, menjaga klien di garis depan penerapan AI praktis dan terus memperluas peta jalan kapabilitas AI."],"MOD-170":["Administrasi & Pemeliharaan Portal HubSpot","Administrasi berkelanjutan instance HubSpot klien, mencakup pemeliharaan proaktif dan penyelesaian masalah. Mengelola akses pengguna, konfigurasi sistem, kebersihan data, kesehatan workflow, dan pemantauan integrasi, memastikan platform berjalan andal, data tetap bersih, dan masalah diselesaikan sebelum berdampak pada bisnis. Lapisan operasional lengkap untuk klien yang butuh partner menjalankan HubSpot sehari-hari."],"MOD-171":["Advisory Strategis HubSpot","Retainer advisory berkelanjutan yang memberikan panduan ahli HubSpot, dukungan troubleshooting, dan rekomendasi strategis bagi tim klien yang memiliki admin internal. Mencakup menjawab pertanyaan teknis dan strategis, saran praktik terbaik, meninjau konfigurasi sebelum implementasi, dan rekomendasi proaktif seiring perkembangan HubSpot. Lapisan ahli di atas tim admin internal, bukan penggantinya."],"MOD-172":["Tata Kelola Forecasting & Pipeline","Mendukung ritme tinjauan pipeline, akurasi forecast, dan inspeksi deal, menerjemahkan data CRM menjadi visibilitas pendapatan yang andal bagi pimpinan."],"MOD-173":["Manajemen Tech Stack & Integrasi","Mengelola ekosistem teknologi GTM: memantau kesehatan integrasi, mengaudit penggunaan tools, dan memandu keputusan beli, bangun, atau hentikan seiring perkembangan stack."],"MOD-174":["Optimasi Workflow & Otomatisasi","Tinjauan, perbaikan, dan perluasan berkelanjutan workflow dan sistem otomatisasi HubSpot untuk menjaga efisiensi, mengurangi kesalahan, dan menyelaraskan logika otomatisasi dengan proses bisnis yang berubah. Mencakup perbaikan otomatisasi yang rusak atau kurang optimal serta pembangunan otomatisasi baru secara proaktif untuk peningkatan efisiensi."],"MOD-175":["Optimasi Data & Proses","Perbaikan berkelanjutan kualitas, konsistensi, dan keselarasan proses data CRM di HubSpot. Mengelola kebersihan data dalam skala besar (deduplikasi, normalisasi, pengayaan, dan tata kelola) sambil menyelaraskan struktur data dan proses bisnis seiring perkembangan organisasi, agar CRM tetap menjadi sumber kebenaran yang andal."],"MOD-176":["Optimasi Pelaporan & Kinerja","Pemeliharaan, pengembangan, dan peningkatan berkelanjutan sistem pelaporan dan analitik HubSpot agar tim pendapatan memiliki visibilitas kinerja yang akurat dan dapat ditindaklanjuti. Mengelola dashboard dan laporan yang ada, membangun laporan baru sesuai kebutuhan, dan meningkatkan kualitas serta relevansi pelaporan untuk setiap audiens."],"MOD-177":["Kepemimpinan RevOps Fraksional","Kepemimpinan RevOps fraksional berkelanjutan yang memberikan pengawasan strategis, tinjauan kinerja, dan arahan perbaikan untuk revenue operations klien. Mengasumsikan eksekusi taktis ditangani layanan RevOps lain atau tim internal, dan berfokus sepenuhnya pada lapisan strategis: menetapkan arah agar semua pekerjaan RevOps selalu tertuju pada prioritas yang tepat."],"MOD-178":["Advisory RevOps","Memberikan akses terstruktur ke keahlian RevOps senior melalui sesi advisory rutin, sebagai lapisan konsultasi fleksibel untuk panduan strategis, pemecahan masalah, dan dukungan keputusan tanpa komitmen retainer operasional penuh."],"MOD-179":["Operasional Marketing Terkelola","Pengelolaan berkelanjutan sistem operasional marketing klien: menjaga kesehatan otomatisasi, kualitas data, akurasi segmentasi, deliverability email, dan infrastruktur personalisasi di antara siklus Loop Marketing. Memastikan sistem berjalan bersih agar setiap Loop baru dimulai dari fondasi yang akurat dan hasil yang terakumulasi tidak tergerus."]},"off":{"AI & Automation Solution Design":"Desain Solusi AI & Otomatisasi","AI Application & Agent Development":"Pengembangan Aplikasi & Agen AI","AI Readiness & Opportunity Assessment":"Penilaian Kesiapan & Peluang AI","AI Strategy & Roadmap":"Strategi & Peta Jalan AI","Account-Based Marketing (ABM) Program":"Program Account-Based Marketing (ABM)","Account-Based Marketing (ABM) Strategy":"Strategi Account-Based Marketing (ABM)","CRM & Data Architecture Design":"Desain CRM & Arsitektur Data","Change & Adoption Strategy":"Strategi Perubahan & Adopsi","Change Management & AI Adoption Programs":"Program Manajemen Perubahan & Adopsi AI","Change Management Readiness Assessment":"Penilaian Kesiapan Manajemen Perubahan","Commerce Hub Implementation":"Implementasi Commerce Hub","Content Hub Implementation":"Implementasi Content Hub","Content, SEO & AEO Audit":"Audit Konten, SEO & AEO","Content, SEO & AEO Growth Optimization":"Optimasi Pertumbuhan Konten, SEO & AEO","Content, SEO & AEO Strategy":"Strategi Konten, SEO & AEO","Customer Engagement, Community & Advocacy":"Keterlibatan Pelanggan, Komunitas & Advokasi","Customer Journey & Experience Audit":"Audit Perjalanan & Pengalaman Pelanggan","Data Hub Implementation":"Implementasi Data Hub","Demand Generation & Campaign Program":"Program Demand Generation & Kampanye","GTM Audit":"Audit GTM","GTM Process & Workflow Audit":"Audit Proses & Workflow GTM","GTM Strategy & Development":"Pengembangan Strategi GTM","GTM Systems & Automation Engineering":"Rekayasa Sistem & Otomatisasi GTM","HubSpot Onboarding & Core Enablement":"Onboarding & Enablement Inti HubSpot","HubSpot Platform Administration & Support":"Administrasi & Dukungan Platform HubSpot","Lifecycle Marketing & Funnel Optimization":"Lifecycle Marketing & Optimasi Funnel","Loop Marketing Program":"Program Loop Marketing","Managed AI Operations":"Operasional AI Terkelola","Marketing Hub Implementation":"Implementasi Marketing Hub","Marketing Operations as a Service":"Operasional Marketing sebagai Layanan","Marketing Systems Architecture Design":"Desain Arsitektur Sistem Marketing","Marketing Systems Engineering":"Rekayasa Sistem Marketing","Paid Ad & Performance Marketing":"Iklan Berbayar & Performance Marketing","Reporting & Analytics Design":"Desain Pelaporan & Analitik","RevOps Audit":"Audit RevOps","RevOps as a Service":"RevOps sebagai Layanan","Revenue Process & Workflow Design":"Desain Proses & Workflow Pendapatan","Sales Enablement & Training":"Sales Enablement & Pelatihan","Sales Hub Implementation":"Implementasi Sales Hub","Sales Onboarding & Training":"Onboarding & Pelatihan Sales","Service Hub Implementation":"Implementasi Service Hub","Smart CRM Implementation":"Implementasi Smart CRM"},"pkg":{"PKG-001":["Transformasi GTM","Perombakan go-to-market menyeluruh bagi perusahaan yang perlu mempertajam ICP, membangun ulang positioning, dan menyelaraskan sales, marketing, serta RevOps dalam satu motion GTM. Mencakup diagnostik full-funnel, pengembangan strategi, dan implementasi HubSpot."],"PKG-002":["Implementasi Smart CRM","Pembangunan HubSpot CRM yang terstruktur dengan fokus pada arsitektur data, otomatisasi proses sales, dan pelaporan. Dirancang untuk perusahaan yang bermigrasi dari CRM lama atau membenahi instance HubSpot yang berantakan. Hasilnya CRM yang benar-benar dipakai tim sales."],"PKG-003":["Pembangunan Demand Generation","Membangun mesin demand generation lengkap di HubSpot: penyiapan Marketing Hub, arsitektur kampanye, manajemen lead, otomatisasi nurture, dan pelaporan atribusi. Mengubah HubSpot dari database kontak menjadi mesin penghasil pipeline yang aktif."],"PKG-004":["Transformasi Kinerja Sales","Merancang ulang proses sales, membangun infrastruktur HubSpot pendukung, dan memampukan tim menjalankannya secara konsisten. Menggabungkan desain proses, konfigurasi CRM, tools produktivitas sales, dan infrastruktur coaching."],"PKG-005":["Fondasi RevOps","Membangun model operasional RevOps lintas sales, marketing, dan customer success. Mencakup definisi funnel, desain serah terima, kerangka KPI, dan infrastruktur HubSpot untuk menjalankan dan melaporkan seluruh siklus hidup pelanggan dalam satu sistem."],"PKG-006":["Akselerasi Pendapatan dengan AI","Mengidentifikasi use case AI bernilai tinggi di seluruh organisasi pendapatan, merancang dan membangun workflow serta agen AI di HubSpot, dan memampukan tim bekerja dengan AI dalam aktivitas GTM harian. Dari penemuan peluang AI hingga deployment dan adopsi."],"PKG-007":["Mesin Pertumbuhan Konten & SEO","Membangun operasional konten dan infrastruktur SEO untuk menghasilkan pipeline organik yang terus bertumbuh. Mencakup strategi SEO/AEO, penyiapan website, operasional konten, dan konfigurasi HubSpot Content Hub untuk menerbitkan, melacak, dan mengoptimalkan dalam skala besar."],"PKG-008":["Migrasi Salesforce → HubSpot","Migrasi terstruktur dari Salesforce (sering kali juga Pardot atau Marketing Cloud) ke HubSpot, mencakup penerjemahan model data, migrasi record, pemetaan ulang integrasi, dan pembangunan ulang proses sales. Klien mendapatkan instance HubSpot yang bersih dan dipercaya tim, serta rencana manajemen perubahan agar adopsi benar-benar terjadi."],"PKG-009":["Penyelamatan & Optimasi HubSpot","Pembenahan dan optimasi terstruktur atas instance HubSpot yang berantakan, tidak konsisten, atau kurang dimanfaatkan. Mencakup desain ulang model data, rasionalisasi workflow, perombakan pelaporan, dan re-enablement. Menghasilkan HubSpot yang dibanggakan dan benar-benar dipakai tim, tanpa mulai dari nol."],"PKG-010":["Program Siklus Hidup & Retensi Pelanggan","Membangun infrastruktur customer success dan retensi di HubSpot: penyiapan Service Hub, desain tahap siklus hidup pascapenjualan, otomatisasi CS, skor kesehatan, feedback loop, dan serah terima dari sales ke CS. Mengubah HubSpot dari alat sales menjadi platform siklus hidup pelanggan yang mendorong retensi dan ekspansi."],"PKG-011":["Mesin Outbound Sales","Merancang dan membangun motion outbound sales yang sistematis di HubSpot: penargetan ICP, prospecting berbasis sinyal, infrastruktur sequence, agen prospecting berbasis AI, dan konfigurasi CRM untuk mengelola serta melaporkan pipeline outbound. Klien mendapatkan sistem outbound yang dapat diulang dan berbasis data, bukan sekadar pustaka sequence."],"PKG-012":["Fondasi & Kesiapan Data","Membangun fondasi data yang bersih dan terkelola dengan baik di HubSpot: desain model data, pembersihan dan migrasi record, penyiapan pipeline pengayaan data, konfigurasi Data Hub, dan infrastruktur pelaporan agar data CRM tepercaya dan dapat ditindaklanjuti. Prasyarat untuk adopsi AI, forecasting yang serius, dan pelaporan level eksekutif."],"PKG-013":["Peluncuran Loop Marketing","Membangun sistem Loop Marketing lengkap di HubSpot, dari encoding identitas merek dan strategi kampanye hingga infrastruktur penangkapan sinyal dan personalisasi, sistem produksi konten AI, dan lapisan analitik Loop. Bukan sekadar penyiapan marketing, melainkan mesin marketing yang terus dioptimalkan, dengan siklus Loop pertama dijalankan sebagai bagian dari keterlibatan."]}},"ko":{"mod":{"MOD-001":["시장 및 ICP 전략 진단","고객의 현재 시장 타기팅 전략, ICP 정의, 세분화 방식을 평가해 불일치, 미개척 세그먼트, 더 날카롭게 집중할 기회를 찾습니다. 기업이 올바른 고객을 올바른 방식으로 공략하고 있는지, ICP가 가정이 아닌 실제 고객 데이터와 성과로 검증되었는지 판단합니다."],"MOD-002":["포지셔닝, 메시지 및 오퍼 진단","고객의 포지셔닝, 메시지, 오퍼 구조의 명확성, 차별성, 시장 공감도를 평가합니다. 가치 제안이 매력적이고 차별화되었는지, 메시지가 채널과 팀 전반에서 일관된지, 오퍼가 적절한 가격대에서 적합한 구매자를 전환하도록 구성되었는지 검토합니다."],"MOD-003":["수요 창출 및 성장 모델 진단","기업이 채널, 캠페인, 투자 전반에서 파이프라인을 얼마나 효과적으로 창출하는지 평가합니다. 채널 구성과 예산 배분부터 캠페인 성과와 파이프라인 기여까지 수요 창출 모델을 종합적으로 보고, 잘 작동하는 부분, 부진한 부분, 가장 효과가 큰 개선 기회를 찾습니다."],"MOD-004":["퍼널 전환 및 라이프사이클 진단","리드와 연락처가 최초 획득부터 매출 성사까지 라이프사이클 단계를 얼마나 효율적으로 거치는지 평가해 전환 격차, 이탈 지점, 속도 문제, 단계 정의 불일치를 찾습니다. 퍼널 상단부터 MQL, SQL, 성사까지 고객이 되기 전 단계를 다룹니다. 고객 라이프사이클 진단과 달리 획득과 전환 여정에 집중합니다."],"MOD-005":["영업 모션 및 파이프라인 관리 진단","영업 프로세스 실행, 파이프라인 관리 규율, 거래 진행 방식의 효과를 평가합니다. 기회가 파이프라인에 들어온 이후, 즉 거래 관리 방식, 파이프라인 건전성 유지, 예측 정확도 확보, 그리고 지연이나 매출 손실을 일으키는 실행 격차에 초점을 둡니다."],"MOD-006":["고객 라이프사이클 및 성장 모델 진단","획득 이후 고객을 유지하고 확장하기 위한 구조를 평가하며, 라이프사이클 모델, 확장 모션, 판매 후 성장 동력의 전략적 효과를 검토합니다. 온보딩 효과, 유지 건전성, 확장 기회 포착, 기존 고객 매출 성장 모델을 다룹니다. 획득 퍼널이 끝나는 지점에서 시작합니다."],"MOD-007":["RevOps 정렬 진단","CRM 설정, 데이터 인프라, 통합, 리포팅 시스템이 GTM 전략과 비즈니스 목표에 얼마나 부합하고 이를 지원하는지 평가합니다. 기술적 시스템 점검이 아닌 전략적 정렬 검토로, 매출 기술 스택이 올바른 의사결정과 데이터 제공, 기업의 시장 진출 방식을 뒷받침하는지 봅니다."],"MOD-008":["KPI 프레임워크 및 성과 관리 진단","현재 KPI 프레임워크, 측정 체계, 성과 리포팅 인프라를 평가해 올바른 지표를 추적하는지, 팀 간 정의가 일관된지, 리포팅이 경영진의 의사결정에 필요한 가시성을 주는지 판단합니다. 측정 공백, 팀 간 지표 불일치, 리포팅 사각지대를 찾습니다."],"MOD-009":["GTM 조직 설계 및 정렬 진단","마케팅, 영업, 고객 성공 전반의 시장 진출 조직 구조, 역할 정의, 부서 간 정렬을 평가합니다. 조직이 GTM 전략을 효과적으로 실행할 수 있는 구조인지 검토하고, 담당 공백, 역할 모호성, 책임 불일치, 구조적 비효율을 찾습니다."],"MOD-010":["AI 기회 발굴 및 평가","워크플로, 프로세스, 데이터를 분석해 비즈니스 전반의 잠재적 AI 활용 사례를 찾고 평가하며, 자동화, 증강, 효율화 기회를 도출합니다. AI가 어디서 가치를 낼 수 있는지와 각 기회의 상대적 실현 가능성을 방향성 있게 제시합니다."],"MOD-011":["AI 데이터 준비도 평가","조직의 데이터 기반이 AI 활용 사례를 뒷받침할 수 있는지 데이터 품질, 구조, 접근성, 완전성을 포함해 평가합니다."],"MOD-012":["AI 도구 및 플랫폼 평가","현재 AI 및 기술 스택을 평가해 역량 격차, 중복, AI 활용 사례 지원 준비도를 파악합니다."],"MOD-013":["AI 거버넌스 및 리스크 평가","거버넌스 구조, 리스크 관리 관행, 규정 준수 요소를 평가해 AI를 책임 있게 도입할 준비가 되었는지 판단합니다."],"MOD-014":["AI 조직 준비도 평가","AI를 효과적으로 도입하고 확장하기 위한 조직의 인력, 역량, 문화적 준비도를 평가합니다."],"MOD-015":["리더십 정렬 및 후원 평가","경영진 정렬, 후원 강도, 조직 변화를 이끌고 지속할 리더십 준비도를 평가합니다."],"MOD-016":["역할, 프로세스 및 책임 평가","역할, 책임, 프로세스의 명확성을 평가해 변화 실행 중 책임을 분명히 하고 마찰을 줄입니다."],"MOD-017":["이해관계자 및 도입 준비도 평가","새로운 업무 방식에 대한 이해관계자의 인식, 지지, 도입 준비도를 저항 리스크와 변화 피로도를 포함해 평가합니다."],"MOD-018":["변화 커뮤니케이션 및 역량 강화 평가","변화가 성공적으로 정착하는 데 필요한 커뮤니케이션 전략과 역량 강화 인프라의 효과를 평가합니다."],"MOD-019":["시스템 및 인스턴스 상태 평가","CRM 인스턴스의 전반적 상태, 설정, 거버넌스를 평가해 비효율, 잘못된 설정, 기술 부채, 거버넌스 공백을 찾습니다. 인스턴스 설정과 관리 방식을 폭넓게 검토하며, 데이터 모델, 데이터 품질, 통합은 별도 평가에서 다룹니다. 추가 구축이나 최적화에 투자하기 전에 잘 작동하는 부분과 손봐야 할 부분을 우선순위로 제시합니다."],"MOD-020":["CRM 데이터 모델 및 아키텍처 평가","HubSpot CRM 데이터 모델의 구조와 설계를 평가해 확장 가능한 리포팅, 자동화, 비즈니스 프로세스 실행을 지원하는지 판단합니다. 객체, 속성, 연결, 파이프라인 구조를 검토해 구조적 공백, 설계 한계, 실제 비즈니스 프로세스와의 불일치를 찾습니다."],"MOD-021":["데이터 품질 및 무결성 평가","CRM 데이터의 완전성, 정확성, 일관성, 신뢰성을 평가해 효과적인 리포팅, 자동화, 의사결정을 지원할 수 있는지 판단합니다. 데이터 모델 구조가 아닌 데이터 자체의 상태를 평가하며, 불완전하거나 부정확하거나 중복되거나 형식이 일관되지 않아 CRM의 신뢰도를 떨어뜨리는 레코드를 찾습니다."],"MOD-022":["통합 및 데이터 흐름 평가","기술 스택 전반의 시스템 통합, 데이터 동기화, 데이터 흐름 신뢰성을 평가해 리스크, 비효율, 공백을 찾습니다."],"MOD-023":["이해관계자, 역할 및 프로세스 조사","체계적인 이해관계자 조사를 통해 GTM 역할, 책임, 프로세스의 현황을 파악합니다. 누가 무엇을 맡는지, 마케팅, 영업, 고객 성공에서 업무가 실제로 어떻게 이루어지는지, 어떤 프로세스가 정의되어 있고 어떤 것이 비공식적으로 운영되는지 명확히 합니다. 이후 워크플로 매핑과 개선 작업의 기반이 됩니다. 조직 구조 설계를 평가하기보다 운영 현실을 기록합니다."],"MOD-024":["워크플로 매핑 및 인계 분석","마케팅, 영업, 고객 성공 간 업무 흐름을 처음부터 끝까지 기록하고 분석하며, 특히 마찰, 소통 오류, 프로세스 단절이 자주 발생하는 인계 지점에 집중합니다. 조사 결과를 시각적 워크플로 맵으로 만들어 실제 흐름과 의도된 흐름의 차이를 보여주고, 인계 실패가 문제를 일으키는 지점을 찾습니다."],"MOD-025":["프로세스와 시스템 정렬 평가","정의된 GTM 프로세스가 기술 시스템, 특히 HubSpot에 얼마나 잘 반영되고 설정되며 지원되는지 평가합니다. 설정이 의도한 프로세스를 제대로 지원하는 부분, 마찰이나 우회 작업을 만드는 부분, 시스템 밖에서 완전히 처리되는 부분을 찾습니다. 워크플로 실행 수준에서 평가합니다."],"MOD-026":["퍼널, SLA 및 운영 주기 평가","GTM 퍼널의 운영 및 거버넌스 계층을 평가합니다. SLA가 명확히 정의되고 일관되게 적용되며 측정되는지, 마케팅, 영업, CS의 운영 주기가 충분한 가시성과 책임을 제공하는지 봅니다. 퍼널 성과 데이터보다 프로세스 거버넌스에 집중합니다."],"MOD-027":["고객 여정 진단","고객 여정을 처음부터 끝까지 매핑해 접점 전반의 공백, 불일치, 마찰을 찾습니다."],"MOD-028":["전환 경험 진단","웹사이트, 양식, 랜딩 페이지, CTA 등 전환 지점의 사용자 경험, 메시지 명확성, 마찰을 평가해 잠재고객이 이탈하거나 관심을 잃는 지점을 찾습니다."],"MOD-029":["영업 및 인계 경험 진단","영업 접촉과 팀 간 인계 과정에서 판매자의 실행이 아닌 구매자의 경험을 평가하며, 각 단계에서 잠재고객이 무엇을 느끼고 겪는지 살펴봅니다."],"MOD-030":["온보딩 및 고객 경험 진단","판매 후 온보딩 경험, 가치 실현 시간, 초기 고객 상호작용을 평가해 고객 관계 초기의 마찰, 공백, 이탈 위험을 찾습니다."],"MOD-031":["유지 및 확장 경험 진단","성장을 위한 구조 설계와 별개로, 고객이 유지와 확장 상호작용에서 실제로 겪는 경험을 평가하며 참여 품질, 확장 접점, 지속적인 가치 전달 경험을 살펴봅니다."],"MOD-032":["지원 및 셀프서비스 진단","지원 상호작용과 셀프서비스 자료에서의 고객 경험을 평가합니다. 고객이 필요할 때 어떻게 도움을 받는지, 문제가 얼마나 효과적으로 해결되는지, 셀프서비스 채널이 마찰을 줄이고 만족도를 높이는지 살펴봅니다."],"MOD-033":["SEO 및 AEO 진단","콘텐츠 구조, 기술 SEO, AI 검색 준비도를 평가해 검색 엔진과 AI 플랫폼에서의 노출, 색인, 답변 가능성의 공백을 찾습니다."],"MOD-034":["ICP 및 세분화 전략","이상적인 고객 프로필과 세분화 전략을 정의해 성장 가치가 가장 높은 대상을 우선순위화합니다."],"MOD-035":["포지셔닝 및 메시지 전략","회사가 목표 고객에게 어떻게 차별화하고 가치를 전달할지 정의합니다."],"MOD-036":["GTM 모션, 채널 및 라이프사이클 전략","채널과 라이프사이클 단계 전반에서 고객을 획득, 전환, 유지, 확장하는 방식을 정의합니다."],"MOD-037":["GTM 계획 및 로드맵 수립","전략을 이니셔티브, 일정, 성공 지표가 정의된 우선순위 실행 계획으로 전환합니다."],"MOD-038":["SEO 및 AEO 전략","기존 검색 엔진과 AI 기반 탐색 모두에 최적화된 확장 가능한 콘텐츠 및 검색 전략을 정의합니다."],"MOD-039":["ABM 프로그램 전략 및 설계","목표 어카운트, 영업 모션, 매출 목표에 맞춘 어카운트 기반 마케팅 전략을 정의합니다."],"MOD-040":["ABM 데이터 및 타기팅 전략","어카운트 데이터, 신호, 데이터 보강을 타기팅과 참여에 어떻게 활용할지 정의합니다."],"MOD-041":["AI 활용 사례 우선순위 및 비즈니스 케이스 전략","비즈니스 영향, 실현 가능성, 전략적 정렬을 기준으로 AI 활용 사례를 찾고 우선순위를 정합니다."],"MOD-042":["AI 역량 및 성숙도 전략","데이터, 시스템, 거버넌스, 팀 전반에서 AI 도입에 필요한 역량을 정의합니다."],"MOD-043":["AI 투자 및 로드맵 계획","순서, 투자 우선순위, 기대 성과를 포함한 단계별 AI 도입 로드맵을 수립합니다."],"MOD-044":["변화 전략 및 접근 방식 설계","비즈니스 목표에 맞춰 조직 변화를 관리하고 이끌 전체 전략을 정의합니다."],"MOD-045":["이해관계자 참여 및 커뮤니케이션 전략","변화 과정 전반에서 이해관계자를 참여시키고, 정보를 공유하며, 합의를 이끌 방법을 정의합니다."],"MOD-046":["교육 및 역량 강화 전략","팀이 새로운 프로세스, 시스템, 업무 방식을 도입하도록 교육하고 역량을 강화하는 방법을 정의합니다."],"MOD-047":["도입 및 확산 계획","순서, 파일럿, 확장 방식을 포함해 변화를 조직 전반에 확산하는 방법을 정의합니다."],"MOD-048":["CRM 데이터 모델 및 시스템 설계","GTM 프로세스와 리포팅을 지원하는 데 필요한 CRM 데이터 모델, 객체, 구조를 설계합니다."],"MOD-049":["통합 및 데이터 흐름 설계","시스템 간 데이터 흐름과 통합 구조를 정의합니다."],"MOD-050":["데이터 거버넌스 및 관리 설계","데이터 품질, 일관성, 신뢰성을 보장하는 기준과 프로세스를 정의합니다."],"MOD-051":["영업 모션 및 프로세스 설계","GTM 모션과 구매자 여정에 맞춘 체계적인 영업 프로세스를 설계합니다."],"MOD-052":["캠페인 및 퍼널 아키텍처 설계","수요 창출과 전환을 지원하는 마케팅 캠페인 구조와 퍼널 아키텍처를 설계합니다."],"MOD-053":["고객 라이프사이클 및 인계 설계","마케팅, 영업, 고객 팀 간 라이프사이클 단계와 인계 프로세스를 설계합니다."],"MOD-054":["AI 활용 사례 및 워크플로 설계","우선순위 활용 사례에 맞춘 AI 기반 워크플로와 자동화를 설계합니다."],"MOD-055":["AI 에이전트 전략 및 설계","GTM 워크플로를 지원하는 AI 에이전트의 아키텍처와 동작을 정의합니다."],"MOD-056":["AI 데이터 및 거버넌스 설계","AI 시스템을 위한 데이터 구조, 거버넌스, 접근 방식을 정의합니다."],"MOD-057":["KPI 및 측정 프레임워크 설계","GTM 전략에 맞춘 성과 지표와 측정 구조를 정의합니다."],"MOD-058":["대시보드 및 리포팅 아키텍처 설계","가시성과 의사결정을 위한 대시보드와 리포팅 시스템을 설계합니다."],"MOD-059":["마케팅 신호 및 개인화 아키텍처 설계","대규모 Loop Marketing을 구동하는 데이터 아키텍처, 신호 흐름, 개인화 토큰 프레임워크를 설계합니다. 행동 신호, 보강 데이터, CRM 속성이 이메일, 웹, 콘텐츠의 개인화 사례에 어떻게 연결되는지 정의해, 이후 모든 마케팅 시스템 구축의 청사진을 만듭니다."],"MOD-060":["CRM 아키텍처 및 데이터 모델 구축","설계된 아키텍처에 맞춰 객체, 속성, 라이프사이클 단계, 파이프라인을 포함한 CRM 데이터 모델을 구축합니다."],"MOD-061":["CRM 설정","CRM 핵심 설정, 사용자 접근, 권한, 기본 시스템 설정을 구성합니다."],"MOD-062":["CRM 데이터 이전 및 데이터 품질 구축","데이터를 준비, 이전, 검증해 CRM에 정확하고 일관되며 사용 가능한 데이터를 확보합니다."],"MOD-063":["영업 프로세스 및 리드 관리 구축","정의된 GTM 모션과 라이프사이클에 맞춘 영업 프로세스와 리드 관리 워크플로를 구축합니다."],"MOD-064":["자동화 및 워크플로 구축","프로세스를 간소화하고 거버넌스를 적용하며 운영 효율을 높이는 자동화 워크플로를 구축합니다."],"MOD-065":["리포팅 및 대시보드 구축","파이프라인 성과, 영업 활동, 예측을 보여주는 리포트와 대시보드를 구축합니다."],"MOD-066":["HubSpot 기본 통합 구축","HubSpot 마켓플레이스 기본 통합을 구축·설정해 시스템을 연결하고 데이터를 동기화하며 도구 간 원활한 워크플로를 만듭니다."],"MOD-067":["Marketing Hub 설정","마케팅 실행에 필요한 Marketing Hub 기본 설정, 도메인, 시스템 인프라를 구성합니다."],"MOD-068":["리드 관리 및 라이프사이클 자동화 설정","리드 라이프사이클 관리, 스코어링, 자동화를 구축해 잠재고객이 리드에서 고객으로 전환되도록 관리합니다."],"MOD-069":["캠페인, 전환 및 채널 설정","수요 창출과 기여도 분석을 지원하는 캠페인 구조, 전환 경로, 추적 장치를 구축합니다."],"MOD-070":["HubSpot AEO 설정","HubSpot 기본 AEO 기능을 설정합니다. 브랜드 보이스 설정, AEO 모니터링 대시보드 구성, 올바른 콘텐츠와 도메인 연결, 기준 추적 수립을 포함합니다. AI 답변 엔진 노출을 측정하고 개선하는 도구를 세팅하는 작업입니다."],"MOD-071":["이메일 마케팅 및 너처링 자동화 구축","퍼널 전반에서 리드와 소통하는 이메일 마케팅 프로그램과 너처링 워크플로를 구축합니다."],"MOD-072":["세분화 및 개인화 구축","타깃 마케팅 경험을 제공하는 세분화 프레임워크와 개인화 기능을 구축합니다."],"MOD-073":["마케팅 리포팅 및 기여도 구축","마케팅 성과와 매출 영향을 측정하는 리포팅 시스템과 기여도 모델을 구축합
