니다."],"MOD-074":["Content Hub 설정","콘텐츠 제작과 관리에 필요한 Content Hub 기본 설정, 브랜드 체계, 핵심 콘텐츠 도구를 구성합니다."],"MOD-075":["웹사이트 디자인","전환 및 콘텐츠 전략에 맞춰 웹사이트의 구조, 사용자 경험, 시각 체계를 디자인합니다."],"MOD-076":["웹사이트 및 CMS 개발","테마, 템플릿, 모듈, 통합을 포함해 HubSpot에 웹사이트와 CMS 인프라를 구축합니다."],"MOD-077":["콘텐츠 이전 및 URL 구조 설정","SEO 가치, 구조, 사용자 경험을 유지하면서 기존 콘텐츠를 HubSpot으로 이전합니다."],"MOD-078":["SEO, AEO 및 기술 성능 설정","검색을 위한 CMS 인프라를 설정합니다. URL 구조, 사이트맵, 캐노니컬, 페이지 속도, Core Web Vitals, 모바일, 테마/템플릿 수준의 구조화 데이터 템플릿을 포함합니다. 검색 엔진과 AI 크롤러에 기술적으로 적합한 웹사이트를 만듭니다."],"MOD-079":["콘텐츠 운영, 거버넌스 및 개인화 설정","콘텐츠 워크플로, 거버넌스 기준, 개인화 기능을 구축해 확장 가능하고 일관된 콘텐츠 운영을 지원합니다."],"MOD-080":["콘텐츠 리포팅 및 분석","콘텐츠 성과 추적과 분석을 구축해 가치를 측정하고 전달합니다."],"MOD-081":["멤버십 경험 구축","HubSpot 안에 매출을 창출하거나 참여를 이끄는 멤버 생태계를 설계, 구축, 운영하는 체계적인 서비스입니다."],"MOD-082":["영업 프로세스 및 파이프라인 구축","정의된 영업 모션과 라이프사이클에 맞춘 영업 프로세스, 파이프라인, 리드 관리 워크플로를 구축합니다."],"MOD-083":["영업 생산성 도구 및 역량 강화 구축","영업팀의 효율, 일관성, 실행력을 높이는 영업 생산성 도구를 구축합니다."],"MOD-084":["Prospecting Agent 설정 및 배포","타기팅 로직, 개인화, 워크플로 통합을 포함해 AI 기반 잠재고객 발굴 에이전트를 구축하고 배포합니다."],"MOD-085":["영업 리포팅 및 예측 구축","파이프라인 성과, 예측, 영업 생산성을 보여주는 리포팅 시스템과 대시보드를 구축합니다."],"MOD-086":["영업 지역 및 어카운트 세분화 구축","효율적인 영업 커버리지를 위해 지역 모델, 어카운트 세분화, 담당 구조를 구축합니다."],"MOD-087":["Commerce Hub 및 결제 설정","Commerce Hub 기본 설정, 결제 인프라, 시스템 수준의 커머스 기능을 구성합니다."],"MOD-088":["제품 라이브러리 및 가격 구조 구축","견적, 청구, 리포팅을 지원하는 제품 카탈로그와 가격 구조를 구축합니다."],"MOD-089":["CPQ(견적 구성 및 자동화) 구축","효율적이고 정확한 견적을 위해 견적 생성, 가격 로직, 승인 워크플로를 구축합니다."],"MOD-090":["구독 및 청구 관리 구축","구독 라이프사이클 관리, 청구 로직, 반복 매출 프로세스를 구축합니다."],"MOD-091":["체크아웃, 결제 및 수금 구축","원활한 고객 거래를 위해 체크아웃 경험과 결제 수금 워크플로를 구축합니다."],"MOD-092":["매출 라이프사이클 자동화 및 재무 시스템 통합","엔드투엔드 매출 라이프사이클 자동화를 구축하고 재무 시스템을 통합해 정확하고 확장 가능한 운영을 보장합니다."],"MOD-093":["매출 리포팅, 규정 준수 및 거버넌스 구축","규정 준수와 의사결정을 지원하는 매출 리포팅, 재무 가시성, 거버넌스 프레임워크를 구축합니다."],"MOD-094":["Service Hub 설정","지원 운영을 위한 Service Hub 기본 설정과 고객 커뮤니케이션 채널을 구성합니다."],"MOD-095":["티켓 파이프라인 및 SLA 구축","고객 지원 요청을 관리하는 티켓 파이프라인, SLA, 핵심 서비스 워크플로를 구축합니다."],"MOD-096":["라우팅, 자동화 및 서비스 운영 구축","효율적인 티켓 배정, 업무량 관리, 내부 협업을 위한 라우팅 로직과 자동화를 구축합니다."],"MOD-097":["Help Desk 워크스페이스 및 상담원 생산성 구축","효율, 가시성, 성과를 높이도록 Help Desk 워크스페이스와 상담원 도구를 설정합니다."],"MOD-098":["셀프서비스, 지식 베이스 및 고객 포털 구축","지원 부담을 줄이고 고객의 정보 접근성을 높이는 셀프서비스 경험을 구축합니다."],"MOD-099":["고객 성공 및 피드백 시스템 구축","고객 유지와 만족도를 높이는 고객 성공 워크플로, 건강도 점수, 피드백 시스템을 구축합니다."],"MOD-100":["Customer Agent 설정 및 배포","문의를 처리하고 사용자를 돕고 필요 시 상담원에게 연결하는 AI 기반 고객 지원 에이전트를 구축합니다."],"MOD-101":["서비스 리포팅 및 분석 구축","지원 성과, 고객 만족도, 운영 효율을 보여주는 리포팅 시스템을 구축합니다."],"MOD-102":["Data Hub 설정","모든 데이터 운영, 리포팅, AI 역량의 기반이 되는 Data Hub 인프라와 데이터 세트 아키텍처를 수립합니다. 초기 Data Hub 설정, 데이터 세트 설계 및 구축, 데이터 모델 정렬, 그리고 HubSpot 안에서 데이터가 흐르고 조회되는 방식을 결정하는 구조적 결정을 포함합니다."],"MOD-103":["데이터 통합 및 동기화 구축","Data Hub의 기본 동기화 인프라로 HubSpot과 외부 시스템 간 양방향 및 단방향 데이터 동기화를 구축합니다. 필드 매핑, 동기화 로직, 충돌 해결 규칙, 데이터 변환을 설정해 깨끗하고 안정적인 데이터 흐름을 보장합니다."],"MOD-104":["데이터 품질, 보강 및 구매 의도 데이터 구축","Data Hub 환경에서 HubSpot 기본 데이터 품질, 데이터 보강, 구매 의도 데이터 기능을 구축합니다. 레코드를 깨끗하고 일관되게 유지하는 데이터 품질 자동화를 설정하고, 연락처와 회사 데이터를 자동으로 채우는 HubSpot Data Enrichment를 구성하며, 구매 신호를 보이는 어카운트를 보여주는 Buyer Intent를 활성화합니다. 초기 Data Hub 구축의 일부로, 맞춤형 신호 시스템이 아닌 HubSpot 기본 도구를 설정합니다."],"MOD-105":["데이터 모델링, 계산 및 매출 정렬","HubSpot에서 정확한 비즈니스 인텔리전스와 리포팅을 구동하는 데이터 모델링, 계산 속성, 매출 데이터 구조를 설계·구축합니다. 고객의 매출 모델과 비즈니스 로직을 HubSpot 데이터 계층으로 옮겨 파이프라인, 매출, 유지율, LTV, 이탈률 등 핵심 지표가 정확하게 계산되고 일관되게 정의되어 모든 리포트와 대시보드에서 활용되도록 합니다."],"MOD-106":["자동화, 워크플로 및 프로그래밍 로직 구축","프로그래밍 가능한 워크플로, 사용자 지정 코드 작업, 이벤트 기반 로직 등 Data Hub의 고급 자동화 기능을 구축해 표준 HubSpot 워크플로를 넘어서는 복잡한 비즈니스 프로세스 자동화를 구현합니다. 별도 엔지니어링 프로젝트가 아닌 초기 Data Hub 구축의 일부입니다."],"MOD-107":["데이터 활성화, AI 에이전트 및 Hub 간 인텔리전스","데이터 활성화 전략, AI 데이터 에이전트, Hub 간 인텔리전스를 구축해 마케팅, 영업, 서비스 전반에서 데이터를 활용합니다."],"MOD-108":["데이터 거버넌스, 모니터링 및 리포팅 구축","Data Hub 환경이 안정적이고 일관되게 운영되고 이해관계자가 데이터 상태를 완전히 볼 수 있도록 거버넌스 프레임워크, 모니터링 시스템, 리포팅 인프라를 구축합니다. 데이터 거버넌스 정책 적용, 운영 모니터링 설정, 경영진과 운영팀이 의사결정 데이터를 신뢰하게 하는 리포팅 계층을 포함합니다."],"MOD-109":["맞춤형 AI 어시스턴트 개발(LLM 기반)","대규모 언어 모델(GPT, Claude, Gemini 등)을 활용해 특정 비즈니스 활용 사례에 맞춘 AI 어시스턴트를 설계·구축합니다."],"MOD-110":["맞춤형 AI 에이전트 개발","정해진 범위 안에서 여러 단계의 작업을 자율적으로 수행하고, 도구를 사용하며, 결정을 내리고, 워크플로를 완료하는 AI 에이전트를 설계·구축합니다. 대화형 어시스턴트를 넘어 데이터 조회, API 호출, HubSpot 워크플로 실행, 복잡한 작업 완료까지 최소한의 개입으로 수행하는 실행형 시스템을 만듭니다. 기존 자동화로는 부족하고 실행 시점에 지능적 판단이 필요한 경우에 적합합니다."],"MOD-111":["멀티 에이전트 시스템 및 오케스트레이션 구축","전문화된 AI 에이전트들이 협력해 단일 에이전트로는 어려운 복잡한 다단계 워크플로를 완료하는 멀티 에이전트 시스템을 설계·구축합니다. 에이전트 역할, 통신 프로토콜, 오케스트레이션 로직, 인계 방식을 정의해 신뢰할 수 있고 확장 가능한 AI 시스템을 만듭니다."],"MOD-112":["HubSpot Breeze Assistant 개발","HubSpot 안에서 맞춤형 Breeze Assistant를 설계·설정해 플랫폼의 기본 AI 기능을 고객의 워크플로, 브랜드 보이스, 운영 요구에 맞춥니다. 프롬프트 설정, 콘텐츠 어시스턴트 설정, 맥락 기반 답변을 위한 CRM 데이터 통합, 워크플로 통합을 포함하며, 플랫폼 밖 애플리케이션 개발 없이 팀의 실제 업무 방식에 맞는 HubSpot 기본 AI 경험을 제공합니다."],"MOD-113":["컨텍스트 엔지니어링 및 지식 설정","ICP, 메시지, 프로세스, 비즈니스 지식, 규칙, 의사결정 로직, 데이터 구조 등 비즈니스 맥락을 AI 시스템에 설계·반영해 정확하고 일관되며 목표에 맞는 결과를 보장합니다."],"MOD-114":["고급 GTM 자동화 및 워크플로 엔지니어링","HubSpot 객체와 프로세스 전반에 복잡한 자동화 시스템을 설계·구축해 확장 가능한 GTM 실행을 지원합니다. 표준 워크플로 설정을 넘어 다중 분기 의사결정 트리, 객체 간 자동화, 사용자 지정 코드 작업, 행동 기반 트리거 등 고급 로직으로 수작업 없이 GTM 전략을 대규모로 적용합니다."],"MOD-115":["데이터 보강 및 신호 활성화 시스템","타기팅, 세분화, GTM 인텔리전스를 강화하는 데이터 보강 파이프라인, 외부 신호 통합, 활성화 워크플로를 구축합니다. GTM 실행에 필요한 데이터 인프라를 만들어 적절한 보강 데이터와 행동 신호가 적절한 시스템에 적시에 전달되도록 합니다."],"MOD-116":["아웃바운드 및 잠재고객 발굴 시스템 엔지니어링","CRM 데이터, 행동 신호, 구조화된 메시지를 결합해 대규모로 효율적인 파이프라인을 창출하는 자동화된 아웃바운드 및 잠재고객 발굴 시스템을 설계·구축합니다. 데이터 기반 잠재고객 식별과 우선순위화부터 자동 시퀀스 트리거와 멀티채널 실행까지 기술 인프라를 구축해, 아웃바운드를 반복 가능하고 측정 가능한 시스템으로 만듭니다."],"MOD-117":["시스템 간 통합 및 오케스트레이션","기본 커넥터, 미들웨어 플랫폼, HubSpot 기본 통합 도구를 사용해 맞춤 코드 개발 없이 HubSpot과 외부 시스템 간 통합과 데이터 흐름을 구축합니다. 올바른 데이터가 시스템 간에 안정적으로 이동하고 올바른 후속 작업을 실행하도록 합니다. 맞춤 API 개발과 달리 기본 및 로우코드 도구를 활용합니다."],"MOD-118":["실험 및 성장 시스템 개발","체계적인 GTM 실험을 위한 기술 인프라를 설계·구축해 고객이 타기팅, 메시지, 자동화, 워크플로 전략을 체계적으로 테스트, 측정, 개선하도록 지원합니다. 임시 테스트를 가설이 구조화되고 결과가 엄격히 측정되며 학습이 누적되는 반복 가능한 시스템으로 바꿔 복리형 성장 우위를 만듭니다."],"MOD-119":["맞춤형 API 및 웹훅 개발","표준 통합 도구로 요구를 충족할 수 없을 때 API, 웹훅, 맞춤형 미들웨어로 HubSpot과 외부 시스템 간 맞춤 통합을 설계·구축합니다. 설정이 아닌 개발이 필요한 복잡한 데이터 동기화, 고급 워크플로 트리거, 시스템 상호운용성 요구를 해결합니다."],"MOD-120":["신호 수집 및 데이터 보강 파이프라인 구축","웹, 이메일, 콘텐츠 접점의 행동 신호를 수집하고, 외부 데이터로 연락처와 회사 레코드를 보강하며, 보강된 속성을 동적 세그먼트와 개인화 토큰으로 활성화하는 기술 인프라를 구축합니다. 대규모 초개인화 Loop Marketing을 가능하게 하는 데이터 기반입니다."],"MOD-121":["마케팅 자동화 아키텍처 및 Loop 운영 구축","Loop Marketing이 지속적으로 운영되도록 하는 자동화 골격을 구축합니다. Express, Tailor, Amplify, Evolve를 프로그래밍 방식으로 연결하는 트리거 로직, 콘텐츠 라우팅 워크플로, 너처링 분기, 단계 오케스트레이션을 만들어 각 Loop 사이클이 최소한의 수작업으로 운영되고 점점 개선되도록 합니다."],"MOD-122":["AI 콘텐츠 제작 시스템 구축","대규모 AI 지원 콘텐츠 제작을 위한 운영 인프라, 즉 Loop Marketing Tailor 단계의 엔진을 설계·구축합니다. 구조화된 프롬프트 라이브러리, 콘텐츠 브리프 템플릿, 형식별 AI 워크플로, 편집 검토 프로세스를 제공해 팀이 모든 채널에서 고품질 개인화 콘텐츠를 일관되고 빠르게 만들도록 합니다."],"MOD-123":["개인화 엔진 및 Smart Content 구축","보강된 연락처 데이터, 행동 신호, CRM 속성을 활용해 이메일과 웹에서 동적으로 맞춤화된 경험을 제공하는 고급 개인화 기능을 구축합니다. 기본 세분화를 넘어 스마트 콘텐츠 규칙, 동적 토큰 프레임워크, 행동 기반 대상 라우팅으로 진정한 개인화 엔진을 만들어 모든 접점이 개인에게 의미 있게 느껴지도록 합니다."],"MOD-124":["Loop 분석 및 인텔리전스 시스템 구축","캠페인 데이터를 다음 Loop 사이클에 활용할 구조화된 인사이트로 바꾸는 분석, 학습 기록, 인텔리전스 인프라인 Loop Marketing의 Evolve 계층을 구축합니다. 리포팅 시스템, 콘텐츠 성과 추적, 기여도 모델, 회고 프레임워크를 만들어 Loop Marketing을 단절된 캠페인이 아닌 복리형 시스템으로 만듭니다."],"MOD-125":["HubSpot 온보딩 및 핵심 교육","구축 후 고객 팀이 HubSpot을 자신 있게 사용하도록 돕는 체계적인 온보딩입니다. 플랫폼 소개, 핵심 기능 교육, 범위 내 Hub의 기본 워크플로 안내를 포함해 모든 사용자가 오픈 시점부터 일상 업무에서 HubSpot을 효과적으로 사용하도록 합니다. 복잡도는 Hub 수와 팀 규모에 따라 달라집니다."],"MOD-126":["고급 역할별 교육 및 역량 강화","고객 팀 전반에 역할별로 깊이 있는 HubSpot 숙련도를 키우는 종합 역량 강화 프로그램입니다. 핵심 온보딩 완료를 전제로 고급 기능 도입, 역할 맞춤 워크플로, 부서별 모범 사례에 집중해 팀이 HubSpot을 단순히 쓰는 것을 넘어 성과를 내도록 합니다. 지속 지원이 아닌 1회성 종합 프로그램입니다."],"MOD-127":["지속적인 역할별 온보딩 및 교육 지원","고객 팀이 성장하고 변화함에 따라 HubSpot 역량 강화를 지속적으로 제공하는 교육 리테이너입니다. 핵심 온보딩과 초기 역할별 교육 완료를 전제로, 신규 인원의 기존 교육 합류, HubSpot 업데이트에 맞춘 자료 갱신, 수시로 발생하는 교육 요구 대응에 집중합니다. 성장하는 조직에 적합합니다."],"MOD-128":["경영진 역량 강화 및 정렬","경영진과 고위 리더가 HubSpot의 리포팅, 예측, 전략적 가시성 기능을 활용하도록 돕는 집중 프로그램입니다. 파이프라인 검토, 매출 예측, 성과 리포팅 등 HubSpot 데이터에서 전략적 가치를 얻어야 하지만 전문 사용자가 될 필요는 없는 의사결정자를 위한 것입니다. 리더십이 HubSpot을 비즈니스 성과의 신뢰할 수 있는 원천으로 활용하도록 합니다."],"MOD-129":["영업 프로세스 및 CRM 교육","HubSpot 활용 능력과 영업 프로세스 실행을 연결하는 집중 교육입니다. CRM 사용법뿐 아니라 HubSpot 안에서 파이프라인을 운영하고 활동을 관리하며 영업 프로세스를 올바르게 따르는 방법을 가르칩니다. 핵심 온보딩 완료를 전제로 영업 방법론과 프로세스 규율을 일상적인 CRM 습관에 녹여냅니다."],"MOD-130":["파이프라인, 예측 및 매출 규율 교육","영업 관리자와 리더십 팀의 파이프라인 관리 엄격성, 예측 정확도, 매출 규율을 높이는 교육 및 코칭 프로그램입니다. 도구 교육을 넘어 예측 가능한 매출을 만드는 방법론, 습관, 관리 주기에 집중하며, 효과적인 파이프라인 검토, 거래 점검, 자신 있는 예측, 영업 담당자의 기준 준수 관리 방법을 다룹니다."],"MOD-131":["아웃바운드 잠재고객 발굴 교육","영업팀의 아웃바운드 실행 역량을 키우는 실습 교육입니다. 효과적인 잠재고객 발굴, HubSpot 시퀀스 구축과 운영, 아웃리치 전략 설계, 규율 있고 일관된 실행 방법을 가르칩니다. 담당자가 HubSpot 도구로 잠재고객을 찾고 접촉해 적격 파이프라인으로 전환하는 퍼널 상단 실행에 집중합니다. 파이프라인 관리가 아닌 구축 방법을 다룹니다."],"MOD-132":["변화 실행 및 도입 관리","진행 중인 변화 프로그램을 실행·관리하며 변화 전략에서 정의한 커뮤니케이션과 이해관계자 참여 방식을 실행합니다. 준비도 평가와 변화 전략 완료를 전제로 커뮤니케이션 실행, 저항 관리, 도입 행동 강화, 오픈 시점과 그 이후까지의 마일스톤 추적에 집중합니다."],"MOD-133":["도입 지표 및 거버넌스 설정","기존 변화 전략과 확산 계획 대비 도입 성과를 추적하는 측정 및 거버넌스 인프라를 구축하는 집중 프로젝트입니다. 전략과 계획 완료를 전제로 성공 지표 정의, 측정 도구 설정, 책임 구조 수립에 집중해 프로그램 전반에서 도입을 모니터링, 보고, 관리하도록 합니다."],"MOD-134":["AI 인력 역량 강화 및 도입","AI 도구 도입 후 직원들의 AI 이해도, 역량, 일상적 활용 자신감을 키우는 체계적 프로그램입니다. 역할별 교육, 도입 프레임워크, 챔피언 활성화를 제공해 팀이 AI 도구 사용법과 업무 통합 방법을 이해하도록 합니다. AI 도구를 막 도입한 조직을 위한 초기 단계 역량 강화입니다."],"MOD-135":["AI 내재화 SOP 및 워크플로 역량 강화","사용 시점에 AI 도구를 명시적으로 포함하도록 표준 운영 절차와 워크플로를 재설계하고 문서화하는 집중 프로젝트입니다. 현재 업무 방식을 AI로 강화된 동일한 프로세스로 바꿔 AI가 부가 도구가 아닌 업무의 일부가 되도록 합니다. AI 도구가 이미 도입되어 팀이 기본적으로 익숙한 조직에 적합합니다."],"MOD-136":["캠페인 개발","파이프라인을 창출하고 수요를 이끄는 통합 멀티채널 캠페인을 기획·개발합니다."],"MOD-137":["캠페인 관리","도달과 참여를 높이도록 채널 전반의 캠페인 배포를 관리합니다."],"MOD-138":["캠페인 성과 최적화","참여, 전환, 파이프라인 창출을 높이도록 캠페인 성과를 모니터링하고 최적화합니다."],"MOD-139":["Loop 캠페인 사이클 관리","Loop Marketing 전체 사이클을 지속적으로 관리합니다. 목표 설정과 브랜드 아이덴티티 개선부터 콘텐츠 스프린트, 멀티채널 배포, 체계적인 Evolve 회고까지 각 단계를 진행합니다. 파트너가 Loop 주기를 이끌기를 원하는 고객에게 적합하며, 기록된 학습과 정교해진 타기팅으로 매 사이클이 이전 사이클 위에 쌓입니다."],"MOD-140":["라이프사이클 및 여정 최적화","리드 진행과 전환을 높이도록 라이프사이클 단계와 고객 여정을 관리하고 최적화합니다."],"MOD-141":["너처링 및 자동화 최적화","참여와 전환을 높이도록 너처링 프로그램과 자동화 워크플로를 지속적으로 개선합니다."],"MOD-142":["퍼널 성과 최적화","라이프사이클 단계 전반의 퍼널 전환율과 진행 상황을 분석하고 개선합니다."],"MOD-143":["전환 경험 최적화","랜딩 페이지, CTA, 양식, 웹 경험 등 고객 여정 전반의 전환 접점을 지속적으로 최적화해 전환율과 리드 품질을 높입니 측정하고 최적화합니다. 초기 AI 교육 완료를 전제로 도입이 잘 되는 곳과 정체된 곳을 추적하고, 워크플로 마찰을 찾고, 맞춤 개입을 실행하며, AI가 일상 업무에 녹아드는 방식을 개선합니다. 처음부터 하는 교육이 아니라 지속 개선 프로그램입니다."],"MOD-169":["AI 실험 및 혁신 프로그램","조직 내 새로운 AI 활용 사례를 발굴, 설계, 검증하는 지속 프로그램입니다. 가설부터 테스트, 결과까지 체계적인 실험 사이클을 운영해 고객이 실용적인 AI 활용의 최전선에 있도록 하고 AI 역량 로드맵을 계속 확장합니다."],"MOD-170":["HubSpot 포털 관리 및 유지보수","고객의 HubSpot 인스턴스를 사전 유지보수와 문제 해결 모두를 포함해 지속적으로 관리합니다. 사용자 접근, 시스템 설정, 데이터 정리, 워크플로 상태, 통합 모니터링을 관리해 플랫폼이 안정적으로 운영되고 데이터가 깨끗하며 문제가 비즈니스에 영향을 주기 전에 해결되도록 합니다. 파트너가 HubSpot을 매일 운영해 주기를 원하는 고객을 위한 운영 계층입니다."],"MOD-171":["HubSpot 전략 자문","내부 관리자를 갖춘 고객 팀에 HubSpot 전문가 지침, 문제 해결 지원, 전략 제안을 필요할 때 제공하는 자문 리테이너입니다. 기술 및 전략 질문 답변, 모범 사례 조언, 구축 전 설정 검토, HubSpot 변화에 따른 사전 제안을 포함합니다. 내부 관리팀을 대체하지 않고 그 위의 전문가 계층 역할을 합니다."],"MOD-172":["예측 및 파이프라인 거버넌스","파이프라인 검토 주기, 예측 정확도, 거래 점검을 지원해 CRM 데이터를 경영진이 신뢰할 수 있는 매출 가시성으로 바꿉니다."],"MOD-173":["기술 스택 및 통합 관리","GTM 기술 생태계를 관리합니다. 통합 상태를 모니터링하고, 도구 사용을 점검하며, 스택이 변화함에 따라 구매, 자체 구축, 폐기 결정을 안내합니다."],"MOD-174":["워크플로 및 자동화 최적화","HubSpot 워크플로와 자동화 시스템을 지속적으로 검토, 개선, 확장해 효율을 유지하고 오류를 줄이며 변화하는 비즈니스 프로세스에 맞춥니다. 고장 나거나 성과가 낮은 자동화를 고치는 작업과 효율을 높일 새 자동화를 발굴·구축하는 작업을 모두 포함합니다."],"MOD-175":["데이터 및 프로세스 최적화","HubSpot 인스턴스 전반의 CRM 데이터 품질, 일관성, 프로세스 정렬을 지속적으로 개선합니다. 중복 제거, 정규화, 보강, 거버넌스 등 대규모 데이터 정리를 관리하고 조직 변화에 맞춰 데이터 구조와 비즈니스 프로세스를 조정해 CRM이 시간이 지나도 신뢰할 수 있는 원천으로 유지되도록 합니다."],"MOD-176":["리포팅 및 성과 최적화","매출 팀이 정확하고 실행 가능한 성과 가시성을 갖도록 HubSpot 리포팅 및 분석 시스템을 지속적으로 유지, 개발, 개선합니다. 기존 대시보드와 리포트를 관리하고, 필요에 따라 새 리포트를 만들며, 이해관계자별로 품질과 관련성을 높여 리포팅이 비즈니스 속도를 따라가도록 합니다."],"MOD-177":["파트타임 RevOps 리더십","고객의 매출 운영에 전략적 감독, 성과 검토, 지속 개선 방향을 제공하는 파트타임 RevOps 리더십입니다. 실무 실행은 다른 RevOps 서비스나 내부 팀이 맡는다고 보고, 모든 RevOps 업무가 올바른 우선순위를 향하도록 방향을 정하는 전략 계층에만 집중합니다."],"MOD-178":["RevOps 자문","정기 자문 세션을 통해 시니어 RevOps 전문가에게 체계적으로 접근할 수 있게 하며, 전체 운영 리테이너의 부담 없이 전략 지침, 문제 해결, 의사결정 지원을 받을 수 있는 유연한 컨설팅 계층입니다."],"MOD-179":["관리형 마케팅 운영","Loop Marketing 사이클 사이에 자동화 상태, 데이터 품질, 세분화 정확도, 이메일 도달률, 개인화 인프라를 유지하며 고객의 마케팅 운영 체계를 지속적으로 관리합니다. 시스템이 깨끗하게 돌아가도록 해 새 Loop가 건강하고 정확한 기반 ales Hub Implementation":"Sales Hub 구축","Sales Onboarding & Training":"영업 온보딩 및 교육","Service Hub Implementation":"Service Hub 구축","Smart CRM Implementation":"Smart CRM 구축"},"pkg":{"PKG-001":["GTM 혁신","ICP를 정교화하고 포지셔닝을 재구축하며 영업, 마케팅, RevOps를 하나의 GTM 모션으로 정렬해야 하는 기업을 위한 종합적인 시장 진출 전략 개편입니다. 풀 퍼널 진단, 전략 수립, HubSpot 구축을 포함합니다."],"PKG-002":["Smart CRM 구축","데이터 아키텍처, 영업 프로세스 자동화, 리포팅에 중점을 둔 체계적인 HubSpot CRM 구축입니다. 기존 CRM에서 이전하거나 복잡해진 HubSpot을 정리하려는 기업에 적합합니다. 영업팀이 실제로 사용하는 CRM을 제공합니다."],"PKG-003":["수요 창출 체계 구축","HubSpot에 완전한 수요 창출 엔진을 구축합니다. Marketing Hub 설정, 캠페인 아키텍처, 리드 관리, 너처링 자동화, 기여도 리포팅을 포함합니다. HubSpot을 연락처 데이터베이스에서 적극적인 파이프라인 창출 엔진으로 바꿉니다."],"PKG-004":["영업 성과 혁신","영업 프로세스를 재설계하고 이를 뒷받침할 HubSpot 인프라를 구축하며 팀이 일관되게 실행하도록 지원합니다. 프로세스 설계, CRM 설정, 영업 생산성 도구, 코칭 체계를 결합합니다."],"PKG-005":["RevOps 기반","영업, 마케팅, 고객 성공 전반에 RevOps 운영 모델을 수립합니다. 퍼널 정의, 인계 설계, KPI 프레임워크, 그리고 전체 고객 라이프사이클을 하나의 시스템에서 운영하고 보고하기 위한 HubSpot 인프라를 포함합니다."],"PKG-006":["AI 기반 매출 가속화","매출 조직 전반에서 가치 높은 AI 활용 사례를 찾고, HubSpot에서 AI 워크플로와 에이전트를 설계·구축하며, 팀이 일상적인 GTM 업무에 AI를 활용하도록 지원합니다. AI 기회 발굴부터 배포와 도입까지 아우릅니다."],"PKG-007":["콘텐츠 및 SEO 성장 엔진","복리로 성장하는 오가닉 파이프라인을 만드는 데 필요한 콘텐츠 운영과 SEO 인프라를 구축합니다. SEO/AEO 전략, 웹사이트 구축, 콘텐츠 운영, 그리고 대규모 게시·추적·최적화를 위한 HubSpot Content Hub 설정을 포함합니다."],"PKG-008":["Salesforce → HubSpot 마이그레이션","Salesforce(흔히 Pardot 또는 Marketing Cloud 포함)에서 HubSpot으로의 체계적인 마이그레이션으로, 데이터 모델 변환, 레코드 이전, 통합 재매핑, 영업 프로세스 재구축을 포함합니다. 팀이 신뢰하는 깨끗한 HubSpot과 실제 도입을 보장하는 변화 관리 계획을 제공합니다."],"PKG-009":["HubSpot 개선 및 최적화","복잡하거나 일관성이 없거나 활용도가 낮아진 기존 HubSpot을 체계적으로 정리하고 최적화합니다. 데이터 모델 재설계, 워크플로 정비, 리포팅 전면 개편, 재교육을 포함합니다. 처음부터 다시 시작하지 않고도 팀이 자랑스럽게 실제로 사용하는 HubSpot을 제공합니다."],"PKG-010":["고객 라이프사이클 및 유지 프로그램","HubSpot에 고객 성공 및 유지 인프라를 구축합니다. Service Hub 설정, 판매 후 라이프사이클 단계 설계, CS 자동화, 건강도 점수, 피드백 루프, 영업에서 CS로의 인계를 포함합니다. HubSpot을 영업 도구에서 고객 유지와 확장을 이끄는 완전한 고객 라이프사이클 플랫폼으로 바꿉니다."],"PKG-011":["아웃바운드 영업 엔진","HubSpot에서 체계적인 아웃바운드 영업 모션을 설계·구축합니다. ICP 타기팅, 신호 기반 잠재고객 발굴, 시퀀스 인프라, AI 기반 잠재고객 발굴 에이전트, 아웃바운드 파이프라인 관리와 보고를 위한 CRM     <input type="checkbox" id="cb-${s.id}" data-id="${s.id}" ${on?"checked":""}>
    <label for="cb-${s.id}"><div class="t"${en}>${esc(t)}</div><div class="tags">${tags}</div><div class="d"${en}>${esc(d)}</div>${mt?`<div class="desc"${en}>${esc(mt.d)}</div>`:""}</label>
    <div class="hrs"><input type="number" min="0" step="1" value="${h}" data-h="${s.id}" aria-label="${u.hoursFor} ${esc(t)}">${s.monthly?u.hrsMo:u.hrs}</div>
    <div class="p" data-price="${s.id}" data-mo="${s.monthly?1:""}" data-rt="${rt}">${priceHTML(h,s.monthly,rt)}</div>
  </div>`;
}

function summaryTable(){
  const c = calc(), u = U(), co = content(), tier = u[state.preset] || u.custom, cur = mkt().cur;
  const mName = u.marketNames[MARKETS.indexOf(mkt())];
  const title = `${c.b.name}: ${tx(u.pkg,{t:tier})}`;
  const one = c.picked.filter(s=>!s.monthly), mon = c.picked.filter(s=>s.monthly);
  const line = s=>[label(s).t, s.monthly?u.tMon:u.tOne, c.hrs(s), fmt(c.rate(s))+u.perHr, fmt(c.price(s))];
  const rows = [...one.map(line)];
  if(one.length) rows.push({sub:true, v:[u.rcOne,"",c.setupHrs,"",fmt(c.setupFee)]});
  rows.push(...mon.map(line));
  if(mon.length) rows.push({sub:true, v:[u.rcMon,"",c.monHrs,"",fmt(c.monthly)]});
  const info = [[u.lArch,c.b.name],[u.lMarket,mName],[u.rcCx,tierName()],[u.sRate,fmt(state.s)+u.perHr],[u.eRate,fmt(state.e)+u.perHr]];
  const totals = [[u.setupFee,fmt(c.setupFee)],[u.monthlyRet,fmt(c.monthly)],[u.termValue+" ("+tx(u.termSub,{m:state.months})+")",fmt(c.year)]];
  const head = [u.rcService,u.rcType,u.rcHrs,u.rcRate,u.rcPrice];
  // plain text: tab-separated so it pastes into Sheets/Excel as columns
  const tsv = [title,"", ...info.map(r=>r.join("\t")), "", head.join("\t"), ...rows.map(r=>(r.sub?r.v:r).join("\t")), "", ...totals.map(r=>r[0]+"\t\t\t\t"+r[1]), "", u.outcomesH, ...co.outcomes.map(o=>"- "+o)].join("\n");
  // rich HTML: renders as a real table in email, Docs, Slides and Sheets
  const cell = "border:1px solid #D5DCE3;padding:6px 10px;font-family:Arial,sans-serif;font-size:13px;vertical-align:top;color:#152130;background:#FFFFFF";
  const num = cell+";text-align:right;white-space:nowrap";
  const th = "border:1px solid #D5DCE3;padding:7px 10px;font-family:Arial,sans-serif;font-size:12px;background:#152130;color:#FFFFFF;text-align:left";
  const tr = (v,sub)=>`<tr>${v.map((x,i)=>`<td style="${i>=2?num:cell}${sub?";background:#FFF1EC;font-weight:bold":""}">${esc(x)}</td>`).join("")}</tr>`;
  const html = `<div style="font-family:Arial,sans-serif;color:#152130;background:#FFFFFF">
<p style="font-size:16px;font-weight:bold;margin:0 0 8px;color:#152130">${esc(title)}</p>
<table style="border-collapse:collapse;margin:0 0 12px">${info.map(r=>`<tr><td style="${cell};color:#5B6B7C">${esc(r[0])}</td><td style="${cell}">${esc(r[1])}</td></tr>`).join("")}</table>
<table style="border-collapse:collapse;margin:0 0 12px"><thead><tr>${head.map((h,i)=>`<th style="${th}${i>=2?";text-align:right":""}">${esc(h)}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>r.sub?tr(r.v,true):tr(r)).join("")}</tbody></table>
<table style="border-collapse:collapse;margin:0 0 12px">${totals.map((r,i)=>`<tr><td style="${cell};font-weight:bold">${esc(r[0])}</td><td style="${num};font-weight:bold${i===2?";background:#FFF1EC":""}">${esc(r[1])}</td></tr>`).join("")}</table>
<p style="font-size:13px;font-weight:bold;margin:0 0 4px;color:#152130">${esc(u.outcomesH)}</p>
<ul style="margin:0;padding-left:18px;font-size:13px;color:#152130">${co.outcomes.map(o=>`<li>${esc(o)}</li>`).join("")}</ul></div>`;
  return {tsv, html};
}
async function copyTable(){
  const {tsv, html} = summaryTable();
  if(window.ClipboardItem && navigator.clipboard && navigator.clipboard.write){
    try{ await navigator.clipboard.write([new ClipboardItem({"text/html":new Blob([html],{type:"text/html"}),"text/plain":new Blob([tsv],{type:"text/plain"})})]); return; }catch(e){}
  }
  await navigator.clipboard.writeText(tsv);
}
