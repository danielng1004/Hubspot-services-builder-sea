const CAT_T={"zh-CN":{"mod":{"MOD-001":["市场与 ICP 战略审计","评估客户当前的市场定位策略、ICP 定义和细分方法，找出错位之处、尚未开发的细分市场以及聚焦机会。判断企业是否以正确的方式追求正确的客户，以及 ICP 是否基于真实客户数据并经实际成果验证，而非凭假设。"],"MOD-002":["定位、信息与产品方案审计","评估客户定位、信息传达和产品方案结构的清晰度、差异化和市场共鸣。判断价值主张是否有吸引力且与众不同，信息在各渠道和团队之间是否一致，以及产品方案是否能以合适的价格吸引合适的买家。"],"MOD-003":["需求生成与增长模式审计","评估企业在各渠道、营销活动和投入上产生销售管道的效果。从渠道组合、预算分配到活动表现和管道贡献，全面审视需求生成模式，找出增长模式中有效、表现不佳以及改进杠杆最大的环节。"],"MOD-004":["漏斗转化与生命周期审计","评估线索和联系人从获客到成交在各生命周期阶段的推进效率，找出转化缺口、流失点、速度问题和阶段定义错位。涵盖从漏斗顶部经 MQL、SQL 到赢单的售前生命周期。与“客户生命周期与增长模式审计”不同，本服务聚焦获客和转化旅程，而非获客后的客户体验。"],"MOD-005":["销售模式与管道管理审计","评估客户销售流程执行、管道管理纪律和交易推进做法的有效性。关注机会进入管道之后的情况：交易如何管理、管道健康如何维护、预测准确性如何实现，以及哪些执行缺口导致延误或收入流失。与“漏斗转化与生命周期审计”不同，本服务覆盖管道内的销售执行层。"],"MOD-006":["客户生命周期与增长模式审计","评估企业在获客后如何留存和扩展客户，审视客户生命周期模式、扩展动作和售后增长杠杆的战略有效性。涵盖获客后的客户旅程：入门效果、留存健康度、扩展机会把握，以及从现有客户增长收入的整体模式。本服务从获客漏斗结束处开始。"],"MOD-007":["RevOps 一致性审计","评估客户的 CRM 配置、数据基础设施、集成和报告系统与整体 GTM 战略和业务目标的契合程度。这是战略一致性审视，而非技术系统健康评估，关注收入技术栈是否支持正确的决策、呈现正确的数据，并契合企业的市场进入方式。与评估技术实例健康的 RevOps 审计不同，本服务评估系统与战略之间的一致性。"],"MOD-008":["KPI 框架与绩效管理审计","评估客户当前的 KPI 框架、衡量体系和绩效报告基础设施，判断是否追踪了正确的指标、各团队定义是否一致，以及报告层能否为管理层提供决策所需的可见性。找出衡量覆盖缺口、团队间指标错位和限制绩效管理的报告盲点。"],"MOD-009":["GTM 组织设计与协同审计","评估客户在营销、销售和客户成功之间的市场进入组织结构、角色定义和跨职能协同。判断组织结构能否有效执行 GTM 战略，找出覆盖缺口、角色模糊、问责错位以及在收入流程中造成摩擦的结构性低效。"],"MOD-010":["AI 机会识别与评估","通过分析工作流、流程和数据，识别并评估全业务中潜在的 AI 用例，发掘自动化、增强和提效的机会。提供 AI 可在哪些方面创造价值以及各机会相对可行性的方向性判断。"],"MOD-011":["AI 数据就绪度评估","评估组织的数据基础能否支持 AI 用例，包括数据质量、结构、可访问性和完整性。"],"MOD-012":["AI 工具与平台评估","评估当前的 AI 和技术栈，确定能力缺口、冗余以及支持 AI 用例的就绪程度。"],"MOD-013":["AI 治理与风险评估","通过评估治理结构、风险管理做法和合规因素，判断组织负责任地部署 AI 的就绪程度。"],"MOD-014":["AI 组织就绪度评估","评估组织在人员、技能和文化方面有效采用并规模化 AI 的就绪程度。"],"MOD-015":["领导层协同与支持评估","评估高管协同、支持力度以及领导层推动并维持组织变革的就绪程度。"],"MOD-016":["角色、流程与问责评估","评估角色、职责和流程的清晰度，确保变革执行中权责明确、减少摩擦。"],"MOD-017":["利益相关方与采用就绪度评估","评估利益相关方对新工作方式的认知、认同和采用就绪程度，包括抵触风险和变革疲劳。"],"MOD-018":["变革沟通与赋能评估","评估支持变革成功落地所需的沟通策略和赋能基础设施的有效性。"],"MOD-019":["系统与实例健康评估","评估 CRM 实例的整体健康、配置和治理，找出低效、错误配置、技术债务和治理缺口。这是覆盖实例设置与管理方式的广泛运营审视，不深入数据模型架构、数据质量或集成可靠性（这些各有专门评估）。在进一步投入实施或优化之前，给出实例运作良好与需要关注之处的优先级全景。"],"MOD-020":["CRM 数据模型与架构评估","评估 HubSpot CRM 数据模型的结构和设计，判断其能否支持可扩展的报告、自动化和业务流程执行。审视对象、属性、关联和管道的架构，找出结构缺口、设计局限，以及数据模型与其应反映的实际业务流程之间的错位。"],"MOD-021":["数据质量与完整性评估","评估 CRM 数据的完整性、准确性、一致性和可靠性，判断其能否支持有效的报告、自动化和业务决策。评估的是数据本身的健康而非数据模型结构，找出记录不完整、不准确、重复或格式不一致、削弱 CRM 作为可信数据源价值的地方。"],"MOD-022":["集成与数据流评估","评估技术栈中的系统集成、数据同步和数据流可靠性，找出风险、低效和缺口。"],"MOD-023":["利益相关方、角色与流程调研","通过结构化的利益相关方调研，梳理 GTM 角色、职责和流程的现状。清楚呈现谁负责什么、营销、销售和客户成功的工作实际如何完成，以及哪些流程有明确定义、哪些以非正式或不一致的方式运作。为后续工作流梳理、流程协同和改进奠定运营基础。与“GTM 组织设计与协同审计”不同，本服务记录运营现实，而非评估组织结构设计是否正确。"],"MOD-024":["工作流梳理与交接分析","记录并分析营销、销售和客户成功之间端到端的工作流，尤其关注最常出现摩擦、沟通失误和流程中断的交接点。将调研结果转化为可视化工作流图，揭示工作实际与预期的流转差异，并找出交接失败造成下游运营问题的环节。"],"MOD-025":["流程与系统一致性评估","评估客户已定义的 GTM 流程在技术系统（尤其是 HubSpot）中的体现、配置和支持程度。找出系统配置准确支持预期流程之处、造成摩擦或变通做法之处，以及完全在系统之外执行流程之处。与“RevOps 一致性审计”不同，本服务在工作流执行层面评估流程与系统的一致性。"],"MOD-026":["漏斗、SLA 与运营节奏评估","评估 GTM 漏斗的运营和治理层，判断 SLA 是否定义清晰、执行一致并可衡量，以及营销、销售和客户成功的运营节奏是否提供足够的可见性和问责。关注流程治理而非漏斗表现数据。与分析转化率和管道速度的“漏斗转化与生命周期审计”不同，本服务评估是否具备长期稳定管理漏斗表现的运营基础和治理结构。"],"MOD-027":["客户旅程审计","梳理端到端客户旅程，找出各触点之间的缺口、不一致和摩擦。"],"MOD-028":["转化体验审计","评估网站、表单、落地页和 CTA 等转化点的用户体验、信息清晰度和摩擦，找出潜在客户流失或失去兴趣的位置。"],"MOD-029":["销售与交接体验审计","评估销售接触和团队交接过程中的买家体验（而非销售执行），审视潜在客户在销售和过渡流程各阶段的感受和遭遇。"],"MOD-030":["入门与客户体验审计","评估售后入门体验、价值实现时间和早期客户互动，找出客户关系关键初期的摩擦、缺口和流失风险。"],"MOD-031":["留存与扩展体验审计","评估客户在留存和扩展互动中的实际体验（区别于企业为增长所做的结构设计），审视互动质量、扩展触点以及持续价值交付的真实感受。"],"MOD-032":["支持与自助服务审计","评估客户在支持互动和自助资源中的体验，审视客户需要时如何获得帮助、问题解决效果如何，以及自助渠道在减少摩擦和提升满意度方面的效果。"],"MOD-033":["SEO 与 AEO 审计","评估内容结构、技术 SEO 和 AI 搜索就绪度，找出在搜索引擎和 AI 平台上可发现性、索引和可回答性方面的缺口。"],"MOD-034":["ICP 与细分战略","定义理想客户画像和细分战略，优先锁定最具增长价值的受众。"],"MOD-035":["定位与信息战略","定义公司如何实现差异化并向目标客户传达价值。"],"MOD-036":["GTM 模式、渠道与生命周期战略","定义企业如何跨渠道和生命周期阶段获取、转化、留存和扩展客户。"],"MOD-037":["GTM 规划与路线图制定","将战略转化为有优先级的执行计划，明确举措、时间表和成功指标。"],"MOD-038":["SEO 与 AEO 战略","制定可扩展的内容和搜索战略，同时针对传统搜索引擎和 AI 驱动的发现进行优化。"],"MOD-039":["ABM 计划战略与设计","制定与目标客户、销售模式和收入目标一致的基于客户的营销战略。"],"MOD-040":["ABM 数据与定位战略","定义如何利用客户数据、信号和数据丰富来推动定位和互动。"],"MOD-041":["AI 用例优先级与商业论证战略","根据业务影响、可行性和战略契合度识别并排序 AI 用例。"],"MOD-042":["AI 能力与成熟度战略","定义在数据、系统、治理和团队方面支持 AI 采用所需的能力。"],"MOD-043":["AI 投资与路线图规划","制定分阶段的 AI 采用路线图，包括实施顺序、投资优先级和预期成果。"],"MOD-044":["变革战略与方法设计","制定与业务目标一致、用于管理和推动组织变革的整体战略。"],"MOD-045":["利益相关方参与与沟通战略","定义在整个变革过程中如何让利益相关方参与、知情并保持一致。"],"MOD-046":["培训与赋能战略","定义如何培训和赋能团队，以采用新的流程、系统或工作方式。"],"MOD-047":["采用与推广规划","定义变革如何在组织内推广，包括实施顺序、试点和规模化方式。"],"MOD-048":["CRM 数据模型与系统设计","设计支持 GTM 流程和报告所需的 CRM 数据模型、对象和结构。"],"MOD-049":["集成与数据流设计","定义数据如何在系统之间流动以及集成应如何构建。"],"MOD-050":["数据治理与管理设计","制定确保数据质量、一致性和可靠性的标准与流程。"],"MOD-051":["销售模式与流程设计","设计与 GTM 模式和买家旅程一致的结构化销售流程。"],"MOD-052":["营销活动与漏斗架构设计","设计支持需求生成和转化的营销活动结构和漏斗架构。"],"MOD-053":["客户生命周期与交接设计","设计营销、销售和客户团队之间的生命周期阶段和交接流程。"],"MOD-054":["AI 用例与工作流设计","设计与优先用例一致的 AI 赋能工作流和自动化。"],"MOD-055":["AI 智能体战略与设计","定义支持 GTM 工作流的 AI 智能体的架构和行为。"],"MOD-056":["AI 数据与治理设计","定义 AI 系统所需数据应如何构建、治理和访问。"],"MOD-057":["KPI 与衡量框架设计","定义与 GTM 战略一致的绩效指标和衡量结构。"],"MOD-058":["仪表板与报告架构设计","设计提供可见性、支持决策的仪表板和报告系统。"],"MOD-059":["营销信号与个性化架构设计","设计支撑规模化 Loop Marketing 的数据架构、信号流和个性化令牌框架。定义行为信号、数据丰富和 CRM 属性如何映射到邮件、网站和内容中的个性化用例，形成所有下游营销系统实施所遵循的蓝图。"],"MOD-060":["CRM 架构与数据模型实施","按照设计的架构实施 CRM 数据模型，包括对象、属性、生命周期阶段和管道。"],"MOD-061":["CRM 设置","配置 CRM 核心设置、用户访问、权限和基础系统设置。"],"MOD-062":["CRM 数据迁移与数据质量实施","准备、迁移并验证导入 CRM 的数据，确保准确、一致和可用。"],"MOD-063":["销售流程与线索管理实施","实施与既定 GTM 模式和生命周期一致的销售流程和线索管理工作流。"],"MOD-064":["自动化与工作流实施","构建自动化工作流，以简化流程、落实治理并提升运营效率。"],"MOD-065":["报告与仪表板实施","构建报告和仪表板，呈现管道表现、销售活动和预测情况。"],"MOD-066":["HubSpot 原生集成实施","实施并配置 HubSpot 应用市场原生集成，连接系统、同步数据，实现跨工具的顺畅工作流。"],"MOD-067":["Marketing Hub 设置","配置开展营销所需的 Marketing Hub 基础设置、域名和系统基础设施。"],"MOD-068":["线索管理与生命周期自动化设置","实施线索生命周期管理、评分和自动化，管理潜在客户从线索到客户的推进。"],"MOD-069":["营销活动、转化与渠道设置","实施营销活动结构、转化路径和追踪机制，支持需求生成和归因。"],"MOD-070":["HubSpot AEO 配置","配置 HubSpot 原生 AEO 功能：设置品牌语调、配置 AEO 监测仪表板、将工具连接到正确的内容和域名，并建立基线追踪。即搭建衡量并提升 AI 答案引擎可见度的工具。"],"MOD-071":["邮件营销与培育自动化实施","构建邮件营销计划和培育工作流，在整个漏斗中持续触达线索。"],"MOD-072":["细分与个性化实施","实施细分框架和个性化能力，提供精准的营销体验。"],"MOD-073":["营销报告与归因实施","构建报告系统和归因模型，衡量营销表现及其对收入的影响。"],"MOD-074":["Content Hub 设置","配置内容创作和管理所需的 Content Hub 基础设置、品牌体系和核心内容工具。"],"MOD-075":["网站设计","根据转化和内容战略设计网站的结构、用户体验和视觉体系。"],"MOD-076":["网站与 CMS 开发","在 HubSpot 中构建网站和 CMS 基础设施，包括主题、模板、模块和集成。"],"MOD-077":["内容迁移与 URL 架构设置","将现有内容迁移到 HubSpot，同时保留 SEO 价值、结构和用户体验。"],"MOD-078":["SEO、AEO 与技术性能设置","为搜索配置 CMS 基础设施：URL 架构、站点地图、规范链接、页面速度、Core Web Vitals、移动端，以及主题/模板层的结构化数据模板。让网站在技术上适合搜索引擎和 AI 爬虫。"],"MOD-079":["内容运营、治理与个性化设置","实施内容工作流、治理标准和个性化能力，实现可扩展且一致的内容运营。"],"MOD-080":["内容报告与分析","实施内容表现追踪和分析，衡量并交付价值。"],"MOD-081":["会员体验实施","在 HubSpot 中设计、构建并运营能创造收入或推动互动的会员生态的结构化服务。"],"MOD-082":["销售流程与管道实施","实施与既定销售模式和生命周期一致的销售流程、管道和线索管理工作流。"],"MOD-083":["销售效率工具与赋能实施","实施销售效率工具，提升销售团队的效率、一致性和执行力。"],"MOD-084":["Prospecting Agent 配置与部署","实施并部署 AI 驱动的潜客开发智能体，包括定位逻辑、个性化和工作流集成。"],"MOD-085":["销售报告与预测实施","构建报告系统和仪表板，呈现管道表现、预测和销售效率。"],"MOD-086":["区域与客户细分实施","实施区域模型、客户细分和归属结构，支持高效的销售覆盖。"],"MOD-087":["Commerce Hub 与支付设置","配置 Commerce Hub 基础设置、支付基础设施和系统级商务功能。"],"MOD-088":["产品库与定价架构实施","实施支持报价、计费和报告所需的产品目录和定价结构。"],"MOD-089":["CPQ（报价配置与自动化）实施","实施报价生成、定价逻辑和审批工作流，支持高效准确的销售报价。"],"MOD-090":["订阅与计费管理实施","实施订阅生命周期管理、计费逻辑和经常性收入流程。"],"MOD-091":["结账、支付与收款实施","实施结账体验和收款工作流，支持顺畅的客户交易。"],"MOD-092":["收入生命周期自动化与财务系统集成","实施端到端收入生命周期自动化并集成财务系统，确保运营准确且可扩展。"],"MOD-093":["收入报告、合规与治理实施","实施收入报告、财务可见性和治理框架，支持合规与决策。"],"MOD-094":["Service Hub 设置","为支持运营配置 Service Hub 基础设置和客户沟通渠道。"],"MOD-095":["工单管道与 SLA 实施","实施工单管道、SLA 和核心服务工作流，管理客户支持请求。"],"MOD-096":["路由、自动化与服务运营实施","实施路由逻辑和自动化，确保高效分配工单、管理工作量并促进内部协作。"],"MOD-097":["Help Desk 工作区与客服效率实施","配置 Help Desk 工作区和客服工具，提升效率、可见性和绩效。"],"MOD-098":["自助服务、知识库与客户门户实施","实施自助服务体验，减轻支持负担并让客户更方便地获取信息。"],"MOD-099":["客户成功与反馈系统实施","实施客户成功工作流、健康评分和反馈系统，提升留存和满意度。"],"MOD-100":["Customer Agent 配置与部署","实施 AI 驱动的客户支持智能体，处理咨询、协助用户，并在需要时转交人工客服。"],"MOD-101":["服务报告与分析实施","构建报告系统，呈现支持表现、客户满意度和运营效率。"],"MOD-102":["Data Hub 设置","建立 Data Hub 基础设施和数据集架构，为所有下游数据运营、报告和 AI 能力打下基础。涵盖 Data Hub 初始配置、数据集设计与构建、数据模型对齐，以及决定数据如何在 HubSpot 实例中流动和被查询的结构性决策。"],"MOD-103":["数据集成与同步实施","使用 Data Hub 原生同步基础设施，在 HubSpot 与外部系统之间实施双向和单向数据同步连接。配置字段映射、同步逻辑、冲突解决规则和数据转换，确保 HubSpot 与客户整体技术栈之间的数据流干净可靠。"],"MOD-104":["数据质量、丰富与意向数据实施","在 Data Hub 环境中实施 HubSpot 原生的数据质量、数据丰富和意向数据能力。配置数据质量自动化以保持记录干净一致；设置 HubSpot 数据丰富，自动补全联系人和公司数据；并启用买家意向，找出显示积极购买信号的客户。属于 Data Hub 初始平台搭建的一部分，配置的是 HubSpot 原生工具，而非构建更广泛的定制信号激活系统。"],"MOD-105":["数据建模、计算与收入对齐","设计并实施支撑 HubSpot 内准确商业智能和报告的数据模型、计算属性和收入数据结构。将客户的收入模式和业务逻辑转化为 HubSpot 数据层，确保最重要的指标（管道、收入、留存、LTV、流失）计算正确、定义一致，并在报告和仪表板中可靠可用。"],"MOD-106":["自动化、工作流与可编程逻辑实施","实施 Data Hub 的高级自动化能力，包括可编程工作流、自定义代码操作和事件驱动逻辑，实现超出标准 HubSpot 工作流的复杂业务流程自动化。属于 Data Hub 初始平台搭建的一部分，在更大的实施范围内配置 Data Hub 的技术自动化层，而非单独的工程项目。"],"MOD-107":["数据激活、AI 智能体与跨 Hub 智能","实施数据激活策略、AI 数据智能体和跨 Hub 智能，让数据在营销、销售和服务中发挥作用。"],"MOD-108":["数据治理、监控与报告实施","实施治理框架、监控系统和报告基础设施，确保 Data Hub 环境运行可靠一致，并让利益相关方全面了解数据健康状况。涵盖数据治理政策落地、运营监控设置，以及让管理层和运营团队对决策所依赖的数据充满信心的报告层。"],"MOD-109":["定制 AI 助手开发（基于大语言模型）","使用大语言模型（如 GPT、Claude、Gemini）设计并构建针对特定业务用例的定制 AI 助手。"],"MOD-110":["定制 AI 智能体开发","设计并构建能够在既定范围内自主执行多步骤任务、使用工具、做出决策并完成工作流的定制 AI 智能体。超越对话式 AI 助手，构建能采取行动的系统：查询数据、调用 API、触发 HubSpot 工作流，并在极少人工干预下完成复杂任务。适用于传统自动化不足、执行时需要智能决策的场景。"],"MOD-111":["多智能体系统与编排实施","设计并实施多智能体系统，让专门的 AI 智能体协同完成单个智能体无法胜任的复杂多步骤工作流。构建完整的智能体网络，定义角色、通信协议、编排逻辑和交接机制，打造可靠、可扩展的 AI 系统，通过协同解决复杂业务难题。"],"MOD-112":["HubSpot Breeze Assistant 开发","在 HubSpot 中设计并配置定制的 Breeze Assistant，让平台原生 AI 能力契合客户的工作流、品牌语调和运营需求。涵盖 Breeze Assistant 提示词配置、内容助手设置、用于情境化回答的 CRM 数据集成，以及工作流集成，无需在平台外开发定制应用，即可提供契合团队实际工作方式的 HubSpot 原生 AI 体验。"],"MOD-113":["情境工程与知识配置","将 ICP、信息传达、流程、业务知识、规则、决策逻辑和数据结构等业务情境设计并编码到 AI 系统中，确保输出准确、一致且符合要求。"],"MOD-114":["高级 GTM 自动化与工作流工程","跨 HubSpot 对象和流程设计并实施复杂的自动化系统，让 GTM 执行可规模化运作。超越标准工作流设置，构建多分支决策树、跨对象自动化、自定义代码操作和行为触发器等复杂逻辑，无需人工干预即可大规模落实客户的 GTM 战略。"],"MOD-115":["数据丰富与信号激活系统","实施数据丰富管道、外部信号集成和激活工作流，提升定位、细分和 GTM 洞察。构建支撑下游 GTM 执行的数据基础设施，确保合适的丰富数据和行为信号在合适时间到达合适系统，实现更智能、由信号驱动的营销和销售。"],"MOD-116":["外呼与潜客开发系统工程","设计并构建结合 CRM 数据、行为信号和结构化信息的自动化外呼与潜客开发系统，高效规模化地产生管道。构建外呼背后的技术基础设施，从数据驱动的潜客识别与优先级排序，到自动序列触发和多渠道执行，让外呼成为可重复、可衡量的系统，而非销售随意的行为。"],"MOD-117":["跨系统集成与编排","使用原生连接器、中间件平台和 HubSpot 原生集成工具，在 HubSpot 与外部系统之间实施集成并编排数据流，无需定制代码开发。确保正确的数据在系统之间可靠流动并触发正确的下游操作，实现顺畅的 GTM 执行。与定制 API 开发不同，本服务使用原生和低代码集成工具。"],"MOD-118":["实验与增长系统开发","设计并构建结构化 GTM 实验的技术基础设施，让客户能够系统地测试、衡量并迭代定位、信息、自动化和工作流策略。将实验从临时测试变为可重复、可衡量的体系：假设结构化、结果严格衡量，经验不断积累，形成复利式增长优势。"],"MOD-119":["定制 API 与 Webhook 开发","使用 API、Webhook 和定制中间件，在 HubSpot 与外部系统之间设计并构建定制集成，在标准集成工具无法满足需求时提供定制方案。解决需要定制开发而非配置的复杂数据同步、高级工作流触发和系统互操作需求。"],"MOD-120":["信号捕获与数据丰富管道实施","构建技术基础设施，捕获网站、邮件和内容触点中的行为信号，通过第三方数据源丰富联系人和公司记录，并将丰富后的属性激活为动态细分和个性化令牌。这是实现规模化超个性化 Loop Marketing 的数据基础。"],"MOD-121":["营销自动化架构与 Loop 运营搭建","实施让 Loop Marketing 作为持续运行系统的自动化骨架。构建触发逻辑、内容路由工作流、培育分支和阶段编排，以程序化方式连接 Express、Tailor、Amplify 和 Evolve，让每个 Loop 周期以最少人工投入运行并不断改进。"],"MOD-122":["AI 内容生产系统搭建","设计并构建规模化 AI 辅助内容生产的运营基础设施，即 Loop Marketing Tailor 阶段背后的引擎。交付结构化提示词库、内容简报模板、针对不同格式的 AI 工作流和编辑审核流程，让客户团队能够更快、更稳定地在各渠道产出高质量的个性化内容。"],"MOD-123":["个性化引擎与智能内容实施","实施先进的个性化能力，利用丰富后的联系人数据、行为信号和 CRM 属性，在邮件和网站中提供动态定制体验。超越基础细分，构建真正的个性化引擎：智能内容规则、动态令牌框架和基于行为的受众路由，让每个触点都与个人相关。"],"MOD-124":["Loop 分析与智能系统搭建","实施 Loop Marketing 的 Evolve 层，即把营销活动数据转化为结构化洞察、为下一个 Loop 周期提供依据的分析、经验沉淀和智能基础设施。构建报告系统、内容表现追踪、归因模型和复盘框架，让 Loop Marketing 成为持续复利的体系，而非一系列互不相连的活动。"],"MOD-125":["HubSpot 入门与核心培训","结构化的入门项目，让客户团队在实施后能自信地使用 HubSpot。涵盖平台导览、核心功能培训和所涉 Hub 的基础工作流演示，确保每位用户从上线起都能在日常工作中有效使用 HubSpot。复杂度取决于所涉 Hub 数量和团队规模。"],"MOD-126":["高级角色化培训与赋能","全面的赋能项目，在客户团队中建立深入的、按角色划分的 HubSpot 能力。以完成核心入门为前提，聚焦高级功能采用、按角色定制的工作流和各职能的最佳实践，确保团队不仅会用 HubSpot，还能有效用它推动成果。设计为一次性的全面计划，而非持续培训支持。"],"MOD-127":["持续角色化入职与培训支持","持续的培训服务，随着客户团队成长和变化提供不间断的 HubSpot 赋能。以完成核心入门和初始角色化赋能为前提，重点是让新成员加入现有培训计划、随 HubSpot 更新保持材料最新，并处理随时出现的赋能需求。适用于 HubSpot 能力需要随团队持续扩展的成长型组织。"],"MOD-128":["高管赋能与协同","聚焦型项目，帮助高管和高级领导掌握 HubSpot 的报告、预测和战略可见性能力。面向需要从 HubSpot 数据中获取战略价值（管道评审、收入预测、绩效报告）但无需成为深度用户的决策者。确保领导层能放心地把 HubSpot 作为业务表现的可信来源，并就平台如何支持战略决策达成一致。"],"MOD-129":["销售流程与 CRM 培训","聚焦型培训，连接 HubSpot 使用能力与销售流程执行：不仅教销售团队如何使用 CRM，还教他们如何在 HubSpot 中正确推进管道、管理活动并遵循销售流程。以完成 HubSpot 核心入门为前提，重点是把销售方法论和流程纪律融入日常 CRM 习惯，推动反映团队实际销售方式的一致、高质量 CRM 使用。"],"MOD-130":["管道、预测与收入纪律培训","培训与辅导项目，在销售管理和领导团队中建立严谨的管道管理、准确的预测和收入纪律。超越 HubSpot 工具培训，聚焦带来可预测收入的方法论、习惯和管理节奏，包括如何开展有效的管道评审、审慎检查交易、自信预测，以及让销售人员对流程和结果标准负责。"],"MOD-131":["外呼潜客开发培训","实操培训项目，提升销售团队的外呼执行能力：教销售人员如何有效开发潜客、搭建并运行 HubSpot 序列、设计触达策略，并以纪律和一致性执行销售动作。聚焦漏斗顶部执行层，即销售人员如何利用 HubSpot 的潜客开发和序列工具发现、接触并把潜客转化为合格管道。与 CRM 流程培训不同，本服务关注如何建立管道，而非管道建立后如何管理。"],"MOD-132":["变革执行与采用管理","执行和管理进行中的变革计划，落实上游变革战略中定义的沟通和利益相关方参与方式。以完成变革就绪度评估和变革战略为前提，聚焦计划运行：开展沟通、处理出现的抵触、强化采用行为，并跟踪里程碑直至上线及之后。是把变革战略转化为持续组织采用的运营层。"],"MOD-133":["采用指标与治理设置","聚焦型项目，构建衡量和治理基础设施，依据现有变革战略和推广计划追踪采用表现。以完成上游战略和规划工作为前提，专注于搭建运营追踪层：定义成功指标、配置衡量工具，并建立问责结构，确保在整个计划周期中监测、报告并主动管理采用情况。"],"MOD-134":["AI 员工赋能与采用","结构化赋能项目，在 AI 工具上线后，帮助客户员工建立 AI 素养、能力和日常使用信心。提供按角色定制的培训、采用框架和推广大使激活，确保团队不仅知道如何使用 AI 工具，还能把它们有意义地融入具体工作流。属于起步阶段的赋能，适用于 AI 工具刚上线、团队需要从零起步的组织。"],"MOD-135":["嵌入 AI 的 SOP 与工作流赋能","聚焦型项目，重新设计并记录标准作业程序和工作流，在使用环节明确嵌入 AI 工具。把团队当前的工作方式转化为 AI 增强版的相同流程，确保 AI 不是附加工具，而是工作方式的一部分。适用于 AI 工具已上线、团队已有基本了解，但日常流程尚未正式更新以体现 AI 如何改变工作的组织。"],"MOD-136":["营销活动开发","规划并开发整合的多渠道营销活动，产生管道并推动需求。"],"MOD-137":["营销活动管理","管理营销活动在各渠道的分发，扩大触达并提升互动。"],"MOD-138":["营销活动效果优化","监测并优化营销活动表现，提升互动、转化和管道产出。"],"MOD-139":["Loop 营销周期管理","持续管理完整的 Loop Marketing 周期：推动从目标设定和品牌识别完善，到内容冲刺执行、多渠道分发以及结构化 Evolve 复盘的每个阶段。适合希望由合作伙伴推动 Loop 节奏的客户，每个周期都借助记录的经验和更精准的定位在前一周期基础上持续提升。"],"MOD-140":["生命周期与旅程优化","管理并优化生命周期阶段和客户旅程，改善线索推进和转化。"],"MOD-141":["培育与自动化优化","持续改进培育计划和自动化工作流，提升互动和转化。"],"MOD-142":["漏斗表现优化","分析并提升各生命周期阶段的漏斗转化率和推进效率。"],"MOD-143":["转化体验优化","持续优化客户旅程中的转化触点（落地页、CTA、表单和网站会话体验），提升转化率和线索质量。结合行为分析、A/B 测试和个性化调整，基于 Loop Marketing 表现数据形成测试假设，不断改善高意向访客的转化。"],"MOD-144":["SEO 与 AEO 基础搭建","聚焦执行的项目，把现有 SEO 和 AEO 战略落地为已上线、经优化的基础。以完成上游审计和战略为前提，从实施开始：优化重点页面在搜索和 AI 答案引擎中的可见度、部署结构化数据，并搭建建立主题权威所需的内链架构。"],"MOD-145":["内容创作与再利用","管理持续的内容创作和 AI 辅助的内容再利用，高效扩大内容产出。"],"MOD-146":["SEO 与 AEO 增长优化","针对搜索引擎和 AI 驱动的发现优化内容，提升自然可见度。"],"MOD-147":["内容分发与媒体运营","管理视频、播客和社交平台等渠道的内容分发。"],"MOD-148":["基于客户的营销活动执行","持续执行面向高优先级客户的多渠道 ABM 营销活动。管理完整的活动动作，包括外呼触达、付费广告、个性化网站体验和互动策略，确保目标客户在每个渠道接触到协调一致的触点。"],"MOD-149":["ABM 运营与收入协同","持续管理让销售和营销围绕目标客户保持协同的运营基础设施。维护共享客户名单、推动管道评审节奏、管理交接规范，并确保 ABM 活动与管道和收入成果直接挂钩，是营销执行与销售动作之间的纽带。"],"MOD-150":["ABM 效果与优化","持续分析并优化 ABM 计划相对管道和收入目标的表现。监测客户互动趋势、衡量活动和渠道效果、归因管道影响，并将数据转化为战略建议，不断优化定位、信息和资源分配。"],"MOD-151":["付费媒体基础搭建与启动","从零开始搭建并启动付费媒体计划的结构化项目。涵盖账户架构、活动结构、受众配置、追踪设置和 HubSpot 集成，交付可直接转入持续管理的完整付费媒体基础。适用于尚无付费基础设施或需要大幅重建的情况。"],"MOD-152":["付费媒体管理","持续管理搜索、社交和展示渠道的付费广告活动，带来精准流量、合格线索和管道增长。负责完整的活动运营层，包括设置、受众配置、预算管理、出价优化和线索追踪，确保付费投入高效使用并持续优化。"],"MOD-153":["广告创意冲刺","有时限的聚焦项目，为特定活动、发布或事件制作一套明确的广告创意素材。在固定时间内交付完整创意包（文案、设计和多种格式），无需长期创意服务承诺。适合有明确活动需求、内部团队负责日常创意，或在投入完整计划前测试付费渠道的客户。"],"MOD-154":["付费创意与广告制作","持续制作跨格式和渠道的广告创意，提升互动并转化目标受众。覆盖完整的创意制作周期：构思、文案、设计和格式适配，确保持续提供与活动优惠和受众信息一致的新鲜创意素材。"],"MOD-155":["付费效果与转化优化","持续衡量、测试并优化各活动、创意和落地体验中的付费媒体表现。通过严谨的归因管理把广告支出与管道和收入关联起来，开展结构化 A/B 和多变量测试以不断提升转化率，并将表现数据转化为优化定位、信息和预算分配的可行建议。"],"MOD-156":["社区与互动计划","持续管理品牌和客户社区的成长、活动策划和互动。围绕共同兴趣、产品使用或职业身份建立并激活受众，通过持续的社区活动和会员体验管理，提升忠诚度、同侪连接和自发倡导。"],"MOD-157":["创作者与达人营销活动","围绕特定目标（产品发布、活动、季节性营销或品牌认知）规划并执行创作者或达人营销活动的明确项目。覆盖从创作者筛选和简报、内容制作、发布到活动后效果报告的完整周期，交付有明确起止、可衡量的独立活动。"],"MOD-158":["创作者与达人计划","持续管理创作者和达人合作，扩大品牌影响、建立公信力并推动目标渠道受众增长。负责完整的合作周期：筛选、触达、关系管理、创意指导和效果追踪，确保持续产出与品牌和活动目标一致的创作者内容。"],"MOD-159":["倡导与推荐计划启动","从零开始设计、搭建并启动客户倡导与推荐计划的结构化项目。涵盖计划战略、推荐机制设计、激励结构、HubSpot 设置与追踪配置、倡导者招募以及首批激活，交付可进入持续管理的已上线计划。"],"MOD-160":["倡导与推荐计划","持续管理客户倡导与推荐计划，把满意客户转化为活跃的增长渠道。招募并培育倡导者，管理推荐机制和激励结构，推动评价、推荐语、转介绍和案例研究等由客户主导的活动，建立信任并产生管道。"],"MOD-161":["销售流程与 CRM 采用优化","持续监测并改进销售组织的 CRM 使用、销售流程遵循和运营一致性。持续呈现采用模式、管道卫生和流程缺口，帮助合作伙伴强化最佳实践、处理合规问题，并逐步可衡量地提升销售执行质量。"],"MOD-162":["外呼潜客开发优化","持续优化外呼潜客开发工作流、序列和信息，提高回复率、互动和管道产出。"],"MOD-163":["管道与预测优化","通过持续的运营支持、交易检查和分析评审，维持并提升管道纪律、预测准确性和收入流程一致性。帮助销售领导建立可靠的预测习惯，更早发现风险交易，并保持实现可预测收入所需的管道卫生。"],"MOD-164":["销售辅导与绩效赋能","提供持续的销售辅导、销售手册强化和绩效赋能，提升销售组织的执行一致性和人员效率。通过结构化辅导节奏、交易评审和强化活动支持经理和销售人员，把战略转化为可重复的销售行为。"],"MOD-165":["AI 辅助销售执行优化","优化 AI 辅助销售工作流、潜客开发系统和 AI 赋能收入运营的持续使用、效果和采用。通过管理提示词优化、使用治理、采用追踪和持续的工作流改进，确保 AI 工具长期稳定地产出高质量结果。"],"MOD-166":["AI 表现监测与优化","持续监测并优化已部署的 AI 工具、智能体和自动化，确保表现、准确性和业务影响稳定。追踪 Breeze 智能体、定制 AI 工作流和自动化系统的长期表现，发现性能下降或偏移，并持续改进以保持和提升成果。"],"MOD-167":["AI 治理与合规管理","持续管理 AI 治理框架、政策和合规义务，确保客户组织内 AI 的使用负责任、合规且可审计。追踪不断变化的 AI 法规、维护内部 AI 政策、管理 AI 用例的风险评估，并确保 AI 部署持续符合道德标准和监管要求。"],"MOD-168":["AI 采用与赋能优化","持续衡量并优化客户组织的 AI 采用健康度。以完成初始 AI 培训和赋能为前提，聚焦追踪采用顺利或停滞之处、发现工作流摩擦、开展针对性干预，并不断改进 AI 在日常运营中的融入方式。不是从零开始的培训，而是面向已上线 AI 工具的持续改进计划。"],"MOD-169":["AI 实验与创新计划","持续识别、设计并验证客户组织内新 AI 用例的计划。运行从假设、测试到结果的结构化实验周期，让客户始终处于实用 AI 应用的前沿，并不断扩展 AI 能力路线图，确保 AI 投入随业务发展，而不是在初始实施后停滞。"],"MOD-170":["HubSpot 门户管理维护","持续管理客户的 HubSpot 实例，包括主动维护和问题处理。管理用户访问、系统配置、数据卫生、工作流健康和集成监测，确保平台稳定运行、数据干净可信，并在问题影响业务前发现并解决。为需要合作伙伴日常运营 HubSpot 的客户提供完整运营层。"],"MOD-171":["HubSpot 战略咨询","持续的咨询服务，为具备内部管理能力的客户团队按需提供 HubSpot 专家指导、问题排查和战略建议。涵盖解答技术和战略问题、提供最佳实践建议、在实施前审核拟定配置，并随 HubSpot 发展主动提出建议。定位为内部管理团队之上的专家层，而非替代。"],"MOD-172":["预测与管道治理","支持管道评审节奏、预测准确性和交易检查，把 CRM 数据转化为管理层可依赖的收入可见性。"],"MOD-173":["技术栈与集成管理","管理 GTM 技术生态：监测集成健康、审计工具使用，并在技术栈演进时指导购买、自建或淘汰决策。"],"MOD-174":["工作流与自动化优化","持续评审、改进并扩展 HubSpot 工作流和自动化系统，保持效率、减少错误，并让自动化逻辑始终契合不断变化的业务流程。既包括修复失效或表现不佳的自动化，也包括主动识别并构建新的自动化，随业务发展提升效率。"],"MOD-175":["数据与流程优化","持续改进 HubSpot 实例中 CRM 数据的质量、一致性和流程契合度。规模化管理数据卫生（去重、标准化、数据丰富和治理），并随组织发展不断调整数据结构和业务流程，确保 CRM 始终是收入运营的可信数据源，而不会随时间退化。"],"MOD-176":["报告与绩效优化","持续维护、开发和增强 HubSpot 报告与分析系统，确保收入团队对绩效有准确、可行动的可见性。管理现有仪表板和报告，随业务需求构建新报告，并不断提升报告对各类利益相关方的质量和相关性，让报告层跟上业务发展，不会过时或失去可靠性。"],"MOD-177":["兼职 RevOps 领导","持续的兼职 RevOps 领导服务，为客户的收入运营提供战略监督、绩效评审和持续改进方向。以战术执行由其他 RevOps 服务或客户内部团队负责为前提，完全聚焦战略层：确保所有 RevOps 工作始终对准正确优先级的方向设定职能。"],"MOD-178":["RevOps 咨询","通过定期咨询会议，结构化地获得资深 RevOps 专业支持，是用于战略指导、问题解决和决策支持的灵活咨询层，无需承担完整运营服务的承诺和范围。"],"MOD-179":["营销运营托管","持续管理客户的营销运营体系，在 Loop Marketing 周期之间维护自动化健康、数据质量、细分准确性、邮件送达率和个性化基础设施。确保营销系统干净运行，让每个新 Loop 都从健康、准确的基础开始，累积的成果不会因系统偏移或数据退化而流失。"]},"off":{"AI & Automation Solution Design":"AI 与自动化解决方案设计","AI Application & Agent Development":"AI 应用与智能体开发","AI Readiness & Opportunity Assessment":"AI 就绪度与机会评估","AI Strategy & Roadmap":"AI 战略与路线图","Account-Based Marketing (ABM) Program":"基于客户的营销（ABM）计划","Account-Based Marketing (ABM) Strategy":"基于客户的营销（ABM）战略","CRM & Data Architecture Design":"CRM 与数据架构设计","Change & Adoption Strategy":"变革与采用战略","Change Management & AI Adoption Programs":"变革管理与 AI 采用计划","Change Management Readiness Assessment":"变革管理就绪度评估","Commerce Hub Implementation":"Commerce Hub 实施","Content Hub Implementation":"Content Hub 实施","Content, SEO & AEO Audit":"内容、SEO 与 AEO 审计","Content, SEO & AEO Growth Optimization":"内容、SEO 与 AEO 增长优化","Content, SEO & AEO Strategy":"内容、SEO 与 AEO 战略","Customer Engagement, Community & Advocacy":"客户互动、社区与倡导","Customer Journey & Experience Audit":"客户旅程与体验审计","Data Hub Implementation":"Data Hub 实施","Demand Generation & Campaign Program":"需求生成与营销活动计划","GTM Audit":"GTM 审计","GTM Process & Workflow Audit":"GTM 流程与工作流审计","GTM Strategy & Development":"GTM 战略与制定","GTM Systems & Automation Engineering":"GTM 系统与自动化工程","HubSpot Onboarding & Core Enablement":"HubSpot 入门与核心赋能","HubSpot Platform Administration & Support":"HubSpot 平台管理与支持","Lifecycle Marketing & Funnel Optimization":"生命周期营销与漏斗优化","Loop Marketing Program":"Loop Marketing 计划","Managed AI Operations":"AI 托管运营","Marketing Hub Implementation":"Marketing Hub 实施","Marketing Operations as a Service":"营销运营即服务","Marketing Systems Architecture Design":"营销系统架构设计","Marketing Systems Engineering":"营销系统工程","Paid Ad & Performance Marketing":"付费广告与效果营销","Reporting & Analytics Design":"报告与分析设计","RevOps Audit":"RevOps 审计","RevOps as a Service":"RevOps 即服务","Revenue Process & Workflow Design":"收入流程与工作流设计","Sales Enablement & Training":"销售赋能与培训","Sales Hub Implementation":"Sales Hub 实施","Sales Onboarding & Training":"销售入职与培训","Service Hub Implementation":"Service Hub 实施","Smart CRM Implementation":"Smart CRM 实施"},"pkg":{"PKG-001":["GTM 转型","面向需要精准定位 ICP、重塑定位，并让销售、营销和 RevOps 围绕统一 GTM 模式协同的企业，进行全面的市场进入改造。涵盖全漏斗诊断、战略制定和 HubSpot 实施。"],"PKG-002":["Smart CRM 实施","结构化的 HubSpot CRM 搭建，聚焦数据架构、销售流程自动化和报告。适用于从旧 CRM 迁移或清理混乱 HubSpot 实例的企业。交付成果是一个销售团队真正会使用的 CRM。"],"PKG-003":["需求生成体系搭建","在 HubSpot 中搭建完整的需求生成引擎：Marketing Hub 设置、营销活动架构、线索管理、培育自动化和归因报告。让 HubSpot 从联系人数据库转变为主动产生销售管道的引擎。"],"PKG-004":["销售绩效转型","重新设计销售流程，搭建配套的 HubSpot 基础设施，并让团队能够稳定执行。结合流程设计、CRM 配置、销售效率工具和辅导体系。"],"PKG-005":["RevOps 基础","在销售、营销和客户成功之间建立 RevOps 运营模式。涵盖漏斗定义、交接设计、KPI 框架，以及在同一系统中运行并报告完整客户生命周期的 HubSpot 基础设施。"],"PKG-006":["AI 驱动的收入加速","识别收入团队中高价值的 AI 用例，在 HubSpot 中设计并构建 AI 工作流和智能体，并让团队在日常 GTM 工作中运用 AI。覆盖从 AI 机会发现到部署和采用的全过程。"],"PKG-007":["内容与 SEO 增长引擎","搭建产生持续复利自然流量管道所需的内容运营和 SEO 基础设施。涵盖 SEO/AEO 战略、网站搭建、内容运营，以及用于规模化发布、追踪和优化的 HubSpot Content Hub 配置。"],"PKG-008":["Salesforce → HubSpot 迁移","从 Salesforce（通常还包括 Pardot 或 Marketing Cloud）到 HubSpot 的结构化迁移，涵盖数据模型转换、记录迁移、集成重新映射和销售流程重建。为客户留下团队信任的干净 HubSpot 实例，以及确保真正落地的变革管理计划。"],"PKG-009":["HubSpot 救援与优化","对已变得混乱、不一致或使用不足的现有 HubSpot 实例进行结构化清理和优化。涵盖数据模型重新设计、工作流精简、报告全面改造和再赋能。无需从头开始，即可交付团队引以为傲并真正使用的 HubSpot 实例。"],"PKG-010":["客户生命周期与留存计划","在 HubSpot 中搭建客户成功与留存基础设施，涵盖 Service Hub 设置、售后生命周期阶段设计、客户成功自动化、健康评分、反馈闭环，以及从销售到客户成功的交接。让 HubSpot 从销售工具转变为推动留存和扩展的完整客户生命周期平台。"],"PKG-011":["外呼销售引擎","在 HubSpot 中设计并搭建系统化的外呼销售模式，涵盖 ICP 定位、基于信号的潜客开发、序列基础设施、AI 驱动的潜客开发智能体，以及管理和报告外呼管道的 CRM 配置。为客户留下可复制、数据驱动的外呼体系，而不只是一个序列库。"],"PKG-012":["数据基础与就绪","在 HubSpot 中建立干净、治理良好的数据基础，涵盖数据模型设计、记录清理与迁移、数据丰富管道搭建、Data Hub 配置，以及让 CRM 数据可信可用的报告基础设施。是 AI 采用、可靠预测和高管级报告的前提项目。"],"PKG-013":["Loop Marketing 启动","在 HubSpot 中搭建完整的 Loop Marketing 体系，从品牌识别编码和营销活动战略，到信号捕获与个性化基础设施、AI 内容生产系统和 Loop 分析层。交付的不只是营销设置，而是持续优化的营销引擎，并在项目中完成首个完整 Loop 周期。"]}},"th":{"mod":{"MOD-001":["การตรวจสอบกลยุทธ์ตลาดและ ICP","ประเมินกลยุทธ์การเลือกตลาดเป้าหมาย คำจำกัดความ ICP และแนวทางการแบ่งกลุ่มของลูกค้าในปัจจุบัน เพื่อหาจุดที่ไม่สอดคล้อง กลุ่มที่ยังไม่ได้เจาะ และโอกาสในการโฟกัสให้คมขึ้น ตรวจว่าธุรกิจกำลังตามหาลูกค้าที่ถูกต้องด้วยวิธีที่ถูกต้อง และ ICP อ้างอิงข้อมูลลูกค้าจริงที่พิสูจน์ด้วยผลลัพธ์ ไม่ใช่การคาดเดา"],"MOD-002":["การตรวจสอบการวางตำแหน่ง ข้อความ และข้อเสนอ","ประเมินความชัดเจน ความแตกต่าง และการเข้าถึงตลาดของการวางตำแหน่ง ข้อความ และโครงสร้างข้อเสนอ ตรวจว่าคุณค่าที่นำเสนอน่าสนใจและแตกต่าง ข้อความสอดคล้องกันทุกช่องทางและทุกทีม และข้อเสนอมีโครงสร้างที่เปลี่ยนผู้ซื้อที่ใช่ในระดับราคาที่เหมาะสม"],"MOD-003":["การตรวจสอบการสร้างความต้องการและโมเดลการเติบโต","ประเมินประสิทธิภาพการสร้างไปป์ไลน์ของธุรกิจในทุกช่องทาง แคมเปญ และการลงทุน มองโมเดลการสร้างความต้องการอย่างรอบด้าน ตั้งแต่สัดส่วนช่องทางและการจัดสรรงบ ไปจนถึงผลงานแคมเปญและการมีส่วนต่อไปป์ไลน์ เพื่อหาว่าส่วนใดได้ผล ส่วนใดต่ำกว่าเป้า และโอกาสปรับปรุงใดคุ้มค่าที่สุด"],"MOD-004":["การตรวจสอบการแปลงฟันเนลและวงจรชีวิต","ประเมินว่าลีดและผู้ติดต่อเคลื่อนผ่านขั้นตอนวงจรชีวิตตั้งแต่ได้มาจนปิดการขายได้มีประสิทธิภาพเพียงใด หาช่องว่างการแปลง จุดรั่วไหล ปัญหาความเร็ว และคำจำกัดความขั้นตอนที่ไม่สอดคล้อง ครอบคลุมช่วงก่อนเป็นลูกค้าตั้งแต่ต้นฟันเนลผ่าน MQL, SQL จนถึงปิดการขาย แตกต่างจากการตรวจสอบวงจรชีวิตลูกค้าและโมเดลการเติบโต เพราะเน้นเส้นทางการได้มาและการแปลง ไม่ใช่ประสบการณ์หลังเป็นลูกค้า"],"MOD-005":["การตรวจสอบกระบวนการขายและการบริหารไปป์ไลน์","ประเมินประสิทธิภาพการดำเนินกระบวนการขาย วินัยในการบริหารไปป์ไลน์ และการเดินหน้าดีล เน้นสิ่งที่เกิดขึ้นหลังโอกาสเข้าสู่ไปป์ไลน์ ทั้งการบริหารดีล การรักษาสุขภาพไปป์ไลน์ ความแม่นยำของการคาดการณ์ และช่องว่างที่ทำให้ดีลเลื่อนหรือรายได้หลุด แตกต่างจากการตรวจสอบการแปลงฟันเนล เพราะครอบคลุมการขายภายในไปป์ไลน์"],"MOD-006":["การตรวจสอบวงจรชีวิตลูกค้าและโมเดลการเติบโต","ประเมินว่าธุรกิจมีโครงสร้างในการรักษาและขยายลูกค้าหลังการได้มาอย่างไร ตรวจประสิทธิภาพเชิงกลยุทธ์ของโมเดลวงจรชีวิตลูกค้า การขยายธุรกิจ และตัวขับเคลื่อนการเติบโตหลังการขาย ครอบคลุมการเริ่มต้นใช้งาน สุขภาพการรักษาลูกค้า การคว้าโอกาสขยาย และโมเดลการเพิ่มรายได้จากลูกค้าเดิม เริ่มต้นจากจุดที่ฟันเนลการได้มาจบลง"],"MOD-007":["การตรวจสอบความสอดคล้องของ RevOps","ประเมินว่าการตั้งค่า CRM โครงสร้างข้อมูล การเชื่อมต่อ และระบบรายงานสอดคล้องและสนับสนุนกลยุทธ์ GTM และเป้าหมายธุรกิจเพียงใด เป็นการทบทวนความสอดคล้องเชิงกลยุทธ์ ไม่ใช่การตรวจสุขภาพระบบทางเทคนิค โดยดูว่าเทคโนโลยีด้านรายได้ช่วยให้ตัดสินใจถูก แสดงข้อมูลที่ถูก และรองรับวิธีเข้าสู่ตลาดของธุรกิจหรือไม่"],"MOD-008":["การตรวจสอบกรอบ KPI และการบริหารผลงาน","ประเมินกรอบ KPI ระบบการวัดผล และโครงสร้างรายงานผลงานในปัจจุบัน ว่ากำลังติดตามตัวชี้วัดที่ถูกต้อง นิยามตรงกันทุกทีม และรายงานให้ผู้บริหารเห็นภาพเพียงพอต่อการตัดสินใจหรือไม่ ระบุช่องว่างการวัดผล ตัวชี้วัดที่ไม่ตรงกันระหว่างทีม และจุดบอดของรายงาน"],"MOD-009":["การตรวจสอบการออกแบบองค์กรและความสอดคล้องด้าน GTM","ประเมินโครงสร้างองค์กรด้าน GTM คำจำกัดความบทบาท และความสอดคล้องข้ามฝ่ายระหว่างการตลาด การขาย และ Customer Success ตรวจว่าองค์กรมีโครงสร้างที่ดำเนินกลยุทธ์ GTM ได้ดีหรือไม่ พร้อมหาช่องว่างความรับผิดชอบ บทบาทที่คลุมเครือ และความไม่มีประสิทธิภาพเชิงโครงสร้าง"],"MOD-010":["การระบุและประเมินโอกาสด้าน AI","ระบุและประเมินกรณีการใช้ AI ที่เป็นไปได้ทั่วทั้งธุรกิจ โดยวิเคราะห์เวิร์กโฟลว์ กระบวนการ และข้อมูล เพื่อหาโอกาสด้านระบบอัตโนมัติ การเสริมศักยภาพ และประสิทธิภาพ ให้ภาพทิศทางว่า AI สร้างคุณค่าได้ที่ใดและแต่ละโอกาสเป็นไปได้มากน้อยเพียงใด"],"MOD-011":["การประเมินความพร้อมของข้อมูลสำหรับ AI","ประเมินว่ารากฐานข้อมูลขององค์กรรองรับกรณีการใช้ AI ได้หรือไม่ ทั้งคุณภาพ โครงสร้าง การเข้าถึง และความครบถ้วน"],"MOD-012":["การประเมินเครื่องมือและแพลตฟอร์ม AI","ประเมินเครื่องมือ AI และเทคโนโลยีปัจจุบันเพื่อหาช่องว่างความสามารถ ความซ้ำซ้อน และความพร้อมในการรองรับกรณีการใช้ AI"],"MOD-013":["การประเมินธรรมาภิบาลและความเสี่ยงด้าน AI","ประเมินความพร้อมในการใช้ AI อย่างรับผิดชอบ โดยดูโครงสร้างธรรมาภิบาล การบริหารความเสี่ยง และประเด็นด้านการปฏิบัติตามกฎเกณฑ์"],"MOD-014":["การประเมินความพร้อมขององค์กรด้าน AI","ประเมินความพร้อมด้านบุคลากร ทักษะ และวัฒนธรรมขององค์กรในการนำ AI มาใช้และขยายผลอย่างมีประสิทธิภาพ"],"MOD-015":["การประเมินความสอดคล้องและการสนับสนุนของผู้นำ","ประเมินความสอดคล้องของผู้บริหาร ความแข็งแรงของการสนับสนุน และความพร้อมของผู้นำในการขับเคลื่อนและรักษาการเปลี่ยนแปลง"],"MOD-016":["การประเมินบทบาท กระบวนการ และความรับผิดชอบ","ประเมินความชัดเจนของบทบาท หน้าที่ และกระบวนการ เพื่อให้มีความรับผิดชอบชัดเจนและลดความติดขัดระหว่างการเปลี่ยนแปลง"],"MOD-017":["การประเมินผู้มีส่วนได้ส่วนเสียและความพร้อมในการนำไปใช้","ประเมินการรับรู้ การยอมรับ และความพร้อมของผู้มีส่วนได้ส่วนเสียต่อวิธีทำงานใหม่ รวมถึงความเสี่ยงจากการต่อต้านและความเหนื่อยล้าจากการเปลี่ยนแปลง"],"MOD-018":["การประเมินการสื่อสารและการเสริมศักยภาพเพื่อการเปลี่ยนแปลง","ประเมินประสิทธิภาพของกลยุทธ์การสื่อสารและโครงสร้างการเสริมศักยภาพที่จำเป็นต่อการนำการเปลี่ยนแปลงไปใช้ให้สำเร็จ"],"MOD-019":["การประเมินสุขภาพระบบและอินสแตนซ์","ประเมินสุขภาพโดยรวม การตั้งค่า และธรรมาภิบาลของ CRM เพื่อหาความไม่มีประสิทธิภาพ การตั้งค่าผิด หนี้ทางเทคนิค และช่องว่างธรรมาภิบาล เป็นการทบทวนการปฏิบัติการในวงกว้าง ไม่ได้ลงลึกเรื่องโมเดลข้อมูล คุณภาพข้อมูล หรือการเชื่อมต่อ ซึ่งมีการประเมินแยก ให้ภาพที่จัดลำดับความสำคัญแล้วว่าส่วนใดดีและส่วนใดต้องแก้ก่อนลงทุนเพิ่ม"],"MOD-020":["การประเมินโมเดลข้อมูลและสถาปัตยกรรม CRM","ประเมินโครงสร้างและการออกแบบโมเดลข้อมูล HubSpot CRM ว่ารองรับรายงาน ระบบอัตโนมัติ และกระบวนการธุรกิจที่ขยายได้หรือไม่ ตรวจสถาปัตยกรรมของออบเจ็กต์ พร็อพเพอร์ตี ความสัมพันธ์ และไปป์ไลน์ เพื่อหาช่องว่างเชิงโครงสร้าง ข้อจำกัดการออกแบบ และจุดที่ไม่ตรงกับกระบวนการธุรกิจจริง"],"MOD-021":["การประเมินคุณภาพและความถูกต้องของข้อมูล","ประเมินความครบถ้วน ความถูกต้อง ความสม่ำเสมอ และความน่าเชื่อถือของข้อมูล CRM ว่ารองรับรายงาน ระบบอัตโนมัติ และการตัดสินใจได้หรือไม่ ประเมินสุขภาพของตัวข้อมูล ไม่ใช่โครงสร้างโมเดล เพื่อหาเรคคอร์ดที่ไม่ครบ ไม่ถูกต้อง ซ้ำ หรือรูปแบบไม่สม่ำเสมอ ซึ่งลดคุณค่าของ CRM ในฐานะแหล่งข้อมูลจริง"],"MOD-022":["การประเมินการเชื่อมต่อและการไหลของข้อมูล","ประเมินการเชื่อมต่อระบบ การซิงก์ข้อมูล และความน่าเชื่อถือของการไหลของข้อมูลทั่วทั้งระบบเทคโนโลยี เพื่อหาความเสี่ยง ความไม่มีประสิทธิภาพ และช่องว่าง"],"MOD-023":["การสำรวจผู้มีส่วนได้ส่วนเสีย บทบาท และกระบวนการ","สำรวจสถานะปัจจุบันของบทบาท หน้าที่ และกระบวนการ GTM ผ่านการสัมภาษณ์ผู้มีส่วนได้ส่วนเสียอย่างเป็นระบบ ให้ภาพชัดว่าใครรับผิดชอบอะไร งานในฝ่ายการตลาด การขาย และ Customer Success ทำกันจริงอย่างไร และกระบวนการใดมีนิยามชัดหรือทำแบบไม่เป็นทางการ เป็นรากฐานสำหรับการแมปเวิร์กโฟลว์และการปรับปรุงต่อไป บันทึกความเป็นจริงในการทำงาน ไม่ใช่ประเมินการออกแบบโครงสร้างองค์กร"],"MOD-024":["การแมปเวิร์กโฟลว์และวิเคราะห์การส่งต่องาน","บันทึกและวิเคราะห์เวิร์กโฟลว์ตั้งแต่ต้นจนจบระหว่างฝ่ายการตลาด การขาย และ Customer Success โดยเน้นจุดส่งต่องานที่มักเกิดความติดขัด การสื่อสารผิดพลาด และกระบวนการสะดุด แปลงผลการสำรวจเป็นแผนผังเวิร์กโฟลว์ที่แสดงความต่างระหว่างการทำงานจริงกับที่ตั้งใจ และหาจุดส่งต่องานที่สร้างปัญหาตามมา"],"MOD-025":["การประเมินความสอดคล้องระหว่างกระบวนการและระบบ","ประเมินว่ากระบวนการ GTM ที่กำหนดไว้ถูกสะท้อน ตั้งค่า และรองรับในระบบเทคโนโลยี โดยเฉพาะ HubSpot ดีเพียงใด หาจุดที่ระบบรองรับกระบวนการได้ถูกต้อง จุดที่สร้างความติดขัดหรือต้องหาทางเลี่ยง และจุดที่ทำงานนอกระบบทั้งหมด ประเมินในระดับการปฏิบัติงาน ไม่ใช่ความสอดคล้องเชิงกลยุทธ์"],"MOD-026":["การประเมินฟันเนล SLA และจังหวะการทำงาน","ประเมินชั้นการปฏิบัติการและธรรมาภิบาลของฟันเนล GTM ว่า SLA กำหนดชัดเจน บังคับใช้สม่ำเสมอ และวัดผลได้หรือไม่ และจังหวะการทำงานของฝ่ายการตลาด การขาย และ CS ให้การมองเห็นและความรับผิดชอบเพียงพอหรือไม่ เน้นธรรมาภิบาลของกระบวนการ ไม่ใช่ข้อมูลผลงานฟันเนล"],"MOD-027":["การตรวจสอบเส้นทางลูกค้า","แมปเส้นทางลูกค้าตั้งแต่ต้นจนจบเพื่อหาช่องว่าง ความไม่สม่ำเสมอ และความติดขัดในแต่ละจุดสัมผัส"],"MOD-028":["การตรวจสอบประสบการณ์การแปลง","ประเมินประสบการณ์ผู้ใช้ ความชัดเจนของข้อความ และความติดขัดในจุดแปลง (เว็บไซต์ ฟอร์ม แลนดิ้งเพจ และ CTA) เพื่อหาว่าผู้มุ่งหวังหลุดหรือหมดความสนใจที่ใด"],"MOD-029":["การตรวจสอบประสบการณ์การขายและการส่งต่องาน","ประเมินประสบการณ์ของผู้ซื้อ ไม่ใช่การทำงานของฝ่ายขาย ระหว่างการติดต่อขายและการส่งต่องานระหว่างทีม ดูว่าผู้มุ่งหวังรู้สึกอย่างไรและพบอะไรในแต่ละขั้นตอน"],"MOD-030":["การตรวจสอบการเริ่มต้นใช้งานและประสบการณ์ลูกค้า","ประเมินประสบการณ์การเริ่มต้นใช้งาน เวลาที่ลูกค้าเห็นคุณค่า และการติดต่อช่วงแรกหลังการขาย เพื่อหาความติดขัด ช่องว่าง และความเสี่ยงที่ลูกค้าจะเลิกใช้ในช่วงแรกที่สำคัญ"],"MOD-031":["การตรวจสอบประสบการณ์การรักษาและขยายลูกค้า","ประเมินสิ่งที่ลูกค้าพบจริงระหว่างการรักษาและขยายธุรกิจ ซึ่งต่างจากการออกแบบโครงสร้างเพื่อการเติบโต โดยดูคุณภาพการมีส่วนร่วม จุดสัมผัสการขยาย และประสบการณ์การได้รับคุณค่าอย่างต่อเนื่อง"],"MOD-032":["การตรวจสอบงานบริการและบริการตนเอง","ประเมินประสบการณ์ลูกค้าในการติดต่อขอความช่วยเหลือและการใช้แหล่งข้อมูลบริการตนเอง ดูว่าลูกค้าได้รับความช่วยเหลืออย่างไร ปัญหาแก้ไขได้ดีเพียงใด และช่องทางบริการตนเองช่วยลดความติดขัดแล พื่อให้ครอบคลุมการขายอย่างมีประสิทธิภาพ"],"MOD-087":["การตั้งค่า Commerce Hub และการชำระเงิน","ตั้งค่าพื้นฐานของ Commerce Hub โครงสร้างการชำระเงิน และความสามารถด้านการค้าระดับระบบ"],"MOD-088":["การติดตั้งคลังสินค้าและโครงสร้างราคา","ติดตั้งแคตตาล็อกสินค้าและโครงสร้างราคาที่จำเป็นต่อการเสนอราคา การเรียกเก็บเงิน และรายงาน"],"MOD-089":["การติดตั้ง CPQ (การตั้งค่าและอัตโนมัติใบเสนอราคา)","ติดตั้งการสร้างใบเสนอราคา ตรรกะราคา และเวิร์กโฟลว์อนุมัติ เพื่อให้เสนอราคาได้รวดเร็วและแม่นยำ"],"MOD-090":["การติดตั้งการจัดการสมาชิกและการเรียกเก็บเงิน","ติดตั้งการจัดการวงจรชีวิตการสมัครสมาชิก ตรรกะการเรียกเก็บเงิน และกระบวนการรายได้ประจำ"],"MOD-091":["การติดตั้งการชำระเงิน เช็กเอาต์ และการเก็บรายได้","ติดตั้งประสบการณ์เช็กเอาต์และเวิร์กโฟลว์เก็บเงิน เพื่อให้ธุรกรรมของลูกค้าราบรื่น"],"MOD-092":["ระบบอัตโนมัติวงจรรายได้และการเชื่อมต่อระบบการเงิน","ติดตั้งระบบอัตโนมัติวงจรรายได้แบบครบวงจรและเชื่อมต่อระบบการเงิน เพื่อให้การดำเนินงานถูกต้องและขยายได้"],"MOD-093":["การติดตั้งรายงานรายได้ การปฏิบัติตามกฎเกณฑ์ และธรรมาภิบาล","ติดตั้งรายงานรายได้ การมองเห็นด้านการเงิน และกรอบธรรมาภิบาล เพื่อรองรับการปฏิบัติตามกฎเกณฑ์และการตัดสินใจ"],"MOD-094":["การตั้งค่า Service Hub","ตั้งค่าพื้นฐานของ Service Hub และช่องทางสื่อสารกับลูกค้าสำหรับงานบริการ"],"MOD-095":["การติดตั้งไปป์ไลน์ทิกเก็ตและ SLA","ติดตั้งไปป์ไลน์ทิกเก็ต SLA และเวิร์กโฟลว์บริการหลัก เพื่อจัดการคำขอความช่วยเหลือของลูกค้า"],"MOD-096":["การติดตั้งการกำหนดเส้นทาง ระบบอัตโนมัติ และการปฏิบัติการบริการ","ติดตั้งตรรกะการกำหนดเส้นทางและระบบอัตโนมัติ เพื่อมอบหมายทิกเก็ตอย่างมีประสิทธิภาพ บริหารปริมาณงาน และส่งเสริมการทำงานร่วมกัน"],"MOD-097":["การติดตั้งพื้นที่ทำงาน Help Desk และประสิทธิภาพเจ้าหน้าที่","ตั้งค่าพื้นที่ทำงาน Help Desk และเครื่องมือเจ้าหน้าที่ เพื่อเพิ่มประสิทธิภาพ การมองเห็น และผลงาน"],"MOD-098":["การติดตั้งบริการตนเอง ฐานความรู้ และพอร์ทัลลูกค้า","ติดตั้งประสบการณ์บริการตนเองเพื่อลดภาระงานบริการและให้ลูกค้าเข้าถึงข้อมูลได้ง่ายขึ้น"],"MOD-099":["การติดตั้งระบบ Customer Success และฟีดแบ็ก","ติดตั้งเวิร์กโฟลว์ Customer Success คะแนนสุขภาพลูกค้า และระบบรับฟีดแบ็ก เพื่อเพิ่มการรักษาลูกค้าและความพึงพอใจ"],"MOD-100":["การตั้งค่าและใช้งาน Customer Agent","ติดตั้งเอเจนต์บริการลูกค้าที่ขับเคลื่อนด้วย AI เพื่อตอบคำถาม ช่วยเหลือผู้ใช้ และส่งต่อให้เจ้าหน้าที่เมื่อจำเป็น"],"MOD-101":["การติดตั้งรายงานและการวิเคราะห์งานบริการ","สร้างระบบรายงานเพื่อแสดงผลงานงานบริการ ความพึงพอใจของลูกค้า และประสิทธิภาพการดำเนินงาน"],"MOD-102":["การตั้งค่า Data Hub","วางโครงสร้างพื้นฐาน Data Hub และสถาปัตยกรรมชุดข้อมูลที่รองรับการจัดการข้อมูล รายงาน และความสามารถด้าน AI ทั้งหมด ครอบคลุมการตั้งค่า Data Hub เริ่มต้น การออกแบบและสร้างชุดข้อมูล การจัดแนวโมเดลข้อมูล และการตัดสินใจเชิงโครงสร้างที่กำหนดว่าข้อมูลไหลและถูกเรียกใช้ใน HubSpot อย่างไร"],"MOD-103":["การติดตั้งการเชื่อมต่อและซิงก์ข้อมูล","ติดตั้งการซิงก์ข้อมูลแบบสองทางและทางเดียวระหว่าง HubSpot กับระบบภายนอกด้วยโครงสร้างซิงก์ของ Data Hub ตั้งค่าการแมปฟิลด์ ตรรกะการซิงก์ กฎแก้ข้อขัดแย้ง และการแปลงข้อมูล เพื่อให้ข้อมูลไหลระหว่าง HubSpot กับระบบอื่นของลูกค้าอย่างสะอาดและน่าเชื่อถือ"],"MOD-104":["การติดตั้งคุณภาพข้อมูล การเสริมข้อมูล และข้อมูลความสนใจซื้อ","ติดตั้งความสามารถด้านคุณภาพข้อมูล การเสริมข้อมูล และข้อมูลความสนใจซื้อของ HubSpot ภายใน Data Hub ตั้งค่าระบบอัตโนมัติด้านคุณภาพข้อมูลให้เรคคอร์ดสะอาดและสม่ำเสมอ ตั้งค่า HubSpot Data Enrichment เพื่อเติมข้อมูลผู้ติดต่อและบริษัทอัตโนมัติ และเปิดใช้ Buyer Intent เพื่อแสดงบัญชีที่มีสัญญาณการซื้อ เป็นส่วนหนึ่งของการสร้าง Data Hub เริ่มต้น โดยตั้งค่าเครื่องมือเนทีฟของ HubSpot ไม่ใช่การออกแบบระบบสัญญาณแบบกำหนดเอง"],"MOD-105":["การสร้างโมเดลข้อมูล การคำนวณ และการจัดแนวรายได้","ออกแบบและติดตั้งโมเดลข้อมูล พร็อพเพอร์ตีคำนวณ และโครงสร้างข้อมูลรายได้ที่ขับเคลื่อนข้อมูลเชิงธุรกิจและรายงานที่แม่นยำใน HubSpot แปลงโมเดลรายได้และตรรกะธุรกิจของลูกค้าเป็นชั้นข้อมูลของ HubSpot ให้ตัวชี้วัดสำคัญ (ไปป์ไลน์ รายได้ การรักษาลูกค้า LTV การเลิกใช้) คำนวณถูกต้อง นิยามสม่ำเสมอ และใช้ได้ในทุกรายงานและแดชบอร์ด"],"MOD-106":["การติดตั้งระบบอัตโนมัติ เวิร์กโฟลว์ และตรรกะแบบเขียนโปรแกรม","ติดตั้งความสามารถอัตโนมัติขั้นสูงของ Data Hub ได้แก่ เวิร์กโฟลว์แบบเขียนโปรแกรม custom coded actions และตรรกะตามเหตุการณ์ เพื่อทำให้กระบวนการธุรกิจซับซ้อนเป็นอัตโนมัติเกินกว่าเวิร์กโฟลว์มาตรฐานของ HubSpot เป็นส่วนหนึ่งของการสร้าง Data Hub เริ่มต้น ไม่ใช่งานวิศวกรรมแยกต่างหาก"],"MOD-107":["การนำข้อมูลไปใช้ เอเจนต์ AI และข้อมูลเชิงลึกข้าม Hub","ติดตั้งกลยุทธ์การนำข้อมูลไปใช้ เอเจนต์ข้อมูล AI และข้อมูลเชิงลึกข้าม Hub เพื่อให้ข้อมูลทำงานได้ทั้งในการตลาด การขาย และงานบริการ"],"MOD-108":["การติดตั้งธรรมาภิบาลข้อมูล การติดตาม และรายงาน","ติดตั้งกรอบธรรมาภิบาล ระบบติดตาม และโครงสร้างรายงาน เพื่อให้ Data Hub ทำงานอย่างน่าเชื่อถือ สม่ำเสมอ และผู้เกี่ยวข้องเห็นสุขภาพข้อมูลครบถ้วน ครอบคลุมการบังคับใช้นโยบายธรรมาภิบาลข้อมูล การตั้งค่าการติดตาม และชั้นรายงานที่ทำให้ผู้บริหารและทีมปฏิบัติการมั่นใจในข้อมูลที่ใช้ตัดสินใจ"],"MOD-109":["การพัฒนาผู้ช่วย AI แบบกำหนดเอง (อิง LLM)","ออกแบบและสร้างผู้ช่วย AI แบบกำหนดเองด้วยโมเดลภาษาขนาดใหญ่ (เช่น GPT, Claude, Gemini) สำหรับกรณีการใช้ทางธุรกิจเฉพาะ"],"MOD-110":["การพัฒนาเอเจนต์ AI แบบกำหนดเอง","ออกแบบและสร้างเอเจนต์ AI ที่ทำงานหลายขั้นตอนได้เอง ใช้เครื่องมือ ตัดสินใจ และทำเวิร์กโฟลว์ให้เสร็จภายในขอบเขตที่กำหนด ก้าวข้ามผู้ช่วย AI แบบสนทนาไปสู่ระบบที่ลงมือทำได้ เช่น ค้นข้อมูล เรียก API สั่งงานเวิร์กโฟลว์ HubSpot และทำงานซับซ้อนโดยแทบไม่ต้องมีคนเข้าไปช่วย เหมาะกับกรณีที่ระบบอัตโนมัติแบบเดิมไม่พอและต้องตัดสินใจอย่างชาญฉลาดขณะทำงาน"],"MOD-111":["การติดตั้งระบบหลายเอเจนต์และการประสานงาน","ออกแบบและติดตั้งระบบหลายเอเจนต์ที่เอเจนต์ AI เฉพาะทางทำงานประสานกันเพื่อทำเวิร์กโฟลว์ซับซ้อนหลายขั้นตอนเกินกว่าที่เอเจนต์เดียวทำได้ ออกแบบเครือข่ายเอเจนต์ทั้งหมด กำหนดบทบาท โปรโตคอลการสื่อสาร ตรรกะการประสานงาน และกลไกการส่งต่องาน เพื่อสร้างระบบ AI ที่เชื่อถือได้และขยายได้"],"MOD-112":["การพัฒนา HubSpot Breeze Assistant","ออกแบบและตั้งค่า Breeze Assistant ใน HubSpot ให้เหมาะกับเวิร์กโฟลว์ น้ำเสียงแบรนด์ และความต้องการของลูกค้า ครอบคลุมการตั้งค่าพรอมต์ ผู้ช่วยด้านเนื้อหา การเชื่อมข้อมูล CRM เพื่อคำตอบที่ตรงบริบท และการเชื่อมกับเวิร์กโฟลว์ มอบประสบการณ์ AI ในตัว HubSpot ที่ปรับตามการทำงานจริงของทีม โดยไม่ต้องพัฒนาแอปนอกแพลตฟอร์ม"], ้เป็นความได้เปรียบในการเติบโต"],"MOD-119":["การพัฒนา API และ Webhook แบบกำหนดเอง","ออกแบบและสร้างการเชื่อมต่อแบบกำหนดเองระหว่าง HubSpot กับระบบภายนอกด้วย API, webhook และมิดเดิลแวร์เฉพาะ เมื่อเครื่องมือมาตรฐานไม่ตอบโจทย์ แก้ปัญหาการซิงก์ข้อมูลซับซ้อน ทริกเกอร์เวิร์กโฟลว์ขั้นสูง และการทำงานร่วมกันระหว่างระบบที่ต้องพัฒนาเองแทนการตั้งค่า"],"MOD-120":["การติดตั้งไปป์ไลน์จับสัญญาณและเสริมข้อมูล","สร้างโครงสร้างทางเทคนิคเพื่อจับสัญญาณพฤติกรรมจากเว็บ อีเมล และเนื้อหา เสริมข้อมูลผู้ติดต่อและบริษัทจากแหล่งข้อมูลภายนอก และใช้พร็อพเพอร์ตีที่เสริมแล้วเป็นกลุ่มแบบไดนามิกและโทเคนปรับเฉพาะบุคคล เป็นรากฐานข้อมูลที่ทำให้ Loop Marketing แบบเฉพาะบุคคลสูงเป็นไปได้ในวงกว้าง"],"MOD-121":["การสร้างสถาปัตยกรรมระบบการตลาดอัตโนมัติและการปฏิบัติการ Loop","ติดตั้งแกนหลักระบบอัตโนมัติที่ทำให้ Loop Marketing ทำงานต่อเนื่อง สร้างตรรกะทริกเกอร์ เวิร์กโฟลว์ส่งเนื้อหา การแตกสายการบ่มเพาะลีด และการประสานขั้นตอนที่เชื่อม Express, Tailor, Amplify และ Evolve แบบอัตโนมัติ ให้แต่ละรอบ Loop ทำงานโดยใช้แรงคนน้อยที่สุดและพัฒนาขึ้นเรื่อย ๆ"],"MOD-122":["การสร้างระบบผลิตเนื้อหาด้วย AI","ออกแบบและสร้างโครงสร้างสำหรับการผลิตเนื้อหาด้วย AI ในวงกว้าง ซึ่งเป็นเครื่องยนต์ของขั้น Tailor ใน Loop Marketing ส่งมอบคลังพรอมต์ เทมเพลตบรีฟ เวิร์กโฟลว์ AI ตามรูปแบบเนื้อหา และกระบวนการตรวจทาน เพื่อให้ทีมผลิตเนื้อหาคุณภาพสูงที่ปรับเฉพาะบุคคลได้สม่ำเสมอและเร็วขึ้นในทุกช่องทาง"],"MOD-123":["การติดตั้งเครื่องยนต์ปรับเฉพาะบุคคลและ Smart Content","ติดตั้งความสามารถปรับเฉพาะบุคคลขั้นสูงที่มอบประสบการณ์แบบไดนามิกในอีเมลและเว็บ ด้วยข้อมูลผู้ติดต่อที่เสริมแล้ว สัญญาณพฤติกรรม และพร็อพเพอร์ตี CRM ก้าวข้ามการแบ่งกลุ่มพื้นฐานไปสู่เครื่องยนต์ปรับเฉพาะบุคคลจริง ได้แก่ กฎ smart content กรอบโทเคนไดนามิก และการกำหนดเส้นทางผู้ชมตามพฤติกรรม ให้ทุกจุดสัมผัสตรงกับแต่ละคน"],"MOD-124":["การสร้างระบบวิเคราะห์และข้อมูลเชิงลึก Loop","ติดตั้งชั้น Evolve ของ Loop Marketing ได้แก่ การวิเคราะห์ การเก็บบทเรียน และโครงสร้างข้อมูลเชิงลึกที่เปลี่ยนข้อมูลแคมเปญเป็นข้อสรุปสำหรับรอบ Loop ถัดไป สร้างระบบรายงาน การติดตามผลงานเนื้อหา โมเดลการระบุที่มา และกรอบการทบทวน "Reporting & Analytics Design":"การออกแบบรายงานและการวิเคราะห์","RevOps Audit":"การตรวจสอบ RevOps","RevOps as a Service":"RevOps แบบบริการ","Revenue Process & Workflow Design":"การออกแบบกระบวนการและเวิร์กโฟลว์ด้านรายได้","Sales Enablement & Training":"การเสริมศักยภาพและฝึกอบรมฝ่ายขาย","Sales Hub Implementation":"การติดตั้ง Sales Hub","Sales Onboarding & Training":"การปฐมนิเทศและฝึกอบรมฝ่ายขาย","Service Hub Implementation":"การติดตั้ง Service Hub","Smart CRM Implementation":"การติดตั้ง Smart CRM"},"pkg":{"PKG-001":["การปรับเปลี่ยน GTM","การยกเครื่องกลยุทธ์การเข้าสู่ตลาดอย่างครบวงจร สำหรับบริษัทที่ต้องกำหนด ICP ให้คมชัดขึ้น สร้างการวางตำแหน่งใหม่ และทำให้ฝ่ายขาย การตลาด และ RevOps ทำงานไปในทิศทาง GTM เดียวกัน ครอบคลุมการวินิจฉัยทั้งฟันเนล การพัฒนากลยุทธ์ และการติดตั้ง HubSpot"],"PKG-002":["การติดตั้ง Smart CRM","การสร้าง HubSpot CRM อย่างเป็นระบบ โดยเน้นสถาปัตยกรรมข้อมูล ระบบอัตโนมัติของกระบวนการขาย และรายงาน เหมาะสำหรับบริษัทที่ย้ายจาก CRM เดิมหรือต้องจัดระเบียบ HubSpot ที่ยุ่งเหยิง ผลลัพธ์คือ CRM ที่ทีมขายใช้งานจริง"],"PKG-003":["การสร้างระบบสร้างความต้องการ","สร้างเครื่องยนต์สร้างความต้องการแบบครบวงจรใน HubSpot ได้แก่ การตั้งค่า Marketing Hub สถาปัตยกรรมแคมเปญ การจัดการลีด ระบบบ่มเพาะลีดอัตโนมัติ และรายงานการระบุที่มา เปลี่ยน HubSpot จากฐานข้อมูลรายชื่อให้เป็นเครื่องสร้างไปป์ไลน์"],"PKG-004":["การปรับเปลี่ยนประสิทธิภาพการขาย","ออกแบบกระบวนการขายใหม่ สร้างโครงสร้าง HubSpot ที่รองรับ และทำให้ทีมปฏิบัติได้อย่างสม่ำเสมอ ผสานการออกแบบกระบวนการ การตั้งค่า CRM เครื่องมือเพิ่มประสิทธิภาพการขาย และระบบโค้ชชิ่ง"],"PKG-005":["รากฐาน RevOps","วางโมเดลการทำงาน RevOps ครอบคลุมฝ่ายขาย การตลาด และ Customer Success ครอบคลุมการกำหนดฟันเนล การออกแบบการส่งต่องาน กรอบ KPI และโครงสร้าง HubSpot เพื่อบริหารและรายงานวงจรชีวิตลูกค้าทั้งหมดในระบบเดียว"],"PKG-006":["การเร่งรายได้ด้วย AI","ค้นหากรณีการใช้ AI ที่มีมูลค่าสูงทั่วทั้งฝ่ายรายได้ ออกแบบและสร้างเวิร์กโฟลว์และเอเจนต์ AI ใน HubSpot และทำให้ทีมใช้ AI ในงาน GTM ประจำวัน ครอบคลุมตั้งแต่การค้นหาโอกาส AI ไปจนถึงการใช้งานจริงและการนำไปใช้"],"PKG-007":["เครื่องยนต์การเติบโตด้านเนื้อหาและ SEO","สร้างการปฏิบัติการด้านเนื้อหาและโครงสร้าง SEO ที่จำเป็นต่อการสร้างไปป์ไลน์ออร์แกนิกที่เติบโตทบต้น ครอบคลุมกลยุทธ์ SEO/AEO การตั้งค่าเว็บไซต์ การปฏิบัติการด้านเนื้อหา และการตั้งค่า HubSpot Content Hub เพื่อเผยแพร่ ติดตาม และปรับปรุงในวงกว้าง"],"PKG-008":["การย้ายจาก Salesforce → HubSpot","การย้ายระบบอย่างเป็นขั้นตอนจาก Salesforce (และมักรวม Pardot หรือ Marketing Cloud) มายัง HubSpot ครอบคลุมการแปลงโมเดลข้อมูล การย้ายเรคคอร์ด การแมปการเชื่อมต่อใหม่ และการสร้างกระบวนการขายใหม่ ลูกค้าจะได้ HubSpot ที่สะอาดและทีมไว้วางใจ พร้อมแผนการจัดการการเปลี่ยนแปลงเพื่อให้มีการใช้งานจริง"],"PKG-009":["การกู้คืนและปรับปรุง HubSpot","การจัดระเบียบและปรับปรุง HubSpot ที่มีอยู่ซึ่งยุ่งเหยิง ไม่สม่ำเสมอ หรือใช้งานไม่เต็มที่ ครอบคลุมการออกแบบโมเดลข้อมูลใหม่ การปรับเวิร์กโฟลว์ให้เหมาะสม การยกเครื่องรายงาน และการฝึกอบรมใหม่ ได้ HubSpot ที่ทีมภูมิใจและใช้งานจริงโดยไม่ต้องเริ่มใหม่ทั้งหมด"],"PKG-010":["โปรแกรมวงจรชีวิตลูกค้าและการรักษาลูกค้า","สร้างโครงสร้าง Customer Success และการรักษาลูกค้าใน HubSpot ครอบคลุมการตั้งค่า Service Hub การออกแบบขั้นตอนวงจรชีวิตหลังการขาย ระบบอัตโนมัติด้าน CS คะแนนสุขภาพลูกค้า วงจรรับฟีดแบ็ก และการส่งต่องานจากฝ่ายขายไปยัง CS เปลี่ยน HubSpot จากเครื่องมือขายเป็นแพลตฟอร์มวงจรชีวิตลูกค้าที่ขับเคลื่อนการรักษาและการขยายธุรกิจ"],"PKG-011":["เครื่องยนต์การขายเชิงรุก","ออกแบบและสร้างการขายเชิงรุกอย่างเป็นระบบใน HubSpot ครอบคลุมการกำหนดเป้าหมาย ICP การหาลูกค้าจากสัญญาณ โครงสร้างซีเควนซ์ เอเจนต์หาลูกค้าด้วย AI และการตั้งค่า CRM เพื่อบริหารและรายงานไปป์ไลน์เชิงรุก ลูกค้าจะได้ระบบเชิงรุกที่ทำซ้ำได้และขับเคลื่อนด้วยข้อมูล ไม่ใช่แค่คลังซีเควนซ์"],"PKG-012":["รากฐานและความพร้อมด้านข้อมูล","วางรากฐานข้อมูลที่สะอาดและมีธรรมาภิบาลใน HubSpot ครอบคลุมการออกแบบโมเดลข้อมูล การทำความสะอาดและย้ายเรคคอร์ด การตั้งค่าไปป์ไลน์เสริมข้อมูล การตั้งค่า Data Hub และโครงสร้างรายงานที่ทำให้ข้อมูล CRM น่าเชื่อถือและนำไปใช้ได้ เป็นงานพื้นฐานก่อนการนำ AI มาใช้ การคาดการณ์ที่จริงจัง และรายงานระดับผู้บริหาร"],"PKG-013":["การเปิดตัว Loop Marketing","สร้างระบบ Loop Marketing แบบครบวงจรใน HubSpot ตั้งแต่การกำหนดอัตลักษณ์แบรนด์และกลยุทธ์แคมเปญ ไปจนถึงโครงสร้างการจับสัญญาณและการปรับเนื้อหาเฉพาะบุคคล ระบบผลิตเนื้อหาด้วย AI และชั้นการวิเคราะห์ Loop ไม่ใช่แค่การตั้งค่าการตลาด แต่เป็นเครื่องยนต์การตลาดที่ปรับปรุงต่อเนื่อง พร้อมรัน Loop รอบแรกเต็มรูปแบบเป็นส่วนหนึ่งของงาน"]}},"vi":{"mod":{"MOD-001":["Đánh giá Chiến lược Thị trường & ICP","Đánh giá chiến lược nhắm thị trường, định nghĩa ICP và cách phân khúc hiện tại của khách hàng để tìm điểm lệch, phân khúc chưa khai thác và cơ hội tập trung rõ hơn. Xác định doanh nghiệp có đang theo đuổi đúng khách hàng bằng đúng cách hay không, và ICP có dựa trên dữ liệu khách hàng thực, được kiểm chứng bằng kết quả thay vì giả định."],"MOD-002":["Đánh giá Định vị, Thông điệp & Gói sản phẩm","Đánh giá độ rõ ràng, sự khác biệt và mức độ cộng hưởng với thị trường của định vị, thông điệp và cấu trúc gói sản phẩm. Xem giá trị đề xuất có hấp dẫn và khác biệt không, thông điệp có nhất quán giữa các kênh và đội ngũ không, và gói sản phẩm có giúp chuyển đổi đúng người mua ở mức giá phù hợp không."],"MOD-003":["Đánh giá Tạo nhu cầu & Mô hình tăng trưởng","Đánh giá hiệu quả tạo pipeline của doanh nghiệp qua các kênh, chiến dịch và khoản đầu tư. Nhìn toàn diện mô hình tạo nhu cầu, từ cơ cấu kênh và phân bổ ngân sách đến hiệu quả chiến dịch và đóng góp pipeline, để xác định phần nào hiệu quả, phần nào kém và cơ hội cải thiện đòn bẩy cao nhất."],"MOD-004":["Đánh giá Chuyển đổi phễu & Vòng đời","Đánh giá mức độ hiệu quả khi lead và liên hệ đi qua các giai đoạn vòng đời từ khi thu hút đến khi chốt doanh thu, tìm khoảng trống chuyển đổi, điểm rò rỉ, vấn đề tốc độ và định nghĩa giai đoạn chưa thống nhất. Bao gồm giai đoạn trước khi thành khách hàng, từ đầu phễu qua MQL, SQL đến chốt deal. Khác với Đánh giá Vòng đời khách hàng, dịch vụ này tập trung vào hành trình thu hút và chuyển đổi."],"MOD-005":["Đánh giá Mô hình bán hàng & Quản lý pipeline","Đánh giá hiệu quả thực thi quy trình bán hàng, kỷ luật quản lý pipeline và cách thúc đẩy deal. Tập trung vào những gì diễn ra sau khi cơ hội vào pipeline: deal được quản lý ra sao, sức khỏe pipeline được duy trì thế nào, độ chính xác dự báo đạt được ra sao và khoảng trống nào gây trễ hoặc mất doanh thu."],"MOD-006":["Đánh giá Vòng đời khách hàng & Mô hình tăng trưởng","Đánh giá cách doanh nghiệp được tổ chức để giữ chân và mở rộng khách hàng sau khi có được họ, xem xét hiệu quả chiến lược của mô hình vòng đời, hoạt động mở rộng và các đòn bẩy tăng trưởng sau bán. Bao gồm hiệu quả onboarding, sức khỏe giữ chân, nắm bắt cơ hội mở rộng và mô hình tăng doanh thu từ khách hàng hiện có. Bắt đầu từ nơi phễu thu hút kết thúc."],"MOD-007":["Đánh giá Mức độ gắn kết RevOps","Đánh giá mức độ cấu hình CRM, hạ tầng dữ liệu, tích hợp và hệ thống báo cáo phù hợp và hỗ trợ chiến lược GTM và mục tiêu kinh doanh. Đây là đánh giá gắn kết chiến lược, không phải đánh giá sức khỏe kỹ thuật, xem hệ thống công nghệ doanh thu có giúp ra quyết định đúng, hiển thị đúng dữ liệu và hỗ trợ cách doanh nghiệp tiếp cận thị trường hay không."],"MOD-008":["Đánh giá Khung KPI & Quản lý hiệu suất","Đánh giá khung KPI, hệ thống đo lường và hạ tầng báo cáo hiệu suất hiện tại, xem có theo dõi đúng chỉ số không, định nghĩa có thống nhất giữa các đội không và báo cáo có cho lãnh đạo đủ tầm nhìn để ra quyết định không. Xác định khoảng trống đo lường, chỉ số lệch giữa các đội và điểm mù báo cáo."],"MOD-009":["Đánh giá Thiết kế tổ chức & Gắn kết GTM","Đánh giá cấu trúc tổ chức GTM, định nghĩa vai trò và sự phối hợp liên phòng ban giữa marketing, bán hàng và chăm sóc khách hàng. Xem tổ chức có được cấu trúc để thực thi chiến lược GTM hiệu quả không, xác định khoảng trống phụ trách, vai trò mơ hồ, trách nhiệm lệch và sự kém hiệu quả gây cản trở hoạt động doanh thu."],"MOD-010":["Xác định & Đánh giá cơ hội AI","Xác định và đánh giá các trường hợp dùng AI tiềm năng trong toàn doanh nghiệp bằng cách phân tích workflow, quy trình và dữ liệu, tìm cơ hội tự động hóa, tăng cường và nâng hiệu suất. Đưa ra góc nhìn định hướng về nơi AI tạo giá trị và mức khả thi tương đối của từng cơ hội."],"MOD-011":["Đánh giá mức sẵn sàng dữ liệu cho AI","Đánh giá nền tảng dữ liệu của tổ chức có hỗ trợ được các trường hợp dùng AI không, bao gồm chất lượng, cấu trúc, khả năng truy cập và độ đầy đủ."],"MOD-012":["Đánh giá Công cụ & Nền tảng AI","Đánh giá bộ công cụ AI và công nghệ hiện tại để xác định khoảng trống năng lực, phần trùng lặp và mức sẵn sàng hỗ trợ các trường hợp dùng AI."],"MOD-013":["Đánh giá Quản trị & Rủi ro AI","Đánh giá mức sẵn sàng triển khai AI có trách nhiệm thông qua cơ cấu quản trị, cách quản lý rủi ro và các yếu tố tuân thủ."],"MOD-014":["Đánh giá mức sẵn sàng của tổ chức cho AI","Đánh giá mức sẵn sàng về con người, kỹ năng và văn hóa để áp dụng và mở rộng AI hiệu quả."],"MOD-015":["Đánh giá Sự đồng thuận & Bảo trợ của lãnh đạo","Đánh giá sự đồng thuận của ban điều hành, mức độ bảo trợ và sự sẵn sàng của lãnh đạo trong việc thúc đẩy và duy trì thay đổi."],"MOD-016":["Đánh giá Vai trò, Quy trình & Trách nhiệm","Đánh giá độ rõ ràng của vai trò, trách nhiệm và quy trình để đảm bảo trách nhiệm giải trình và giảm vướng mắc khi thực hiện thay đổi."],"MOD-017":["Đánh giá Các bên liên quan & Mức sẵn sàng áp dụng","Đánh giá nhận thức, sự ủng hộ và mức sẵn sàng của các bên liên quan đối với cách làm việc mới, bao gồm rủi ro phản kháng và sự mệt mỏi vì thay đổi."],"MOD-018":["Đánh giá Truyền thông & Đào tạo cho thay đổi","Đánh giá hiệu quả của chiến lược truyền thông và hạ tầng đào tạo cần thiết để thay đổi được áp dụng thành công."],"MOD-019":["Đánh giá Sức khỏe hệ thống & Portal","Đánh giá sức khỏe tổng thể, cấu hình và quản trị của CRM để tìm điểm kém hiệu quả, cấu hình sai, nợ kỹ thuật và khoảng trống quản trị. Đây là rà soát vận hành tổng quát, không đi sâu vào mô hình dữ liệu, chất lượng dữ liệu hay tích hợp (đã có đánh giá riêng). Cung cấp bức tranh ưu tiên về phần đang tốt và phần cần xử lý trước khi đầu tư thêm."],"MOD-020":["Đánh giá Mô hình dữ liệu & Kiến trúc CRM","Đánh giá cấu trúc và thiết kế mô hình dữ liệu HubSpot CRM xem có hỗ trợ báo cáo, tự động hóa và quy trình kinh doanh mở rộng được không. Xem xét kiến trúc đối tượng, thuộc tính, liên kết và pipeline, tìm khoảng trống cấu trúc, giới hạn thiết kế và điểm lệch so với quy trình kinh doanh thực tế."],"MOD-021":["Đánh giá Chất lượng & Tính toàn vẹn dữ liệu","Đánh giá độ đầy đủ, chính xác, nhất quán và tin cậy của dữ liệu CRM xem có hỗ trợ báo cáo, tự động hóa và ra quyết định hiệu quả không. Đánh giá chính dữ liệu chứ không phải cấu trúc mô hình, tìm bản ghi thiếu, sai, trùng lặp hoặc định dạng không nhất quán làm giảm giá trị của CRM như nguồn dữ liệu chuẩn."],"MOD-022":["Đánh giá Tích hợp & Luồng dữ liệu","Đánh giá tích hợp hệ thống, đồng bộ dữ liệu và độ tin cậy của luồng dữ liệu trong toàn bộ hệ thống công nghệ để tìm rủi ro, điểm kém hiệu quả và khoảng trống."],"MOD-023":["Khảo sát Các bên liên quan, Vai trò & Quy trình","Khảo sát hiện trạng vai trò, trách nhiệm và quy trình GTM thông qua phỏng vấn có cấu trúc. Làm rõ ai phụ trách gì, công việc thực sự được làm thế nào giữa marketing, bán hàng và chăm sóc khách hàng, và quy trình nào đã được định nghĩa hay đang vận hành không chính thức. Tạo nền tảng cho việc vẽ workflow và cải tiến tiếp theo. Ghi nhận thực tế vận hành, không đánh giá thiết kế cơ cấu tổ chức."],"MOD-024":["Vẽ Workflow & Phân tích bàn giao","Ghi nhận và phân tích các workflow đầu-cuối giữa marketing, bán hàng và chăm sóc khách hàng, đặc biệt tại các điểm bàn giao thường xảy ra vướng mắc, hiểu lầm và đứt gãy quy trình. Chuyển kết quả khảo sát thành sơ đồ workflow cho thấy công việc thực sự diễn ra so với dự định, và chỉ ra nơi bàn giao thất bại gây vấn đề về sau."],"MOD-025":["Đánh giá Gắn kết Quy trình & Hệ thống","Đánh giá mức độ các quy trình GTM đã định nghĩa được phản ánh, cấu hình và hỗ trợ trong hệ thống công nghệ, đặc biệt là HubSpot. Xác định nơi cấu hình hỗ trợ đúng quy trình, nơi gây vướng mắc hoặc phải làm vòng, và nơi quy trình được thực hiện hoàn toàn ngoài hệ thống. Đánh giá ở cấp độ thực thi workflow."],"MOD-026":["Đánh giá Phễu, SLA & Nhịp vận hành","Đánh giá lớp vận hành và quản trị của phễu GTM: SLA có được định nghĩa rõ, áp dụng nhất quán và đo lường được không, và nhịp vận hành giữa marketing, bán hàng và CS có đủ minh bạch và trách nhiệm không. Tập trung vào quản trị quy trình thay vì dữ liệu hiệu suất phễu."],"MOD-027":["Đánh giá Hành trình khách hàng","Vẽ hành trình khách hàng đầu-cuối để tìm khoảng trống, sự thiếu nhất quán và vướng mắc giữa các điểm chạm."],"MOD-028":["Đánh giá Trải nghiệm chuyển đổi","Đánh giá trải nghiệm người dùng, độ rõ ràng của thông điệp và vướng mắc tại các điểm chuyển đổi (website, biểu mẫu, landing page và CTA) để tìm nơi khách tiềm năng rời đi hoặc mất hứng thú."],"MOD-029":["Đánh giá Trải nghiệm bán hàng & Bàn giao","Đánh giá trải nghiệm của người mua, không phải cách đội bán hàng thực thi, trong quá trình tiếp cận bán hàng và bàn giao giữa các đội, xem khách tiềm năng cảm nhận gì và gặp gì ở mỗi giai đoạn."],"MOD-030":["Đánh giá Onboarding & Trải nghiệm khách hàng","Đánh giá trải nghiệm onboarding, thời gian đạt giá trị và các tương tác đầu tiên sau bán để tìm vướng mắc, khoảng trống và rủi ro rời bỏ trong giai đoạn đầu quan trọng của mối quan hệ."],"MOD-031":["Đánh giá Trải nghiệm giữ chân & Mở rộng","Đánh giá những gì khách hàng thực sự trải qua trong các tương tác giữ chân và mở rộng, khác với cách doanh nghiệp được thiết kế để tăng trưởng, xem xét chất lượng tương tác, điểm chạm mở rộng và trải nghiệm nhận giá trị liên tục."],"MOD-032":["Đánh giá Hỗ trợ & Tự phục vụ","Đánh giá trải nghiệm của khách hàng khi được hỗ trợ và khi dùng tài nguyên tự phục vụ: khách nhận trợ giúp ra sao, vấn đề được giải quyết hiệu quả thế nào và kênh tự phục vụ giảm vướng mắc, tăng hài lòng tốt đến đâu."],"MOD-033":["Đánh giá SEO & AEO","Đánh giá cấu trúc nội dung, SEO kỹ thuật và mức sẵn sàng cho tìm kiếm AI để tìm khoảng trống về khả năng được tìm thấy, lập chỉ mục và trở thành câu trả lời trên công cụ tìm kiếm và nền tảng AI."],"MOD-034":["Chiến lược ICP & Phân khúc","Xác định hồ sơ khách hàng lý tưởng và chiến lược phân khúc để ưu tiên những nhóm khách hàng có giá trị tăng trưởng cao nhất."],"MOD-035":["Chiến lược Định vị & Thông điệp","Xác định cách công ty tạo khác biệt và truyền đạt giá trị đến khách hàng mục tiêu."],"MOD-036":["Chiến lược Mô hình GTM, Kênh & Vòng đời","Xác định cách doanh nghiệp thu hút, chuyển đổi, giữ chân và mở rộng khách hàng qua các kênh và giai đoạn vòng đời."],"MOD-037":["Lập kế hoạch & Lộ trình GTM","Chuyển chiến lược thành kế hoạch thực thi có ưu tiên, với các sáng kiến, mốc thời gian và chỉ số thành công rõ ràng."],"MOD-038":["Chiến lược SEO & AEO","Xây dựng chiến lược nội dung và tìm kiếm có thể mở rộng, tối ưu cho cả công cụ tìm kiếm truyền thống và khám phá bằng AI."],"MOD-039":["Chiến lược & Thiết kế chương trình ABM","Xây dựng chiến lược marketing theo tài khoản phù hợp với tài khoản mục tiêu, mô hình bán hàng và mục tiêu doanh thu."],"MOD-040":["Chiến lược Dữ liệu & Nhắm mục tiêu ABM","Xác định cách dùng dữ liệu tài khoản, tín hiệu và làm giàu dữ liệu để thúc đẩy nhắm mục tiêu và tương tác."],"MOD-041":["Chiến lược Ưu tiên trường hợp dùng AI & Business case","Xác định và xếp hạng ưu tiên các trường hợp dùng AI dựa trên tác động kinh doanh, tính khả thi và sự phù hợp chiến lược."],"MOD-042":["Chiến lược Năng lực & Mức trưởng thành AI","Xác định các năng lực cần có để áp dụng AI trên dữ liệu, hệ thống, quản trị và đội ngũ."],"MOD-043":["Lập kế hoạch Đầu tư & Lộ trình AI","Xây dựng lộ trình áp dụng AI theo giai đoạn, bao gồm thứ tự triển khai, ưu tiên đầu tư và kết quả kỳ vọng."],"MOD-044":["Thiết kế Chiến lược & Phương pháp thay đổi","Xác định chiến lược tổng thể để quản lý và thúc đẩy thay đổi tổ chức phù hợp với mục tiêu kinh doanh."],"MOD-045":["Chiến lược Gắn kết & Truyền thông với các bên liên quan","Xác định cách các bên liên quan được tham gia, cập nhật thông tin và đồng thuận trong suốt quá trình thay đổi."],"MOD-046":["Chiến lược Đào tạo & Hỗ trợ năng lực","Xác định cách đào tạo và hỗ trợ đội ngũ áp dụng quy trình, hệ thống hoặc cách làm việc mới."],"MOD-047":["Lập kế hoạch Áp dụng & Triển khai","Xác định cách thay đổi được triển khai trong toàn tổ chức, bao gồm thứ tự, thí điểm và cách mở rộng."],"MOD-048":["Thiết kế Mô hình dữ liệu & Hệ thống CRM","Thiết kế mô hình dữ liệu, đối tượng và cấu trúc CRM cần thiết để hỗ trợ quy trình GTM và báo cáo."],"MOD-049":["Thiết kế Tích hợp & Luồng dữ liệu","Xác định cách dữ liệu luân chuyển giữa các hệ thống và cách cấu trúc tích hợp."],"MOD-050":["Thiết kế Quản trị & Quản lý dữ liệu","Xác định tiêu chuẩn và quy trình để đảm bảo dữ liệu chất lượng, nhất quán và đáng tin cậy."],"MOD-051":["Thiết kế Mô hình & Quy trình bán hàng","Thiết kế quy trình bán hàng có cấu trúc, phù hợp với mô hình GTM và hành trình người mua."],"MOD-052":["Thiết kế Kiến trúc chiến dịch & Phễu","Thiết kế cấu trúc chiến dịch marketing và kiến trúc phễu để hỗ trợ tạo nhu cầu và chuyển đổi."],"MOD-053":["Thiết kế Vòng đời khách hàng & Bàn giao","Thiết kế các giai đoạn vòng đời và quy trình bàn giao giữa marketing, bán hàng và đội ngũ khách hàng."],"MOD-054":["Thiết kế Trường hợp dùng & Workflow AI","Thiết kế workflow và tự động hóa ứng dụng AI phù hợp với các trường hợp dùng được ưu tiên."],"MOD-055":["Chiến lược & Thiết kế Agent AI","Xác định kiến trúc và hành vi của các agent AI hỗ trợ workflow GTM."],"MOD-056":["Thiết kế Dữ liệu & Quản trị cho AI","Xác định cách dữ liệu được cấu trúc, quản trị và truy cập cho các hệ thống AI."],"MOD-057":["Thiết kế Khung KPI & Đo lường","Xác định chỉ số hiệu suất và cấu trúc đo lường phù hợp với chiến lược GTM."],"MOD-058":["Thiết kế Kiến trúc Dashboard & Báo cáo","Thiết kế dashboard và hệ thống báo cáo để tăng khả năng quan sát và hỗ trợ ra quyết định."],"MOD-059":["Thiết kế Kiến trúc Tín hiệu & Cá nhân hóa Marketing","Thiết kế kiến trúc dữ liệu, luồng tín hiệu và khung token cá nhân hóa vận hành Loop Marketing ở quy mô lớn. Xác định cách tín hiệu hành vi, dữ liệu làm giàu và thuộc tính CRM ánh xạ vào các trường hợp cá nhân hóa trên email, web và nội dung, tạo bản thiết kế mà mọi triển khai hệ thống marketing sau đó tuân theo."],"MOD-060":["Triển khai Kiến trúc & Mô hình dữ liệu CRM","Triển khai mô hình dữ liệu CRM, gồm đối tượng, thuộc tính, giai đoạn vòng đời và pipeline, theo kiến trúc đã thiết kế."],"MOD-061":["Thiết lập CRM","Cấu hình các thiết lập cốt lõi của CRM, quyền truy cập người dùng, phân quyền và thiết lập hệ thống nền tảng."],"MOD-062":["Di chuyển dữ liệu & Nâng cao chất lượng dữ liệu CRM","Chuẩn bị, di chuyển và xác thực dữ liệu vào CRM, đảm bảo chính xác, nhất quán và dùng được."],"MOD-063":["Triển khai Quy trình bán hàng & Quản lý lead","Triển khai quy trình bán hàng và workflow quản lý lead phù hợp với mô hình GTM và vòng đời đã xác định."],"MOD-064":["Triển khai Tự động hóa & Workflow","Xây dựng workflow tự động để tinh gọn quy trình, đảm bảo quản trị và nâng cao hiệu quả vận hành."],"MOD-065":["Triển khai Báo cáo & Dashboard","Xây dựng báo cáo và dashboard để theo dõi hiệu suất pipeline, hoạt động bán hàng và dự báo."],"MOD-066":["Triển khai Tích hợp gốc HubSpot","Triển khai và cấu hình các tích hợp gốc trên HubSpot Marketplace để kết nối hệ thống, đồng bộ dữ liệu và tạo workflow liền mạch giữa các công cụ."],"MOD-067":["Thiết lập Marketing Hub","Cấu hình các thiết lập nền tảng, tên miền và hạ tầng hệ thống Marketing Hub cần cho hoạt động marketing."],"MOD-068":["Thiết lập Quản lý lead & Tự động hóa vòng đời","Triển khai quản lý vòng đời lead, chấm điểm và tự động hóa để đưa khách tiềm năng từ lead thành khách hàng."],"MOD-069":["Thiết lập Chiến dịch, Chuyển đổi & Kênh","Triển khai cấu trúc chiến dịch, đường chuyển đổi và cơ chế theo dõi để hỗ trợ tạo nhu cầu và phân bổ."],"MOD-070":["Cấu hình HubSpot AEO","Cấu hình các tính năng AEO gốc của HubSpot: thiết lập giọng điệu thương hiệu, cấu hình dashboard theo dõi g HubSpot."],"MOD-082":["Triển khai Quy trình bán hàng & Pipeline","Triển khai quy trình bán hàng, pipeline và workflow quản lý lead phù hợp với mô hình bán hàng và vòng đời đã xác định."],"MOD-083":["Triển khai Công cụ năng suất & Hỗ trợ bán hàng","Triển khai công cụ năng suất bán hàng để tăng hiệu quả, tính nhất quán và khả năng thực thi của đội bán hàng."],"MOD-084":["Cấu hình & Triển khai Prospecting Agent","Triển khai agent tìm khách hàng bằng AI, gồm logic nhắm mục tiêu, cá nhân hóa và tích hợp workflow."],"MOD-085":["Triển khai Báo cáo bán hàng & Dự báo","Xây dựng hệ thống báo cáo và dashboard để theo dõi hiệu suất pipeline, dự báo và năng suất bán hàng."],"MOD-086":["Triển khai Phân vùng & Phân khúc tài khoản","Triển khai mô hình vùng, phân khúc tài khoản và cơ cấu phụ trách để phủ thị trường bán hàng hiệu quả."],"MOD-087":["Thiết lập Commerce Hub & Thanh toán","Cấu hình thiết lập nền tảng Commerce Hub, hạ tầng thanh toán và các năng lực thương mại cấp hệ thống."],"MOD-088":["Triển khai Thư viện sản phẩm & Cấu trúc giá","Triển khai danh mục sản phẩm và cấu trúc giá cần thiết cho báo giá, thanh toán và báo cáo."],"MOD-089":["Triển khai CPQ (Cấu hình & Tự động hóa báo giá)","Triển khai tạo báo giá, logic định giá và workflow phê duyệt để báo giá nhanh và chính xác."],"MOD-090":["Triển khai Quản lý gói đăng ký & Thanh toán","Triển khai quản lý vòng đời gói đăng ký, logic thanh toán và quy trình doanh thu định kỳ."],"MOD-091":["Triển khai Thanh toán, Checkout & Thu tiền","Triển khai trải nghiệm checkout và workflow thu tiền để giao dịch của khách hàng diễn ra liền mạch."],"MOD-092":["Tự động hóa vòng đời doanh thu & Tích hợp hệ thống tài chính","Triển khai tự động hóa vòng đời doanh thu đầu-cuối và tích hợp hệ thống tài chính để vận hành chính xác, mở rộng được."],"MOD-093":["Triển khai Báo cáo doanh thu, Tuân thủ & Quản trị","Triển khai báo cáo doanh thu, khả năng quan sát tài chính và khung quản trị để hỗ trợ tuân thủ và ra quyết định."],"MOD-094":["Thiết lập Service Hub","Cấu hình thiết lập nền tảng Service Hub và các kênh giao tiếp với khách hàng cho hoạt động hỗ trợ."],"MOD-095":["Triển khai Pipeline ticket & SLA","Triển khai pipeline ticket, SLA và workflow dịch vụ cốt lõi để quản lý yêu cầu hỗ trợ."],"MOD-096":["Triển khai Định tuyến, Tự động hóa & Vận hành dịch vụ","Triển khai logic định tuyến và tự động hóa để phân công ticket hiệu quả, quản lý khối lượng công việc và phối hợp nội bộ."],"MOD-097":["Triển khai Không gian Help Desk & Năng suất nhân viên hỗ trợ","Cấu hình không gian Help Desk và công cụ cho nhân viên để tăng hiệu suất, khả năng quan sát và kết quả."],"MOD-098":["Triển khai Tự phục vụ, Cơ sở tri thức & Cổng khách hàng","Triển khai trải nghiệm tự phục vụ để giảm tải hỗ trợ và giúp khách hàng tiếp cận thông tin dễ hơn."],"MOD-099":["Triển khai Hệ thống Chăm sóc khách hàng & Phản hồi","Triển khai workflow chăm sóc khách hàng, chấm điểm sức khỏe và hệ thống phản hồi để tăng giữ chân và hài lòng."],"MOD-100":["Cấu hình & Triển khai Customer Agent","Triển khai agent hỗ trợ khách hàng bằng AI để trả lời câu hỏi, hỗ trợ người dùng và chuyển cho nhân viên khi cần."],"MOD-101":["Triển khai Báo cáo & Phân tích dịch vụ","Xây dựng hệ thống báo cáo để theo dõi hiệu quả hỗ trợ, mức hài lòng của khách hàng và hiệu suất vận hành."],"MOD-102":["Thiết lập Data Hub","Thiết lập hạ tầng Data Hub và kiến trúc tập dữ liệu làm nền tảng cho mọi hoạt động dữ liệu, báo cáo và năng lực AI. Bao gồm cấu hình Data Hub ban đầu, thiết kế và xây dựng tập dữ liệu, đồng bộ mô hình dữ liệu và các quyết định cấu trúc về cách dữ liệu luân chuyển và được truy vấn trong HubSpot."],"MOD-103":["Triển khai Tích hợp & Đồng bộ dữ liệu","Triển khai kết nối đồng bộ hai chiều và một chiều giữa HubSpot và hệ thống bên ngoài bằng hạ tầng đồng bộ của Data Hub. Cấu hình ánh xạ trường, logic đồng bộ, quy tắc xử lý xung đột và chuyển đổi dữ liệu để luồng dữ liệu sạch và đáng tin cậy."],"MOD-104":["Triển khai Chất lượng dữ liệu, Làm giàu & Dữ liệu ý định mua","Triển khai các năng lực gốc của HubSpot về chất lượng dữ liệu, làm giàu dữ liệu và dữ liệu ý định mua trong Data Hub. Cấu hình tự động hóa chất lượng để bản ghi sạch và nhất quán; thiết lập HubSpot Data Enrichment để tự động bổ sung dữ liệu liên hệ và công ty; kích hoạt Buyer Intent để hiển thị tài khoản có tín hiệu mua. Là một phần của việc xây dựng Data Hub ban đầu, dùng công cụ gốc của HubSpot thay vì thiết kế hệ thống tín hiệu tùy chỉnh."],"MOD-105":["Mô hình hóa dữ liệu, Tính toán & Đồng bộ doanh thu","Thiết kế và triển khai mô hình dữ liệu, thuộc tính tính toán và cấu trúc dữ liệu doanh thu giúp báo cáo và phân tích trong HubSpot chính xác. Chuyển mô hình doanh thu và logic kinh doanh của khách hàng vào lớp dữ liệu HubSpot, đảm bảo các chỉ số quan trọng nhất (pipeline, doanh thu, giữ chân, LTV, tỷ lệ rời bỏ) được tính đúng, định nghĩa nhất quán và có sẵn trong mọi báo cáo và dashboard."],"MOD-106":["Triển khai Tự động hóa, Workflow & Logic lập trình","Triển khai năng lực tự động hóa nâng cao của Data Hub: workflow lập trình, custom coded action và logic theo sự kiện, để tự động hóa quy trình kinh doanh phức tạp vượt quá workflow tiêu chuẩn của HubSpot. Là một phần của việc xây dựng Data Hub ban đầu, không phải dự án kỹ thuật riêng."],"MOD-107":["Kích hoạt dữ liệu, Agent AI & Trí tuệ liên Hub","Triển khai chiến lược kích hoạt dữ liệu, agent dữ liệu AI và trí tuệ liên Hub để đưa dữ liệu vào hoạt động marketing, bán hàng và dịch vụ."],"MOD-108":["Triển khai Quản trị, Giám sát & Báo cáo dữ liệu","Triển khai khung quản trị, hệ thống giám sát và hạ tầng báo cáo để Data Hub vận hành ổn định, nhất quán và các bên liên quan thấy rõ sức khỏe dữ liệu. Bao gồm áp dụng chính sách quản trị dữ liệu, thiết lập giám sát vận hành và lớp báo cáo giúp lãnh đạo và đội vận hành tin tưởng vào dữ liệu dùng để ra quyết định."],"MOD-109":["Phát triển Trợ lý AI tùy chỉnh (dựa trên LLM)","Thiết kế và xây dựng trợ lý AI tùy chỉnh bằng mô hình ngôn ngữ lớn (như GPT, Claude, Gemini) cho các trường hợp kinh doanh cụ thể."],"MOD-110":["Phát triển Agent AI tùy chỉnh","Thiết kế và xây dựng agent AI có thể tự thực hiện các tác vụ nhiều bước, dùng công cụ, ra quyết định và hoàn thành workflow trong phạm vi xác định. Vượt ra ngoài trợ lý AI hội thoại để xây dựng hệ thống hành động: truy vấn dữ liệu, gọi API, kích hoạt workflow HubSpot và hoàn thành tác vụ phức tạp với rất ít can thiệp. Dành cho trường hợp tự động hóa truyền thống không đủ và cần ra quyết định thông minh khi thực thi."],"MOD-111":["Triển khai Hệ thống đa agent & Điều phối","Thiết kế và triển khai hệ thống đa agent, nơi các agent AI chuyên biệt phối hợp hoàn thành workflow phức tạp nhiều bước vượt quá khả năng của một agent. Xây dựng toàn bộ mạng agent, xác định vai trò, giao thức giao tiếp, logic điều phối và cơ chế bàn giao để tạo hệ thống AI đáng tin cậy, mở rộng được."],"MOD-112":["Phát triển HubSpot Breeze Assistant","Thiết kế và cấu hình Breeze Assistant tùy chỉnh trong HubSpot, điều chỉnh năng lực AI gốc của nền tảng theo workflow, giọng điệu thương hiệu và nhu cầu vận hành của khách hàng. Bao gồm cấu hình prompt, trợ lý nội dung, tích hợp dữ liệu CRM cho câu trả lời theo ngữ cảnh và tích hợp workflow, mang lại trải nghiệm AI gốc của HubSpot phù hợp với cách đội ngũ làm việc mà không cần phát triển ứng dụng bên ngoài."],"MOD-113":["Kỹ thuật ngữ cảnh & Cấu hình tri thức","Thiết kế và mã hóa ngữ cảnh kinh doanh như ICP, thông điệp, quy trình, kiến thức, quy tắc, logic quyết định và cấu trúc dữ liệu vào hệ thống AI để đầu ra chính xác, nhất quán và đúng định hướng."],"MOD-114":["Kỹ thuật Tự động hóa & Workflow GTM nâng cao","Thiết kế và triển khai hệ thống tự động hóa phức tạp trên các đối tượng và quy trình HubSpot để vận hành GTM ở quy mô lớn. Vượt ra ngoài thiết lập workflow tiêu chuẩn với logic nâng cao: cây quyết định nhiều nhánh, tự động hóa liên đối tượng, custom coded action và trigger theo hành vi, giúp áp dụng chiến lược GTM ở quy mô lớn mà không cần thao tác thủ công."],"MOD-115":["Hệ thống Làm giàu dữ liệu & Kích hoạt tín hiệu","Triển khai pipeline làm giàu dữ liệu, tích hợp tín hiệu bên ngoài và workflow kích hoạt giúp nâng cao nhắm mục tiêu, phân khúc và thông tin GTM. Xây dựng hạ tầng dữ liệu cung cấp cho hoạt động GTM, đảm bảo dữ liệu và tín hiệu hành vi phù hợp đến đúng hệ thống vào đúng thời điểm."],"MOD-116":["Kỹ thuật Hệ thống Outbound & Tìm khách hàng","Thiết kế và xây dựng hệ thống outbound và tìm khách hàng tự động kết hợp dữ liệu CRM, tín hiệu hành vi và thông điệp có cấu trúc để tạo pipeline hiệu quả ở quy mô lớn. Xây dựng hạ tầng kỹ thuật cho outbound, từ xác định và ưu tiên khách tiềm năng dựa trên dữ liệu đến trigger sequence tự động và thực thi đa kênh, để outbound là hệ thống lặp lại, đo lường được."],"MOD-117":["Tích hợp & Điều phối liên hệ thống","Triển khai tích hợp và điều phối luồng dữ liệu giữa HubSpot và hệ thống bên ngoài bằng connector gốc, nền tảng middleware và công cụ tích hợp của HubSpot, không cần viết mã tùy chỉnh. Đảm bảo dữ liệu đúng luân chuyển ổn định và kích hoạt đúng hành động tiếp theo. Khác với phát triển API tùy chỉnh vì dùng công cụ gốc và low-code."],"MOD-118":["Phát triển Hệ thống Thử nghiệm & Tăng trưởng","Thiết kế và xây dựng hạ tầng kỹ thuật cho thử nghiệm GTM có cấu trúc, giúp khách hàng kiểm tra, đo lường và cải tiến nhắm mục tiêu, thông điệp, tự động hóa và workflow một cách hệ thống. Biến thử nghiệm tự phát thành hệ thống lặp lại, có giả thuyết rõ ràng, đo lường chặt chẽ và tích lũy bài học thành lợi thế tăng trưởng."],"MOD-119":["Phát triển API & Webhook tùy chỉnh","Thiết kế và xây dựng tích hợp tùy chỉnh giữa HubSpot và hệ thống bên ngoài bằng API, webhook và middleware riêng khi công cụ tích hợp tiêu chuẩn không đáp ứng được. Giải quyết đồng bộ dữ liệu phức tạp, trigger workflow nâng cao và yêu cầu liên thông hệ thống cần phát triển thay vì cấu hình."],"MOD-120":["Triển khai Pipeline Thu thập tín hiệu & Làm giàu dữ liệu","Xây dựng hạ tầng kỹ thuật thu thập tín hiệu hành vi từ web, email và nội dung, làm giàu bản ghi liên hệ và công ty từ nguồn dữ liệu bên thứ ba, rồi kích hoạt các thuộc tính đã làm giàu thành phân khúc động và token cá nhân hóa. Là nền tảng dữ liệu giúp Loop Marketing siêu cá nhân hóa ở quy mô lớn."],"MOD-121":["Xây dựng Kiến trúc Tự động hóa Marketing & Vận hành Loop","Triển khai xương sống tự động hóa giúp Loop Marketing vận hành liên tục. Xây dựng logic trigger, workflow định tuyến nội dung, phân nhánh nuôi dưỡng và điều phối giai đoạn kết nối Express, Tailor, Amplify và Evolve tự động, để mỗi chu kỳ Loop chạy với ít công sức thủ công và ngày càng tốt hơn."],"MOD-122":["Xây dựng Hệ thống sản xuất nội dung AI","Thiết kế và xây dựng hạ tầng vận hành sản xuất nội dung có AI hỗ trợ ở quy mô lớn, động cơ của giai đoạn Tailor trong Loop Marketing. Cung cấp thư viện prompt, mẫu brief, workflow AI theo định dạng và quy trình biên tập để đội ngũ tạo nội dung cá nhân hóa chất lượng cao nhất quán và nhanh hơn trên mọi kênh."],"MOD-123":["Triển khai Bộ máy cá nhân hóa & Smart Content","Triển khai năng lực cá nhân hóa nâng cao mang lại trải nghiệm động trên email và web dựa trên dữ liệu liên hệ đã làm giàu, tín hiệu hành vi và thuộc tính CRM. Vượt ra ngoài phân khúc cơ bản để xây dựng bộ máy cá nhân hóa thực sự: quy tắc smart content, khung token động và định tuyến đối tượng theo hành vi, giúp mọi điểm chạm phù hợp với từng người."],"MOD-124":["Xây dựng Hệ thống Phân tích & Thông tin Loop","Triển khai lớp Evolve của Loop Marketing: phân tích, ghi nhận bài học và hạ tầng thông tin biến dữ liệu chiến dịch thành nhận định có cấu trúc cho chu kỳ Loop tiếp theo. Xây dựng hệ thống báo cáo, theo dõi hiệu quả nội dung, mô hình phân bổ và khung rút kinh nghiệm, để Loop Marketing là hệ thống tăng trưởng kép thay vì các chiến dịch rời rạc."],"MOD-125":["Onboarding & Đào tạo cốt lõi HubSpot","Dự án onboarding có cấu trúc giúp đội ngũ khách hàng tự tin sử dụng HubSpot sau khi triển khai. Bao gồm giới thiệu nền tảng, đào tạo tính năng cốt lõi và hướng dẫn workflow cơ bản cho các Hub trong phạm vi, để mọi người dùng vận hành HubSpot hiệu quả từ ngày đầu. Mức độ phức tạp phụ thuộc vào số Hub và quy mô đội ngũ."],"MOD-126":["Đào tạo & Hỗ trợ năng lực nâng cao theo vai trò","Dự án hỗ trợ năng lực toàn diện, xây dựng kỹ năng HubSpot chuyên sâu theo từng vai trò. Giả định đã hoàn tất onboarding cốt lõi, tập trung vào tính năng nâng cao, workflow theo vai trò và thực hành tốt nhất cho từng bộ phận, để đội ngũ không chỉ dùng mà còn dùng HubSpot hiệu quả. Thiết kế là chương trình một lần, không phải hỗ trợ đào tạo liên tục."],"MOD-127":["Hỗ trợ Onboarding & Đào tạo liên tục theo vai trò","Dịch vụ đào tạo định kỳ hỗ trợ năng lực HubSpot liên tục khi đội ngũ khách hàng phát triển. Giả định đã hoàn tất onboarding cốt lõi và đào tạo ban đầu, tập trung đưa thành viên mới vào chương trình đào tạo, cập nhật tài liệu theo bản phát hành HubSpot và xử lý nhu cầu phát sinh. Dành cho tổ chức đang tăng trưởng."],"MOD-128":["Hỗ trợ năng lực & Gắn kết cho lãnh đạo","Dự án chuyên biệt giúp lãnh đạo cấp cao dùng tính năng báo cáo, dự báo và tầm nhìn chiến lược của HubSpot. Dành cho người ra quyết định cần giá trị chiến lược từ dữ liệu HubSpot (rà soát pipeline, dự báo doanh thu, báo cáo hiệu suất) mà không cần thành người dùng chuyên sâu. Giúp lãnh đạo tự tin dùng HubSpot làm nguồn sự thật về hiệu quả kinh doanh."],"MOD-129":["Đào tạo Quy trình bán hàng & CRM","Đào tạo chuyên biệt kết nối kỹ năng HubSpot với việc thực thi quy trình bán hàng: không chỉ dạy cách dùng CRM mà còn cách vận hành pipeline, quản lý hoạt động và tuân thủ quy trình bán hàng đúng trong HubSpot. Giả định đã hoàn tất onboarding cốt lõi, tập trung đưa phương pháp bán hàng và kỷ luật quy trình vào thói quen dùng CRM hằng ngày."],"MOD-130":["Đào tạo Kỷ luật Pipeline, Dự báo & Doanh thu","Đào tạo và coaching nhằm xây dựng sự chặt chẽ trong quản lý pipeline, độ chính xác dự báo và kỷ luật doanh thu cho đội quản lý và lãnh đạo bán hàng. Vượt ra ngoài đào tạo công cụ để tập trung vào phương pháp, thói quen và nhịp quản lý tạo doanh thu dự đoán được: rà soát pipeline hiệu quả, kiểm tra deal kỹ lưỡng, dự báo tự tin và yêu cầu nhân viên chịu trách nhiệm theo tiêu chuẩn."],"MOD-131":["Đào tạo Tìm khách hàng Outbound","Đào tạo thực hành nâng cao năng lực outbound của đội bán hàng: cách tìm khách hàng hiệu quả, xây dựng và chạy sequence HubSpot, thiết kế kịch bản tiếp cận và thực thi có kỷ luật, nhất quán. Tập trung vào lớp đầu phễu: cách nhân viên tìm, tiếp cận và chuyển khách tiềm năng thành pipeline chất lượng bằng công cụ HubSpot. Khác với đào tạo quy trình CRM vì tập trung vào xây dựng pipeline."],"MOD-132":["Thực thi thay đổi & Quản lý áp dụng","Thực thi và quản lý chương trình thay đổi đang diễn ra, áp dụng phương pháp truyền thông và gắn kết đã xác định trong chiến lược. Giả định đã hoàn tất đánh giá sẵn sàng và chiến lược thay đổi, tập trung vận hành chương trình: truyền thông, xử lý phản kháng, củng cố hành vi áp dụng và theo dõi tiến độ đến khi go-live và sau đó."],"MOD-133":["Thiết lập Chỉ số áp dụng & Quản trị","Dự án chuyên biệt xây dựng hạ tầng đo lường và quản trị để theo dõi mức độ áp dụng so với chiến lược thay đổi và kế hoạch triển khai hiện có. Giả định đã hoàn tất chiến lược và kế hoạch, tập trung dựng lớp theo dõi: xác định chỉ số thành công, cấu hình công cụ đo lường và cơ cấu trách nhiệm để việc áp dụng được giám sát, báo cáo và quản lý."],"MOD-134":["Hỗ trợ năng lực & Áp dụng AI cho nhân sự","Dự án hỗ trợ năng lực có cấu trúc để xây dựng hiểu biết, kỹ năng và sự tự tin dùng AI hằng ngày sau khi triển khai công cụ AI. Cung cấp đào tạo theo vai trò, khung áp dụng và kích hoạt người dẫn dắt, giúp đội ngũ biết cách dùng và tích hợp AI vào workflow của mình. Dành cho tổ chức vừa đưa công cụ AI vào sử dụng."],"MOD-135":["Hỗ trợ SOP & Workflow tích hợp AI","Dự án chuyên biệt thiết kế lại và ghi nhận quy trình vận hành chuẩn và workflow với công cụ AI được tích hợp ngay tại điểm sử dụng. Chuyển cách làm việc hiện tại thành phiên bản có AI hỗ trợ, để AI là một phần tự nhiên của công việc chứ không phải phần thêm vào. Dành cho tổ chức đã có công cụ AI và đội ngũ đã quen cơ bản."],"MOD-136":["Phát triển Chiến dịch","Lên kế hoạch và phát triển chiến dịch đa kênh tích hợp để tạo pipeline và thúc đẩy nhu cầu."],"MOD-137":["Quản lý Chiến dịch","Quản lý việc phân phối chiến dịch trên các kênh để tăng độ phủ và tương tác."],"MOD-138":["Tối ưu Hiệu quả chiến dịch","Theo dõi và tối ưu hiệu quả chiến dịch để tăng tương tác, chuyển đổi và tạo pipeline."],"MOD-139":["Quản lý Chu kỳ chiến dịch Loop","Quản lý liên tục toàn bộ chu kỳ Loop Marketing, điều phối từng giai đoạn từ đặt mục tiêu và tinh chỉnh bản sắc thương hiệu đến sprint nội dung, phân phối đa kênh và rút kinh nghiệm Evolve có cấu trúc. Dành cho khách hàng muốn có đối tác dẫn dắt nhịp Loop, mỗi chu kỳ tích lũy từ chu kỳ trước nhờ bài học được ghi nhận và nhắm mục tiêu chính xác hơn."],"MOD-140":["Tối ưu Vòng đời & Hành trình","Quản lý và tối ưu các giai đoạn vòng đời và hành trình khách hàng để cải thiện tiến trình và chuyển đổi lead."],"MOD-141":["Tối ưu Nuôi dưỡng & Tự động hóa","Liên tục cải thiện chương trình nuôi dưỡng và workflow tự động để tăng tương tác và chuyển đổi."],"MOD-142":["Tối ưu Hiệu quả phễu","Phân tích và cải thiện tỷ lệ chuyển đổi và tiến trình qua các giai đoạn vòng đời trong phễu."],"MOD-143":["Tối ưu Trải nghiệm chuyển đổi","Tối ưu liên tục các điểm chuyển đổi trên hành trình khách hàng (landing page, CTA, biểu mẫu và trải nghiệm web) để tăng tỷ lệ chuyển đổi và chất lượng lead. Kết hợp phân tích hành vi, A/B testing và tinh chỉnh cá nhân hóa, với giả thuyết thử nghiệm dựa trên dữ liệu hiệu quả Loop Marketing."],"MOD-144":["Xây dựng Nền tảng SEO & AEO","Dự án thực thi biến chiến lược SEO và AEO hiện có thành nền tảng đã vận hành và tối ưu. Giả định đã hoàn tất đánh giá và chiến lược, bắt đầu từ triển khai: tối ưu các trang ưu tiên cho tìm kiếm và công cụ trả lời AI, triển khai dữ liệu có cấu trúc và xây dựng kiến trúc liên kết nội bộ để tạo uy tín chủ đề."],"MOD-145":["Sáng tạo & Tái sử dụng nội dung","Quản lý việc sáng tạo nội dung liên tục và tái sử dụng nội dung có AI hỗ trợ để mở rộng sản lượng hiệu quả."],"MOD-146":["Tối ưu tăng trưởng SEO & AEO","Tối ưu nội dung cho công cụ tìm kiếm và khám phá bằng AI để tăng mức hiển thị tự nhiên."],"MOD-147":["Phân phối nội dung & Vận hành truyền thông","Quản lý phân phối nội dung trên các kênh như video, podcast và mạng xã hội."],"MOD-148":["Thực thi Chiến dịch theo tài khoản","Thực thi liên tục các chiến dịch ABM đa kênh nhắm vào tài khoản ưu tiên cao. Quản lý toàn bộ hoạt động: tiếp cận chủ động, quảng cáo trả phí, trải nghiệm web cá nhân hóa và kịch bản tương tác, đảm bảo mọi điểm chạm của tài khoản mục tiêu nhất quán và phối hợp."],"MOD-149":["Vận hành ABM & Gắn kết doanh thu","Quản lý liên tục hạ tầng vận hành giúp bán hàng và marketing phối hợp quanh tài khoản mục tiêu. Duy trì danh sách tài khoản chung, điều phối nhịp rà soát pipeline, quản lý quy trình bàn giao và đảm bảo hoạt động ABM gắn trực tiếp với pipeline và doanh thu. Là cầu nối giữa thực thi marketing và bán hàng."],"MOD-150":["Hiệu quả & Tối ưu ABM","Phân tích và tối ưu liên tục hiệu quả chương trình ABM so với mục tiêu pipeline và doanh thu. Theo dõi xu hướng tương tác của tài khoản, đo lường hiệu quả chiến dịch và kênh, phân bổ ảnh hưởng đến pipeline và chuyển dữ liệu thành khuyến nghị chiến lược để liên tục cải thiện nhắm mục tiêu, thông điệp và phân bổ nguồn lực."],"MOD-151":["Xây dựng nền tảng & Ra mắt Quảng cáo trả phí","Dự án có cấu trúc để xây dựng và ra mắt chương trình quảng cáo trả phí từ đầu. Bao gồm kiến trúc tài khoản, cấu trúc chiến dịch, cấu hình đối tượng, thiết lập theo dõi và tích hợp HubSpot, bàn giao nền tảng hoạt động đầy đủ sẵn sàng cho quản lý liên tục. Dành cho trường hợp chưa có hạ tầng hoặc cần xây lại đáng kể."],"MOD-152":["Quản lý Quảng cáo trả phí","Quản lý liên tục chiến dịch quảng cáo trả phí trên tìm kiếm, mạng xã hội và hiển thị để tạo lưu lượng đúng mục tiêu, lead chất lượng và tăng trưởng pipeline. Đảm nhiệm toàn bộ vận hành: thiết lập, cấu hình đối tượng, quản lý ngân sách, tối ưu giá thầu và theo dõi lead, đảm bảo đầu tư hiệu quả và liên tục tối ưu."],"MOD-153":["Sprint Sáng tạo quảng cáo","Dự án ngắn hạn, tập trung sản xuất bộ tài sản sáng tạo quảng cáo cho một chiến dịch, sự kiện hoặc lần ra mắt cụ thể. Bàn giao gói sáng tạo hoàn chỉnh (nội dung, thiết kế và các phiên bản định dạng) trong thời hạn cố định, không cần cam kết dịch vụ sáng tạo dài hạn. Phù hợp với khách hàng có nhu cầu chiến dịch rõ ràng hoặc đang thử nghiệm kênh trả phí."],"MOD-154":["Sản xuất Sáng tạo & Quảng cáo trả phí","Sản xuất liên tục nội dung sáng tạo quảng cáo trên nhiều định dạng và kênh để thúc đẩy tương tác và chuyển đổi đối tượng mục tiêu. Bao gồm toàn bộ chu trình: lên ý tưởng, viết nội dung, thiết kế và điều chỉnh định dạng, đảm bảo luôn có tài sản sáng tạo mới phù hợp với ưu đãi và thông điệp chiến dịch."],"MOD-155":["Tối ưu Hiệu quả & Chuyển đổi Quảng cáo trả phí","Đo lường, thử nghiệm và tối ưu liên tục hiệu quả quảng cáo trả phí trên chiến dịch, sáng tạo và trang đích. Liên kết chi tiêu quảng cáo với pipeline và doanh thu bằng quản lý phân bổ chặt chẽ, chạy A/B test và thử nghiệm đa biến để tăng tỷ lệ chuyển đổi, và chuyển dữ liệu thành khuyến nghị về nhắm mục tiêu, thông điệp và phân bổ ngân sách."],"MOD-156":["Chương trình Cộng đồng & Tương tác","Quản lý liên tục sự phát triển, hoạt động và tương tác của cộng đồng thương hiệu và khách hàng. Xây dựng và kích hoạt nhóm khán giả quanh mối quan tâm chung, cách dùng sản phẩm hoặc nghề nghiệp, thúc đẩy lòng trung thành, kết nối giữa các thành viên và sự ủng hộ tự nhiên."],"MOD-157":["Chiến dịch Creator & Influencer","Dự án có phạm vi rõ ràng để lên kế hoạch và thực hiện chiến dịch creator hoặc influencer gắn với mục tiêu cụ thể: ra mắt sản phẩm, sự kiện, chiến dịch theo mùa hoặc tăng nhận diện. Bao gồm từ chọn creator và brief, sản xuất và đăng nội dung
